<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Troll Skin Baker</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0e1216; color: #dfe6da; font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 10px 14px; background: #151b21; position: sticky; top: 0; z-index: 2; }
  header button { background: #22303a; color: inherit; border: 1px solid #33424e; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  header button.on { background: #2f6b34; border-color: #4f9a55; }
  main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 14px; }
  #atlas { width: 100%; max-width: 1024px; image-rendering: auto; border: 1px solid #26313a; background: #000; }
  #view { width: 100%; max-width: 1200px; aspect-ratio: 12 / 5; border: 1px solid #26313a; }
  p { margin: 0; opacity: .75; }
</style>
<script type="importmap">
  { "imports": { "three": "../assets/vendor/three.module.min.js", "three/addons/": "../assets/vendor/addons/" } }
</script>
</head>
<body>
<header><strong>Skin baker</strong><span id="list"></span></header>
<main>
  <p>Each skin is composed here from its recipe in skins.js, then written out by tools/troll-skin-bake.mjs as skins/&lt;id&gt;.jpg and a picker thumbnail.</p>
  <canvas id="atlas" width="1024" height="1024"></canvas>
  <canvas id="view"></canvas>
</main>
<script type="module">
import * as THREE from "three";
import { SKINS, SKIN_BY_ID } from "../assets/games/troll-ops/skins.js";
import { build416 } from "../assets/games/troll-ops/weapon-416.js";
import { bakeAtlas } from "./troll-skin-draw.js";
import { WEAPON_DEFS } from "../assets/games/troll-ops/weapons.js";
import { resolveWeapon } from "../assets/games/troll-ops/attachments.js";

/* ------------------------------------------------------------- 3D preview */

const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas: view, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1216);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a1d20, 1.5));
const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(-2, 3, 2); scene.add(key);
const rim = new THREE.DirectionalLight(0x9fc4ff, 1.2); rim.position.set(2, 1, -3); scene.add(rim);
const cam = new THREE.PerspectiveCamera(24, 12 / 5, 0.01, 10);
let gun = null;

const def416 = resolveWeapon("problem416", { optic: "reflex" });
function showGun(skinId, texture, { side = "left", hands = false, w = 1200, h = 500 } = {}) {
  renderer.setSize(w, h, false);
  cam.aspect = w / h; cam.updateProjectionMatrix();
  if (gun) scene.remove(gun);
  gun = build416(def416, skinId, { texture });
  gun.traverse((o) => { if (o.userData.hand) o.visible = hands; });
  scene.add(gun);
  const c = new THREE.Vector3(0, -0.04, -0.14);
  if (side === "left") cam.position.set(-1.05, 0.14, -0.1);
  else if (side === "right") cam.position.set(1.05, 0.14, -0.2);
  else if (side === "three") cam.position.set(-0.7, 0.42, 0.55);
  else if (side === "thumb") cam.position.set(-0.84, 0.03, -0.14);
  cam.lookAt(side === "thumb" ? new THREE.Vector3(0, -0.055, -0.14) : c);
  renderer.render(scene, cam);
}

/* --------------------------------------------------------------------- UI */

const atlas = document.getElementById("atlas");
const list = document.getElementById("list");
let current = SKINS[0].id;
async function select(id) {
  current = id;
  for (const b of list.children) b.classList.toggle("on", b.dataset.id === id);
  await bakeAtlas(SKIN_BY_ID[id], atlas);
  const tex = new THREE.CanvasTexture(atlas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  showGun(id, tex, { side: "three" });
}
for (const s of SKINS) {
  const b = document.createElement("button");
  b.textContent = s.name;
  b.dataset.id = s.id;
  b.onclick = () => select(s.id);
  list.appendChild(b);
}
await select(current);

/* Driven by tools/troll-skin-bake.mjs. */
window.__bake = async (id) => {
  await select(id);
  const jpg = atlas.toDataURL("image/jpeg", 0.86);
  const tex = new THREE.CanvasTexture(atlas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  showGun(id, tex, { side: "thumb", w: 360, h: 128 });
  const thumb = view.toDataURL("image/jpeg", 0.84);
  return { jpg, thumb };
};
window.__render = async (id, side, w = 1200, h = 500) => {
  await select(id);
  const tex = new THREE.CanvasTexture(atlas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  showGun(id, tex, { side, w, h });
};
// The factory finish has no atlas, only a picker thumbnail.
window.__factoryThumb = () => { showGun(null, null, { side: "thumb", w: 360, h: 128 }); return view.toDataURL("image/jpeg", 0.84); };
window.__skins = SKINS.map((s) => s.id);
window.__ready = true;
</script>
</body>
</html>
