<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Troll Head Preview</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1d2a1f; color: #dfe6da; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 8px 12px; background: rgba(0,0,0,.45); z-index: 2; }
  #bar label { display: flex; gap: 6px; align-items: center; }
  canvas { display: block; }
  .tag { position: fixed; bottom: 14px; transform: translateX(-50%); font-weight: 600; letter-spacing: .04em; text-shadow: 0 1px 2px #000; text-align: center; }
  .tag small { display: block; font-weight: 400; opacity: .75; }
</style>
<script type="importmap">
  { "imports": { "three": "../assets/vendor/three.module.min.js", "three/addons/": "../assets/vendor/addons/" } }
</script>
</head>
<body>
<div id="bar">
  <strong>Troll head</strong>
  <label>Speed ×<input type="range" id="slow" min="0.1" max="1" step="0.05" value="1"></label>
  <label><input type="checkbox" id="front" checked> Front view</label>
  <button id="hit" type="button">Hit the flincher</button>
</div>
<script type="module">
// Four rigs, one per head behaviour (character.js, "head and neck"):
//   Turn   — aim sweeps left and right in steps: the head gets there first,
//            the chest after, the body last.
//   Run    — side-on at a run: the head holds level over the bouncing body.
//   Idle   — standing, aim held: small looks around that land and settle.
//   Flinch — hit from alternating sides every 1.6s (or on the button).
import * as THREE from "three";
import { buildHumanoid, poseHumanoid, gaitPhaseRate, aimRig, flinchRig } from "../assets/games/troll-ops/character.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d2a1f);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223322, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(4, 8, 5);
sun.castShadow = true;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 12), new THREE.MeshStandardMaterial({ color: 0x2f6b34, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
const mat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.7, metalness: 0.1 });

const ROLES = [
  { key: "turn", name: "Turn", note: "head leads, body follows" },
  { key: "run", name: "Run", note: "head holds level" },
  { key: "idle", name: "Idle", note: "looks around, settles" },
  { key: "flinch", name: "Flinch", note: "hit left / right / front" },
];
const rigs = ROLES.map((r, i) => {
  const rig = buildHumanoid(mat, { height: 1.8, gun: true });
  rig.root.position.x = (i - 1.5) * 2.2;
  scene.add(rig.root);
  const tag = document.createElement("div");
  tag.className = "tag";
  tag.innerHTML = `${r.name}<small>${r.note}</small>`;
  document.body.appendChild(tag);
  return { ...r, rig, tag, phase: 0 };
});

const $ = (id) => document.getElementById(id);
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

// Facing the camera is yaw PI (the rig's forward is -Z at yaw 0).
const FACE = Math.PI;
let hitSide = 0;
function hit() {
  const r = rigs[3];
  const k = hitSide++ % 3;
  // Round travel in the rig's frame: from its left, from its right, head-on.
  const d = [[1, 0], [-1, 0], [0, 1]][k];
  flinchRig(r.rig, d[0], d[1], k === 2 ? 1 : 0.6);
}
$("hit").addEventListener("click", hit);

let clock = 0, last = performance.now(), nextHit = 1;
window.__clock = () => clock;
window.__rigs = rigs;
function frame(now) {
  const slow = +$("slow").value;
  // rAF can stamp the first frame before the page's own clock read.
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)) * slow;
  last = now;
  clock += dt;

  const front = $("front").checked;
  camera.position.set(front ? 0 : 5, 1.6, front ? 8 : 5.6);
  camera.lookAt(0, 1.2, 0);

  for (const r of rigs) {
    const rig = r.rig;
    let yaw = FACE, pitch = 0, moving = false, mps = 0;
    if (r.key === "turn") {
      // Snap the aim 60 degrees each way, holding each for a second.
      const step = Math.floor(clock / 1.1) % 4;
      yaw = FACE + [0, 1.05, 0, -1.05][step];
      pitch = [0, 0.15, 0, -0.1][step];
    } else if (r.key === "run") {
      yaw = FACE - Math.PI / 2;   // side-on to the camera
      moving = true; mps = 4.6;
    } else if (r.key === "flinch") {
      if (clock > nextHit) { hit(); nextHit = clock + 1.6; }
    }
    aimRig(rig, yaw, dt, { moving });
    if (moving) r.phase += dt * gaitPhaseRate(mps);
    poseHumanoid(rig, {
      phase: r.phase, moving, pitch, lower: 0, strafe: 0, forward: 1,
      speed: Math.min(1, mps / 4.2), mps, dt, hasGun: true,
    });
    const p = rig.root.position.clone().project(camera);
    r.tag.style.left = `${(p.x * 0.5 + 0.5) * innerWidth}px`;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
