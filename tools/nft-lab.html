<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TROLLS Design Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #111214; --panel: #1c1c1e; --panel2: #232326; --line: rgba(255,255,255,.09);
    --txt: #ececf0; --dim: #8e8e96; --accent: #ffb020; --good: #34c759; --edit: #5ac8fa;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font: 13px/1.4 "DM Sans", system-ui, sans-serif; overflow: hidden; }
  button, select, input, textarea { font: inherit; color: inherit; }
  #app { display: grid; grid-template-columns: 320px 1fr; height: 100%; }

  /* ---- panel ---- */
  #panel { background: var(--panel); border-right: 0.5px solid var(--line); overflow-y: auto; padding: 14px 14px 90px; }
  #panel h1 { margin: 0 0 2px; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  #panel .sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  details { background: var(--panel2); border: 0.5px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
  summary { cursor: pointer; padding: 10px 12px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: var(--dim); font: 500 14px "DM Mono", monospace; }
  details[open] > summary::after { content: "–"; }
  .body { padding: 0 12px 12px; }
  .note { color: var(--dim); font-size: 11.5px; margin: 2px 0 8px; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; margin: 7px 0; }
  .row label { color: #c9c9d0; font-size: 12.5px; }
  .row.edited label { color: var(--edit); }
  .row.edited label::before { content: "● "; font-size: 9px; vertical-align: 2px; }
  .slider { display: grid; grid-template-columns: 1fr 52px; gap: 6px; align-items: center; width: 170px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .val { font: 11px "DM Mono", monospace; color: var(--dim); text-align: right; }
  input[type=color] { width: 44px; height: 26px; border: 0.5px solid var(--line); border-radius: 7px; background: none; padding: 1px; cursor: pointer; }
  select { background: #2c2c30; color: var(--txt); border: 0.5px solid var(--line); border-radius: 8px; padding: 5px 8px; max-width: 170px; }
  /* the open list is drawn by the OS: give its options a dark ground too */
  option, optgroup { background: #2c2c30; color: var(--txt); }
  .seg select { color: #fff; }
  .tokens { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .tok { background: #2c2c30; border: 0.5px solid var(--line); border-radius: 9px; padding: 7px 0; cursor: pointer; font: 500 12px "DM Mono", monospace; }
  .tok[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  .btn { background: #2c2c30; border: 0.5px solid var(--line); border-radius: 9px; padding: 6px 10px; cursor: pointer; }
  .btn:hover { background: #36363b; }
  .btn.primary { background: var(--accent); color: #1a1205; border: none; font-weight: 600; }
  .btn[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--edit); outline-offset: 2px; }

  /* ---- stage ---- */
  #stage { position: relative; min-width: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #stage canvas:active { cursor: grabbing; }
  .bar { position: absolute; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #topbar { top: 12px; left: 12px; right: 12px; }
  .seg { display: inline-flex; background: rgba(28,28,30,.85); backdrop-filter: blur(12px); border: 0.5px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { background: none; border: none; border-radius: 7px; padding: 5px 10px; cursor: pointer; color: #c9c9d0; }
  .seg button[aria-pressed=true] { background: #3a3a3f; color: #fff; }
  .seg select { background: none; border: none; }
  #labels { position: absolute; top: 96px; left: 0; right: 0; display: flex; justify-content: center; gap: 0; pointer-events: none; }
  #labels span { font: 500 11px "DM Mono", monospace; color: var(--dim); background: rgba(28,28,30,.8); border-radius: 6px; padding: 3px 8px; margin: 0 18%; }
  #status { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); background: rgba(28,28,30,.9); border: 0.5px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12px; color: var(--dim); opacity: 0; transition: opacity .2s; pointer-events: none; }
  #status.on { opacity: 1; }

  /* ---- reference card ---- */
  #ref { position: absolute; right: 12px; bottom: 12px; width: 170px; background: rgba(28,28,30,.9); border: 0.5px solid var(--line); border-radius: 14px; padding: 8px; }
  #ref img { width: 100%; border-radius: 9px; display: block; }
  #ref .drop { border: 1px dashed #55555c; border-radius: 9px; padding: 18px 8px; text-align: center; color: var(--dim); font-size: 11.5px; cursor: pointer; }
  #ref .drop.over { border-color: var(--accent); color: var(--accent); }
  #ref .cap { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font: 11px "DM Mono", monospace; color: var(--dim); }
  #ref .cap button { background: none; border: none; color: var(--dim); cursor: pointer; padding: 0 2px; }
  #ref.min img, #ref.min .drop { display: none; }

  /* ---- changes drawer ---- */
  #changes { position: fixed; left: 0; bottom: 0; width: 320px; background: #161618; border-top: 0.5px solid var(--line); border-right: 0.5px solid var(--line); padding: 10px 14px 12px; z-index: 5; }
  #changes .head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  #changes .count { font-weight: 600; }
  #changes .count b { color: var(--edit); }
  #changeList { max-height: 0; overflow: auto; transition: max-height .2s; }
  #changes.open #changeList { max-height: 40vh; margin-top: 8px; }
  .chg { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; font: 11px/1.35 "DM Mono", monospace; padding: 5px 0; border-bottom: 0.5px solid var(--line); }
  .chg .from { color: var(--dim); text-decoration: line-through; }
  .chg .to { color: var(--edit); }
  .chg button { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 14px; }
  #notes { width: 100%; min-height: 64px; margin-top: 8px; background: #232326; border: 0.5px solid var(--line); border-radius: 9px; padding: 7px 9px; resize: vertical; }

  /* ---- sheet modal ---- */
  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  #sheet.on { display: flex; }
  #sheet .card { background: var(--panel); border-radius: 18px; padding: 14px; max-width: 100%; max-height: 100%; overflow: auto; }
  #sheet img { max-width: min(1200px, 100%); border-radius: 10px; display: block; }
  #sheet .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--good); color: #04210c; font-weight: 600; padding: 8px 14px; border-radius: 999px; z-index: 20; }

  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
    #stage { grid-row: 1; }
    #panel { grid-row: 2; border-right: none; border-top: 0.5px solid var(--line); }
    #changes { width: 100%; }
    #ref { width: 110px; }
    #labels span { margin: 0 10%; }
  }
</style>
<script type="importmap">
  { "imports": { "three": "../assets/vendor/three.module.min.js", "three/addons/": "../assets/vendor/addons/" } }
</script>
</head>
<body>
<div id="app">
  <aside id="panel" aria-label="Design controls">
    <h1>TROLLS design lab</h1>
    <div class="sub">The real game body, live. Tweak it, compare it, copy the changes back.</div>

    <details open>
      <summary>Token</summary>
      <div class="body">
        <div class="tokens" id="tokens" role="group" aria-label="TROLLS token"></div>
        <div class="note">Swap any trait to try combos the NFT doesn't have.</div>
        <div id="traitRows"></div>
      </div>
    </details>

    <details open>
      <summary>Outfit colours</summary>
      <div class="body"><div class="note" id="kitNote"></div><div id="kitRows"></div></div>
    </details>

    <details>
      <summary>Head &amp; face</summary>
      <div class="body"><div id="headRows"></div></div>
    </details>

    <details>
      <summary>Hat shape</summary>
      <div class="body"><div class="note" id="hatNote"></div><div id="hatRows"></div></div>
    </details>

    <details>
      <summary>Beard / mask</summary>
      <div class="body"><div class="note" id="shellNote"></div><div id="shellRows"></div></div>
    </details>

    <details>
      <summary>Scene</summary>
      <div class="body" id="sceneRows"></div>
    </details>
  </aside>

  <main id="stage">
    <div class="bar" id="topbar">
      <div class="seg" role="group" aria-label="Camera view" id="views"></div>
      <div class="seg"><label for="pose" class="sr" style="display:none">Pose</label><select id="pose" aria-label="Pose"></select></div>
      <div class="seg" role="group" aria-label="Display">
        <button type="button" id="spinBtn" aria-pressed="false">Spin</button>
        <button type="button" id="abBtn" aria-pressed="false" title="Show the version that's live in the game beside yours">Game vs mine</button>
      </div>
      <div class="seg" role="group" aria-label="Export">
        <button type="button" id="shotBtn">Snapshot</button>
        <button type="button" id="sheetBtn">Turnaround</button>
      </div>
    </div>
    <div id="labels" hidden><span>live game</span><span>yours</span></div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="ref">
      <img id="refImg" alt="TROLLS NFT reference art" hidden>
      <div class="drop" id="refDrop" tabindex="0" role="button" aria-label="Add a reference image">Drop the NFT image here<br>or click to pick one</div>
      <input type="file" id="refFile" accept="image/*" hidden>
      <div class="cap"><span id="refCap">reference</span><button type="button" id="refMin" aria-label="Collapse reference">▾</button></div>
    </div>
  </main>
</div>

<section id="changes" aria-label="Your changes">
  <div class="head">
    <button type="button" class="btn" id="chgToggle" aria-expanded="false"><span class="count"><b id="chgCount">0</b> changes</span></button>
    <button type="button" class="btn" id="resetAll">Reset</button>
    <button type="button" class="btn primary" id="copyBtn">Copy for Claude</button>
  </div>
  <div id="changeList"></div>
  <textarea id="notes" placeholder="Notes for the next build: what to change that the sliders can't (e.g. 'hat brim too thick at the back')." aria-label="Design notes"></textarea>
</section>

<div id="sheet" role="dialog" aria-modal="true" aria-label="Turnaround sheet">
  <div class="card">
    <img id="sheetImg" alt="Front, three-quarter, side and back views">
    <div class="acts"><a class="btn" id="sheetSave" download="trolls-turnaround.png">Save PNG</a><button type="button" class="btn" id="sheetClose">Close</button></div>
  </div>
</div>

<script type="module">
/* TROLLS design lab (localhost tool). The game's own rig wearing a TROLLS
   body (blocky-body.js wearBlocky, the in-game path), rebuilt live from the
   tables in blocky-body.js DESIGN as you change them. Nothing here writes
   to the game: "Copy for Claude" hands back the edits to bake in.
   ?token=989&view=front|q|side|back|face&pose=idle */
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

// Fresh code and art every load; every module shares the tags the game
// itself uses (read from the files), so there's one rig module.
globalThis.TRAITS_BUST = String(Date.now());
const ROOT = "../assets/games/troll-ops/";
const tagOf = async (file, mod) => {
  const src = await (await fetch(ROOT + file, { cache: "no-store" })).text();
  return src.match(new RegExp(mod.replace(/[.\/]/g, "\\$&") + "\\?v=([^\"']+)"))?.[1] ?? "lab";
};
const [charTag, wmTag, inkTag, emoTag, wpTag] = await Promise.all([
  tagOf("menu/char-inspector.js", "characters/character.js"),
  tagOf("menu/char-inspector.js", "weapons/weapon-model.js"),
  tagOf("menu/char-inspector.js", "view/char-ink.js"),
  tagOf("menu/char-inspector.js", "characters/emotes.js"),
  tagOf("combat/damage.js", "weapons/weapons.js"),
]);
const C = await import(`${ROOT}characters/character.js?v=${charTag}`);
const { buildWeaponMesh, stripLights, preloadWeaponModels } = await import(`${ROOT}weapons/weapon-model.js?v=${wmTag}`);
const { CharInkPass, untagInk } = await import(`${ROOT}view/char-ink.js?v=${inkTag}`);
const { EMOTES, poseEmoteCode, emoteCode, emoteSeconds } = await import(`${ROOT}characters/emotes.js?v=${emoTag}`);
const { WEAPON_DEFS } = await import(`${ROOT}weapons/weapons.js?v=${wpTag}`);
const BB = await import(`${ROOT}characters/blocky-body.js?t=${Date.now()}`);
const { DESIGN, wearBlocky } = BB;
if (!DESIGN) throw new Error("blocky-body.js has no DESIGN export");

const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const LAB_ID = 99999;   // the lab's own token: whatever traits are picked
const NAMES = { 1718: "Troll Runner", 820: "Farmer", 1262: "UMADBRO", 989: "Goku dev", 33: "Jester", 2630: "Microsoft", 2631: "Yobucks" };

/* ------------------------------------------------------------ edits */
/* Every edit is a path into DESIGN and a value. The defaults are a deep
   copy taken before anything is touched; "Game vs mine" builds the left
   troll from them. */
const TABLES = ["KITS", "HAIRS", "HATS", "CAP", "SHELLS", "RELIEF", "HEAD_SCALE"];
const DEFAULTS = structuredClone(Object.fromEntries(TABLES.map((k) => [k, DESIGN[k]])));
const STORE = "nftlab:v1";
let saved = {};
try { saved = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch {}
const edits = new Map(Object.entries(saved.edits || {}));   // "KITS|clothes-sensei|colours|gi" -> value
const getAt = (root, path) => path.reduce((o, k) => (o == null ? o : o[k]), root);
function setAt(root, path, v) {
  // DESIGN.HEAD_SCALE is a copy of a const: the lab applies it itself
  if (path.length === 1) { root[path[0]] = v; return; }
  let o = root;
  for (const k of path.slice(0, -1)) o = o[k] ??= {};
  o[path.at(-1)] = v;
}
const live = () => Object.fromEntries(TABLES.map((k) => [k, DESIGN[k]]));
function applyAll(useEdits) {
  // put every edited value back to default, then (mine) the edits on top
  for (const key of editsEver) setAt(live(), key.split("|"), structuredClone(getAt(DEFAULTS, key.split("|"))));
  if (useEdits) for (const [key, v] of edits) setAt(live(), key.split("|"), structuredClone(v));
}
const editsEver = new Set(edits.keys());
function persist() {
  try { localStorage.setItem(STORE, JSON.stringify({ edits: Object.fromEntries(edits), notes: $("notes").value, scene })); } catch {}
}
function edit(path, v) {
  const key = path.join("|");
  editsEver.add(key);
  if (JSON.stringify(v) === JSON.stringify(getAt(DEFAULTS, path))) edits.delete(key);
  else edits.set(key, v);
  setAt(live(), path, structuredClone(v));
  persist();
  renderChanges();
  rebuildSoon();
}
const valueOf = (path) => (edits.has(path.join("|")) ? edits.get(path.join("|")) : getAt(DEFAULTS, path));
applyAll(true);

/* ------------------------------------------------------------ scene */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
$("stage").prepend(renderer.domElement);
const scene3 = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 100);
const hemi = new THREE.HemisphereLight(0xdfe9f3, 0x5a4a3a, 1.1);
const key = new THREE.DirectionalLight(0xfff1dc, 2.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 });
const rim = new THREE.DirectionalLight(0xbfd8ff, 0);
scene3.add(hemi, key, key.target, rim);
const ground = new THREE.Mesh(new THREE.CircleGeometry(7, 64), new THREE.MeshStandardMaterial({ color: 0x6d6457, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene3.add(ground);
const LIGHTS = {
  "Match day": { bg: "#8fb4d6", ground: 0x6d6457, hemi: [0xdfe9f3, 0x5a4a3a, 1.1], key: [0xfff1dc, 2.2, [3, 6, -4]], rim: 0 },
  Studio: { bg: "#2a2b30", ground: 0x3a3b40, hemi: [0xffffff, 0x404048, 0.9], key: [0xffffff, 2.4, [-2.5, 5, -4]], rim: 1.6 },
  Dusk: { bg: "#d98a5e", ground: 0x5e4a3d, hemi: [0xffc7a0, 0x3a2a40, 0.8], key: [0xff9f5a, 2.6, [5, 2.2, -2]], rim: 0.9 },
  Night: { bg: "#10141f", ground: 0x1b1f28, hemi: [0x6c7ea8, 0x101018, 0.6], key: [0xb8c8ff, 1.4, [-3, 5, -3]], rim: 1.2 },
};
const scene = { light: "Match day", bg: null, ground: true, ink: true, ...(saved.scene || {}) };
function applyScene() {
  const L = LIGHTS[scene.light] || LIGHTS["Match day"];
  scene3.background = new THREE.Color(scene.bg || L.bg);
  ground.material.color.setHex(L.ground);
  ground.visible = scene.ground;
  hemi.color.setHex(L.hemi[0]); hemi.groundColor.setHex(L.hemi[1]); hemi.intensity = L.hemi[2];
  key.color.setHex(L.key[0]); key.intensity = L.key[1]; key.userData.at = L.key[2];
  rim.intensity = L.rim;
  persist();
}

/* ------------------------------------------------------------ rigs */
// mine (right) and the live game's (left, "Game vs mine" only)
function makeRig() {
  const rig = C.buildHumanoid(new THREE.MeshStandardMaterial({ color: 0x222222 }), { height: 1.8, gun: false });
  scene3.add(rig.root);
  const mesh = stripLights(buildWeaponMesh(WEAPON_DEFS.problem416));
  C.mountHeldWeapon(rig, mesh);
  return { rig, gun: mesh, phase: 0 };
}
try { await preloadWeaponModels(); } catch {}
const mine = makeRig(), game = makeRig();
game.rig.root.visible = false;
let ab = false;

let traits = {};      // the lab token's traits by type
let lastToken = null;
try { lastToken = localStorage.getItem(STORE + ":token"); } catch {}
let baseToken = +(q.get("token") || lastToken || 1718);
if (!DESIGN.TOKENS[baseToken]) baseToken = 1718;

const shadowsOn = (r) => r.rig.root.traverse((o) => { if (o.isMesh) o.castShadow = true; });
async function wear(r, useEdits) {
  applyAll(useEdits);
  DESIGN.flush();
  await wearBlocky(r.rig, 0);
  await wearBlocky(r.rig, LAB_ID);
  r.rig.parts.headPivot.scale.setScalar(useEdits ? valueOf(["HEAD_SCALE"]) : DEFAULTS.HEAD_SCALE);
  if (!scene.ink) untagInk(r.rig);
  shadowsOn(r);
}
let chain = Promise.resolve(), busy = 0, timer = 0;
function rebuild(both = false) {
  busy++; status("Building…");
  chain = chain.then(async () => {
    DESIGN.TOKENS[LAB_ID] = { ...traits };
    if (both && ab) await wear(game, false);
    await wear(mine, true);
  }).catch((e) => { console.error(e); status("Build failed: " + e.message, 4000); })
    .finally(() => { if (--busy === 0) status(""); });
  return chain;
}
function rebuildSoon() { clearTimeout(timer); timer = setTimeout(() => rebuild(false), 180); }

let statusT = 0;
function status(text, ms = 0) {
  const s = $("status");
  s.textContent = text; s.classList.toggle("on", !!text);
  clearTimeout(statusT);
  if (ms) statusT = setTimeout(() => s.classList.remove("on"), ms);
}

/* ------------------------------------------------------------ controls */
const TYPES = [["hat", "Hat", "hat-"], ["facial", "Facial", "facial-"], ["eyes", "Eyes", "eyes-"], ["clothes", "Clothes", "clothes-"]];
// every value each trait type can take: the library's art plus what the tokens use
const OPTIONS = Object.fromEntries(TYPES.map(([t, , pre]) => {
  const vals = new Set(Object.values(DESIGN.TOKENS).map((x) => x[t]).filter(Boolean));
  for (const [v, id] of Object.entries(DESIGN.TRAIT_ART)) if (id.startsWith(pre)) vals.add(v);
  if (t === "clothes") for (const v of [...vals]) if (!DESIGN.KITS[DESIGN.TRAIT_ART[v]]) vals.delete(v);
  return [t, [...vals].sort()];
}));

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) if (k === "on") for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn); else if (v != null) e.setAttribute(k, v);
  e.append(...kids);
  return e;
}
let uid = 0;
const hex = (n) => "#" + (n >>> 0).toString(16).padStart(6, "0");
const unhex = (s) => parseInt(s.slice(1), 16);
const toCss = (c) => (typeof c === "number" ? hex(c) : c.startsWith("#") ? c : "#888888");
const fromCss = (css, like) => (typeof like === "number" ? unhex(css) : css);
const edited = (path) => edits.has(path.join("|"));

function colourRow(label, path) {
  const v = valueOf(path), id = "c" + uid++;
  if (v === "plaid") return el("div", { class: "row" }, el("label", {}, label), el("span", { class: "val" }, "plaid pattern"));
  const inp = el("input", { type: "color", id, value: toCss(v ?? 0xf3f3ef), on: { input: (e) => edit(path, fromCss(e.target.value, v ?? 0)) } });
  return el("div", { class: "row" + (edited(path) ? " edited" : "") }, el("label", { for: id }, label), inp);
}
function sliderRow(label, path, min, max, step, fmt = (x) => x.toFixed(3)) {
  const v = valueOf(path), id = "s" + uid++;
  const out = el("span", { class: "val" }, fmt(v));
  const inp = el("input", { type: "range", id, min, max, step, value: v, on: { input: (e) => { out.textContent = fmt(+e.target.value); edit(path, +e.target.value); } } });
  return el("div", { class: "row" + (edited(path) ? " edited" : "") }, el("label", { for: id }, label), el("div", { class: "slider" }, inp, out));
}
const nice = (k) => k.replace(/^(clothes|hat|facial|eyes)-/, "").replace(/-/g, " ");

function renderTokens() {
  const box = $("tokens");
  box.replaceChildren(...Object.keys(DESIGN.TOKENS).filter((id) => +id !== LAB_ID).map((id) =>
    el("button", { type: "button", class: "tok", "aria-pressed": String(+id === baseToken), title: NAMES[id] || "", on: { click: () => pickToken(+id) } }, "#" + id)));
}
function renderTraits() {
  $("traitRows").replaceChildren(...TYPES.map(([t, label]) => {
    const id = "t" + uid++;
    const sel = el("select", { id, on: { change: (e) => { traits[t] = e.target.value; afterTraits(); } } },
      ...OPTIONS[t].map((v) => el("option", { value: v }, v)));
    if (!OPTIONS[t].includes(traits[t])) sel.prepend(el("option", { value: traits[t] }, traits[t]));
    sel.value = traits[t];
    const own = DESIGN.TOKENS[baseToken]?.[t];
    return el("div", { class: "row" + (traits[t] !== own ? " edited" : "") }, el("label", { for: id }, label), sel);
  }));
}
const art = (t) => DESIGN.TRAIT_ART[traits[t]] || "";
function renderTuning() {
  // outfit colours: the garment's kit, and modelled hair
  const garment = art("clothes"), kit = DESIGN.KITS[garment];
  $("kitNote").textContent = kit ? `${nice(garment)}: every token wearing it changes too.` : "";
  const rows = kit ? Object.keys(DEFAULTS.KITS[garment].colours).map((k) => colourRow(k, ["KITS", garment, "colours", k])) : [];
  const hair = DESIGN.HAIRS[art("hat")];
  if (hair) for (const k of Object.keys(DEFAULTS.HAIRS[art("hat")].colours)) rows.push(colourRow("hair " + k, ["HAIRS", art("hat"), "colours", k]));
  $("kitRows").replaceChildren(...rows);

  $("headRows").replaceChildren(
    sliderRow("Head size", ["HEAD_SCALE"], 0.5, 0.95, 0.01, (x) => x.toFixed(2)),
    sliderRow("Face pushes out", ["RELIEF", "front"], 0.02, 0.16, 0.005),
    sliderRow("Skull depth", ["RELIEF", "back"], 0.08, 0.3, 0.005),
  );

  const hat = art("hat"), H = DESIGN.HATS[hat];
  $("hatNote").textContent = H ? `Cap fit is shared by every drawn hat; colour and brim are ${nice(hat)}'s own.` : "This token's hat isn't a drawn cap (pick one in Token to tune it).";
  const hatRows = [];
  if (H) {
    hatRows.push(
      sliderRow("Cap width", ["CAP", "a"], 0.2, 0.45, 0.005),
      sliderRow("Cap height", ["CAP", "b"], 0.2, 0.5, 0.005),
      sliderRow("Cap front depth", ["CAP", "front"], 0.03, 0.2, 0.005),
      sliderRow("Cap back depth", ["CAP", "back"], 0.1, 0.35, 0.005),
      colourRow("Wall colour", ["HATS", hat, "ink"]),
    );
    if (DEFAULTS.HATS[hat].brim) {
      hatRows.push(sliderRow("Brim out front", ["HATS", hat, "brimFront"], 0, 0.3, 0.005));
      if (DEFAULTS.HATS[hat].brimBack != null) hatRows.push(sliderRow("Brim out back", ["HATS", hat, "brimBack"], 0, 0.4, 0.005));
      hatRows.push(sliderRow("Brim softness", ["HATS", hat, "ease"], 2, 40, 1, (x) => x.toFixed(0)));
    }
  }
  $("hatRows").replaceChildren(...hatRows);

  const facial = art("facial"), S = DESIGN.SHELLS[facial];
  $("shellNote").textContent = S ? `${nice(facial)}: a 3D shell on the face.` : "Only shell facials (beard, mask) have shape controls.";
  $("shellRows").replaceChildren(...(S ? [
    sliderRow("Thickness on jaw", ["SHELLS", facial, "thick", 0], 0.002, 0.08, 0.001),
    sliderRow("Thickness hanging", ["SHELLS", facial, "thick", 1], 0.002, 0.1, 0.001),
    sliderRow("Wraps round jaw", ["SHELLS", facial, "curl"], 0.2, 1.4, 0.01, (x) => x.toFixed(2)),
    ...(DEFAULTS.SHELLS[facial].hem ? [
      sliderRow("Ends at row", ["SHELLS", facial, "hem", "row"], 860, 1100, 5, (x) => x.toFixed(0)),
      sliderRow("Hem curve", ["SHELLS", facial, "hem", "rise"], 0, 250, 5, (x) => x.toFixed(0)),
    ] : []),
    ...(Array.isArray(DEFAULTS.SHELLS[facial].tint) ? ["red", "green", "blue"].map((c, i) =>
      sliderRow("Tint " + c, ["SHELLS", facial, "tint", i], 0.1, 1.2, 0.01, (x) => x.toFixed(2))) : []),
  ] : []));
}
function renderScene() {
  const id = "l" + uid++;
  const lightSel = el("select", { id, on: { change: (e) => { scene.light = e.target.value; scene.bg = null; applyScene(); renderScene(); } } },
    ...Object.keys(LIGHTS).map((k) => el("option", { value: k }, k)));
  lightSel.value = scene.light;
  const bgId = "b" + uid++, gId = "g" + uid++, iId = "i" + uid++, gunId = "w" + uid++;
  const gunSel = el("select", { id: gunId, on: { change: (e) => setGun(e.target.value) } },
    ...Object.values(WEAPON_DEFS).filter((d) => d.name).map((d) => el("option", { value: d.id }, d.name)));
  gunSel.value = gunPick;
  $("sceneRows").replaceChildren(
    el("div", { class: "row" }, el("label", { for: id }, "Lighting"), lightSel),
    el("div", { class: "row" }, el("label", { for: bgId }, "Background"), el("input", { type: "color", id: bgId, value: scene.bg || LIGHTS[scene.light].bg, on: { input: (e) => { scene.bg = e.target.value; applyScene(); } } })),
    el("div", { class: "row" }, el("label", { for: gId }, "Ground"), el("input", { type: "checkbox", id: gId, ...(scene.ground ? { checked: "" } : {}), on: { change: (e) => { scene.ground = e.target.checked; applyScene(); } } })),
    el("div", { class: "row" }, el("label", { for: iId }, "Edge ink"), el("input", { type: "checkbox", id: iId, ...(scene.ink ? { checked: "" } : {}), on: { change: (e) => { scene.ink = e.target.checked; persist(); rebuild(true); } } })),
    el("div", { class: "row" }, el("label", { for: gunId }, "Gun (aim poses)"), gunSel),
  );
}
function renderAll() { renderTokens(); renderTraits(); renderTuning(); renderScene(); renderChanges(); }

function pickToken(id) {
  baseToken = id;
  traits = { ...DESIGN.TOKENS[id] };
  try { localStorage.setItem(STORE + ":token", id); } catch {}
  history.replaceState(null, "", `?token=${id}`);
  setRef();
  renderAll();
  rebuild(true);
}
function afterTraits() { renderTraits(); renderTuning(); rebuild(true); }

/* ------------------------------------------------------------ changes */
const fmtV = (v) => (typeof v === "number" && Number.isInteger(v) && v > 255 ? "0x" + v.toString(16).padStart(6, "0") : typeof v === "number" ? +v.toFixed(4) + "" : JSON.stringify(v));
function changeLines() {
  const lines = [];
  for (const t of TYPES.map((x) => x[0])) if (traits[t] !== DESIGN.TOKENS[baseToken]?.[t]) lines.push({ text: `trait ${t}: ${DESIGN.TOKENS[baseToken][t]} -> ${traits[t]}` });
  for (const [k, v] of edits) {
    const path = k.split("|");
    lines.push({ key: k, where: path.join("."), from: fmtV(getAt(DEFAULTS, path)), to: fmtV(v) });
  }
  return lines;
}
function renderChanges() {
  const lines = changeLines();
  $("chgCount").textContent = lines.length;
  $("changeList").replaceChildren(...lines.map((l) => l.key
    ? el("div", { class: "chg" }, el("div", {}, l.where, el("br"), el("span", { class: "from" }, l.from), " → ", el("span", { class: "to" }, l.to)),
        el("button", { type: "button", "aria-label": "Undo " + l.where, on: { click: () => { edit(l.key.split("|"), getAt(DEFAULTS, l.key.split("|"))); renderTuning(); } } }, "↺"))
    : el("div", { class: "chg" }, el("div", {}, l.text))));
}
$("chgToggle").onclick = () => {
  const open = $("changes").classList.toggle("open");
  $("chgToggle").setAttribute("aria-expanded", String(open));
};
$("resetAll").onclick = () => {
  for (const k of [...edits.keys()]) edits.delete(k);
  traits = { ...DESIGN.TOKENS[baseToken] };
  persist(); renderAll(); rebuild(true);
};
$("notes").value = saved.notes || "";
$("notes").oninput = persist;
$("copyBtn").onclick = async () => {
  const L = changeLines();
  const text = [
    `TROLLS design lab: token #${baseToken} (${Object.values(traits).join(" / ")})`,
    ...(L.length ? L.map((l) => "- " + (l.text || `blocky-body.js ${l.where}: ${l.from} -> ${l.to}`)) : ["- no slider changes"]),
    ...($("notes").value.trim() ? ["", "Notes:", $("notes").value.trim()] : []),
  ].join("\n");
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it to Claude to bake it in."); }
  catch { prompt("Copy this:", text); }
};
function toast(msg) {
  const t = el("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 2200);
}

/* ------------------------------------------------------------ reference */
let refUrls = {};
function setRef(url) {
  if (url) refUrls[baseToken] = url;
  const img = $("refImg"), src = refUrls[baseToken] || `${ROOT}refs/trolls-${baseToken}.png`;
  $("refCap").textContent = `#${baseToken} ${NAMES[baseToken] || ""}`;
  img.onload = () => { img.hidden = false; $("refDrop").hidden = true; };
  img.onerror = () => { img.hidden = true; $("refDrop").hidden = false; };
  img.src = src;
}
const pickRef = () => $("refFile").click();
$("refDrop").onclick = pickRef;
$("refDrop").onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickRef(); } };
$("refImg").ondblclick = pickRef;
$("refFile").onchange = (e) => { const f = e.target.files[0]; if (f) setRef(URL.createObjectURL(f)); };
for (const t of [$("ref"), renderer.domElement]) {
  t.addEventListener("dragover", (e) => { e.preventDefault(); $("refDrop").classList.add("over"); });
  t.addEventListener("dragleave", () => $("refDrop").classList.remove("over"));
  t.addEventListener("drop", (e) => {
    e.preventDefault(); $("refDrop").classList.remove("over");
    const f = [...e.dataTransfer.files].find((x) => x.type.startsWith("image/"));
    if (f) setRef(URL.createObjectURL(f));
  });
}
$("refMin").onclick = () => {
  const min = $("ref").classList.toggle("min");
  $("refMin").textContent = min ? "▴" : "▾";
  $("refMin").setAttribute("aria-label", min ? "Show reference" : "Collapse reference");
};

/* ------------------------------------------------------------ camera + poses */
const VIEWS = { front: [0, 0.08, 4.4], q: [0.7, 0.12, 4.4], side: [Math.PI / 2, 0.05, 4.4], back: [Math.PI, 0.1, 4.4], face: [0.25, 0.02, 1.25] };
const VIEW_NAMES = { front: "Front", q: "¾", side: "Side", back: "Back", face: "Face" };
let view = VIEWS[q.get("view")] ? q.get("view") : "front";
const orbit = { yaw: VIEWS[view][0], pitch: VIEWS[view][1], dist: VIEWS[view][2] };
const want = { ...orbit };
let spin = false, drag = null;
function setView(v) {
  view = v;
  [want.yaw, want.pitch, want.dist] = VIEWS[v];
  // take the short way round
  orbit.yaw = want.yaw + ((((orbit.yaw - want.yaw) % (2 * Math.PI)) + 3 * Math.PI) % (2 * Math.PI) - Math.PI);
  spin = false; $("spinBtn").setAttribute("aria-pressed", "false");
  renderViews();
}
function renderViews() {
  $("views").replaceChildren(...Object.keys(VIEWS).map((k) =>
    el("button", { type: "button", "aria-pressed": String(view === k), on: { click: () => setView(k) } }, VIEW_NAMES[k])));
}
const cv = renderer.domElement;
cv.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); view = null; renderViews(); });
cv.addEventListener("pointerup", () => { drag = null; });
cv.addEventListener("pointermove", (e) => {
  if (!drag) return;
  want.yaw -= (e.clientX - drag.x) * 0.008;
  want.pitch = Math.max(-0.4, Math.min(1.2, want.pitch + (e.clientY - drag.y) * 0.006));
  orbit.yaw = want.yaw; orbit.pitch = want.pitch;
  drag = { x: e.clientX, y: e.clientY };
});
cv.addEventListener("wheel", (e) => { e.preventDefault(); want.dist = Math.max(0.7, Math.min(9, want.dist * (1 + e.deltaY * 0.001))); }, { passive: false });
$("spinBtn").onclick = () => { spin = !spin; $("spinBtn").setAttribute("aria-pressed", String(spin)); };
$("abBtn").onclick = () => {
  ab = !ab;
  $("abBtn").setAttribute("aria-pressed", String(ab));
  game.rig.root.visible = ab;
  $("labels").hidden = !ab;
  if (ab) rebuild(true);
};

// Poses: the game's own pose code; emotes loop
const POSES = [["idle", "Idle"], ["ready", "Port arms (menu)"], ["walk", "Walk"], ["run", "Run"], ["aim", "Aim"], ["shoot", "Shoot"], ["death", "Death"]];
for (const [i, e] of EMOTES.entries()) POSES.push(["emote:" + i, "Emote: " + e.name]);
let pose = POSES.some(([k]) => k === q.get("pose")) ? q.get("pose") : "idle", t0 = performance.now();
$("pose").replaceChildren(...POSES.map(([k, n]) => el("option", { value: k }, n)));
$("pose").value = pose;
$("pose").onchange = (e) => { pose = e.target.value; t0 = performance.now(); };
let gunPick = "problem416";
function setGun(id) {
  gunPick = id;
  for (const r of [mine, game]) {
    r.gun.parent?.remove(r.gun);
    r.gun = stripLights(buildWeaponMesh(WEAPON_DEFS[id]));
    C.mountHeldWeapon(r.rig, r.gun);
    r.gun.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  }
}

function poseRig(r, t, dt, travel) {
  const rig = r.rig;
  const armed = pose === "aim" || pose === "shoot" || pose === "ready", firing = pose === "shoot";
  const moving = pose === "walk" || pose === "run", mps = pose === "run" ? 5.5 : 2.2;
  r.gun.visible = armed;
  rig.root.position.z = -travel;
  if (pose.startsWith("emote:")) {
    const i = +pose.slice(6), secs = emoteSeconds(i);
    if (!poseEmoteCode(rig, emoteCode(i), t % secs)) C.poseHumanoid(rig, { moving: false, dt, hold: "none" });
    return;
  }
  if (pose === "death") { C.poseDeath(rig, Math.min(1, (t % 3) / 1.25)); return; }
  const k = (t * 8) % 1;
  C.poseHumanoid(rig, {
    phase: (r.phase += dt * C.gaitPhaseRate(mps, rig.legScale)), moving, mps: moving ? mps : 0, speed: moving ? 1 : 0, dt,
    hasGun: armed, hold: armed ? "gun" : "none", ads: pose === "aim" || firing ? 1 : 0,
    pitch: pose === "ready" ? 1.2 : 0, carryYaw: pose === "ready" ? 1.15 : undefined,
    recoil: firing ? Math.max(0, 1 - k * 3) : 0, fired: firing ? k / 8 : Infinity,
  });
}

/* ------------------------------------------------------------ render */
let last = performance.now(), travel = 0;
const focus = new THREE.Vector3(), headAt = new THREE.Vector3();
// The game's own chain (game.js): the scene, then the edge ink reading the
// scene's depth, so a line on the far side of the head never shows through
// the hat or the skull (the menu overlay has no scene depth and did)
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4, depthTexture: new THREE.DepthTexture(1, 1) }));
composer.addPass(new RenderPass(scene3, camera));
composer.addPass(new CharInkPass(scene3, camera));
composer.addPass(new OutputPass());
function resize() {
  const w = $("stage").clientWidth, h = $("stage").clientHeight;
  renderer.setSize(w, h, false);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe($("stage"));

function placeCamera(o = orbit) {
  // both trolls side by side in A/B, mine on the right from the front
  const sep = ab ? 0.85 : 0;
  mine.rig.root.position.x = -sep;   // the viewer's right from the front is -x
  game.rig.root.position.x = sep;
  mine.rig.parts.headPivot.getWorldPosition(headAt);
  const close = o.dist < 1.8;
  focus.set(close ? headAt.x : 0, close ? headAt.y + 0.12 : 0.88, -travel);
  camera.position.set(focus.x - Math.sin(o.yaw) * Math.cos(o.pitch) * o.dist * (ab && !close ? 1.35 : 1), focus.y + Math.sin(o.pitch) * o.dist, focus.z - Math.cos(o.yaw) * Math.cos(o.pitch) * o.dist * (ab && !close ? 1.35 : 1));
  camera.lookAt(focus);
  const [kx, ky, kz] = key.userData.at || [3, 6, -4];
  key.position.set(kx, ky, kz - travel); key.target.position.set(0, 0, -travel); key.target.updateMatrixWorld();
  rim.position.set(-kx, 3, -kz - travel);
  ground.position.z = -travel;
}
function draw() {
  composer.passes[1].enabled = scene.ink;
  composer.render();
}
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = (now - t0) / 1000;
  if (spin) want.yaw += dt * 0.5;
  const e = Math.min(1, dt * 7);
  orbit.yaw += (want.yaw - orbit.yaw) * e; orbit.pitch += (want.pitch - orbit.pitch) * e; orbit.dist += (want.dist - orbit.dist) * e;
  const moving = pose === "walk" || pose === "run";
  travel = moving ? (travel + dt * (pose === "run" ? 5.5 : 2.2)) % 30 : 0;
  poseRig(mine, t, dt, travel);
  if (ab) poseRig(game, t, dt, travel);
  placeCamera();
  draw();
});

/* ------------------------------------------------------------ export */
function grab(w, h, o) {
  const size = new THREE.Vector2(); renderer.getSize(size);
  const ratio = renderer.getPixelRatio();
  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(1);
  composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  placeCamera(o);
  draw();
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(renderer.domElement, 0, 0, w, h);
  renderer.setPixelRatio(ratio);
  renderer.setSize(size.x, size.y, false);
  resize();
  return c;
}
function download(canvas, name) {
  const a = el("a", { href: canvas.toDataURL("image/png"), download: name });
  a.click();
}
$("shotBtn").onclick = () => {
  const w = $("stage").clientWidth * 2, h = $("stage").clientHeight * 2;
  download(grab(w, h, orbit), `trolls-${baseToken}-${Date.now()}.png`);
};
$("sheetBtn").onclick = () => {
  const W = 520, H = 820, pad = 0;
  const views = ["front", "q", "side", "back"];
  const sheet = document.createElement("canvas");
  sheet.width = W * 4 + pad * 3; sheet.height = H + 44;
  const g = sheet.getContext("2d");
  g.fillStyle = scene.bg || LIGHTS[scene.light].bg; g.fillRect(0, 0, sheet.width, sheet.height);
  views.forEach((v, i) => {
    const [yaw, pitch] = VIEWS[v];
    g.drawImage(grab(W, H, { yaw, pitch, dist: 4.2 }), i * (W + pad), 0);
  });
  g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(0, H, sheet.width, 44);
  g.fillStyle = "#fff"; g.font = "500 18px 'DM Mono', monospace";
  g.fillText(`TROLLS #${baseToken}  ·  ${Object.values(traits).join(" / ")}  ·  ${edits.size} lab changes`, 16, H + 28);
  $("sheetImg").src = sheet.toDataURL("image/png");
  $("sheetSave").href = $("sheetImg").src;
  $("sheet").classList.add("on");
  $("sheetClose").focus();
};
$("sheetClose").onclick = () => $("sheet").classList.remove("on");
$("sheet").onclick = (e) => { if (e.target === $("sheet")) $("sheet").classList.remove("on"); };
addEventListener("keydown", (e) => {
  if (e.key === "Escape") $("sheet").classList.remove("on");
  if (e.target.matches("input, select, textarea")) return;
  const map = { 1: "front", 2: "q", 3: "side", 4: "back", 5: "face" };
  if (map[e.key]) setView(map[e.key]);
});

/* ------------------------------------------------------------ go */
window.__lab = { mine, game, DESIGN, edits, rebuild, setView, orbit, scene,
  look(yaw, pitch, dist) { Object.assign(want, { yaw, pitch, dist }); Object.assign(orbit, { yaw, pitch, dist }); } };
applyScene();
renderViews();
traits = { ...DESIGN.TOKENS[baseToken] };
setRef();
renderAll();
await rebuild(true);
</script>
