<style>
/* trollrunner.net home: one screen, a Black Ops 2 Zombies style menu over
   the molten troll-map planet (assets/js/menu-globe.js). The menu itself is
   assets/js/bo2-menu.js, shared with the Troll Forces menu. The old desktop
   lives at /desktop.html. */
:root{
  --ink:#f3ece4; --dim:#c9b8a6; --soft:#e2d6c8; --hot:#ff8a1f; --gold:#ffd27a; --void:#030101;
  --panel:rgba(10,4,2,.82); --line:rgba(243,236,228,.16);
  --display:Oswald,"Arial Narrow",sans-serif; --body:"DM Sans",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--ink);font:16px/1.5 var(--body);overflow:hidden}
a{color:var(--hot)}a:hover{color:#ffb870}
.home{position:fixed;inset:0;overflow:hidden}
.home-backdrop{position:absolute;inset:0}
.home-still{position:absolute;inset:0;background:radial-gradient(circle at 34% 18%,rgba(255,170,70,.55) 0,rgba(200,70,20,.18) 18%,rgba(0,0,0,0) 45%),radial-gradient(circle at 20% 60%,#1e0f07 0,#0a0402 38%,#030101 62%)}
.home-brand{position:absolute;left:72px;top:44px;display:flex;align-items:center;gap:12px;font:700 22px/1 var(--display);letter-spacing:.08em;color:var(--ink);text-decoration:none;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.home-backdrop::after{content:"";position:absolute;inset:0;pointer-events:none}
.home-brand em{font-style:normal;color:var(--hot)}
/* The list never reaches the footer: --foot-h is the footer's live height
   (set from JS). Only the item list scrolls (bo2-menu.js), so the title and
   description stay whole and nothing runs over "N Online". 14px of padding
   on the left keeps the hot bar (items sit 14px out) in view. */
.home-menu{position:absolute;left:82px;padding-left:14px;top:112px;width:454px;box-sizing:border-box;max-height:calc(100% - 112px - 34px - var(--foot-h,64px) - 20px);overflow:hidden}


.home-acct{position:absolute;left:min(56vw,calc(100% - 420px));top:150px;width:380px;display:flex;flex-direction:column;gap:6px}
.home-acct-lbl{font:500 17px var(--display);letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.home-acct-lbl span{color:var(--dim)}
.home-acct-row{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border:0;border-bottom:1px solid rgba(255,176,32,.55);background:linear-gradient(90deg,rgba(10,4,2,.78),rgba(10,4,2,.2));color:inherit;font:inherit;text-align:left;cursor:pointer}
.home-acct-row:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.home-acct-row img{width:24px;height:24px;border-radius:5px;object-fit:cover}
.home-acct-row b{font:500 18px var(--display);letter-spacing:.03em;color:var(--gold)}
.home-acct-row i{font:normal 12px var(--mono);color:var(--hot)}
/* Troll Map + PFP Studio: picture tiles under the profile row, so they read
   as their own thing next to the text list on the left. */
.home-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.home-tile{position:relative;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;padding:14px;border-radius:12px;border:1px solid rgba(255,210,122,.32);
  background:linear-gradient(160deg,rgba(255,138,31,.2),rgba(10,4,2,.86) 62%);box-shadow:0 10px 30px rgba(0,0,0,.45);color:var(--ink);font:inherit;text-align:left;text-decoration:none;cursor:pointer;overflow:hidden;
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
/* Each icon sits in the same framed badge above its label: the PFP art is a
   full square (cover), the globe a cutout (contain on a warm glow). */
.home-tile img{width:64px;height:64px;margin-bottom:12px;border-radius:14px;object-fit:cover;border:1px solid rgba(255,210,122,.4);box-shadow:0 6px 16px rgba(0,0,0,.5);transition:transform .2s ease}
.home-tile img.is-cutout{object-fit:contain;padding:5px;background:radial-gradient(circle at 50% 42%,rgba(255,210,122,.32),rgba(10,4,2,.7) 72%)}
.home-tile b{font:600 20px/1.05 var(--display);letter-spacing:.05em;text-transform:uppercase}
.home-tile i{font:normal 12px/1.3 var(--mono);color:var(--dim);margin-top:3px}
.home-tile:hover,.home-tile:focus-visible{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 14px 34px rgba(255,138,31,.22)}
.home-tile:hover img,.home-tile:focus-visible img{transform:rotate(-4deg) scale(1.05)}
.home-tile:hover,.home-tile:focus-visible{color:var(--ink)}
.home-tile:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
/* Trollnite: its own wide tile over the other two (user, 2026-10-31: "a
   separate section like PFP Studio", clear on every device). Key art behind,
   the wordmark in Luckiest Guy. */
.home-tile.is-trollnite{grid-column:1/-1;min-height:118px;justify-content:flex-end;padding:14px 16px;border-color:rgba(255,210,63,.7);
  background:linear-gradient(180deg,rgba(10,4,2,0) 30%,rgba(10,4,2,.88)),url('assets/games/troll-ops/ui/troll-forces-key-art.jpg') center 30%/cover}
.home-tile.is-trollnite b{font:400 34px/1 'Luckiest Guy',var(--display);letter-spacing:.05em;color:#ffd23f;-webkit-text-stroke:1.5px #2a1600;paint-order:stroke fill;text-shadow:0 3px 0 #7a3b00,0 6px 14px rgba(0,0,0,.8);text-transform:none}
.home-tile.is-trollnite i{color:var(--ink);text-shadow:0 1px 4px rgba(0,0,0,.9)}
.home-tile.is-trollnite em{position:absolute;top:12px;right:12px;padding:4px 10px;border-radius:999px;background:#ffd23f;color:#2a1600;font:700 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;font-style:normal}
/* Finances is the donation wallet: its own glowing pill, bottom right. */
.home-donate{display:flex;white-space:nowrap;flex:none;align-items:center;gap:12px;margin-left:auto;padding:8px 20px 8px 8px;border-radius:999px;border:1px solid rgba(255,210,122,.75);
  background:linear-gradient(135deg,rgba(255,210,122,.3),rgba(255,138,31,.16) 55%,rgba(10,4,2,.85));color:var(--ink);text-decoration:none;
  box-shadow:0 0 0 0 rgba(255,210,122,.45),0 10px 30px rgba(0,0,0,.5);animation:home-glow 2.8s ease-in-out infinite}
.home-donate img{width:46px;height:46px;border-radius:50%;object-fit:contain;background:rgba(0,0,0,.45);padding:4px}
.home-donate b{display:block;font:700 22px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.home-donate i{display:block;font:normal 12px/1.3 var(--mono);color:var(--soft);margin-top:3px}
.home-donate:hover,.home-donate:focus-visible{color:var(--ink);border-color:var(--gold);background:linear-gradient(135deg,rgba(255,210,122,.42),rgba(255,138,31,.26) 55%,rgba(10,4,2,.85))}
.home-donate:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@keyframes home-glow{50%{box-shadow:0 0 0 7px rgba(255,210,122,0),0 10px 30px rgba(0,0,0,.5)}}

.home-foot{position:absolute;left:96px;right:64px;bottom:34px;display:flex;align-items:flex-end;gap:26px;color:var(--dim);font-size:15px;pointer-events:none}
.home-foot > *{pointer-events:auto}
.home-online{white-space:nowrap;font:600 38px/1 var(--display);letter-spacing:.02em;color:var(--ink);text-shadow:0 2px 10px rgba(0,0,0,.9)}
.home-live{display:block;margin-top:8px;font:500 13px var(--mono);letter-spacing:.02em;color:var(--soft)}
.home-live:empty{display:none}
.home-live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff453a;margin-right:7px;vertical-align:1px;animation:home-pulse 1.6s ease-in-out infinite}
@keyframes home-pulse{50%{opacity:.35}}
kbd{font:12px var(--mono);padding:3px 7px;border-radius:5px;border:1px solid rgba(243,236,228,.35);color:var(--ink)}
.home-back{display:none;align-items:center;gap:8px;margin-top:10px;padding:0;border:0;background:none;color:var(--soft);font:15px var(--body);cursor:pointer}
.home-back.is-on{display:flex}
.has-panel .home-acct{visibility:hidden}
@media (hover:none){.home-back kbd{display:none}.home-back{min-height:44px;font:600 16px var(--display);letter-spacing:.06em;text-transform:uppercase}}

/* The About panel, beside the list. */
.home-panel{position:absolute;left:min(42vw,560px);top:112px;width:min(520px,calc(100% - min(42vw,560px) - 48px));max-height:calc(100% - 230px);overflow:auto;padding:22px 24px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
.home-panel[hidden]{display:none}
.home-panel h2{margin:0 0 14px;font:600 26px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.home-panel p{margin:0 0 10px;color:var(--soft);font-size:15px}
.home-field{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.45);color:var(--ink);font:15px var(--body)}
.home-field:focus{outline:2px solid var(--hot);outline-offset:1px}
.home-btn{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid rgba(255,138,31,.6);background:rgba(255,138,31,.16);color:var(--ink);font:600 15px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.home-btn:hover{background:rgba(255,138,31,.28)}
.home-btn:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.home-status{font-size:13px;color:var(--dim)}
.home-socials{display:flex;gap:16px;margin:4px 0 14px}
.home-admin{display:flex;gap:8px;margin-top:16px}
.home-admin .home-field{max-width:220px}
.is-map .home-acct,.is-map .home-donate{visibility:hidden}
/* The weekly leaderboard (assets/js/troll-leaderboard.js) in a panel: wider
   than About, and the engine's colour names mapped onto this page's. */
#panel-lb{--muted:var(--dim);--green:#4dff73;--cyan:var(--gold);--red:#ff453a}
@media (min-height:521px) and (min-aspect-ratio:9/10){#panel-lb{width:min(640px,calc(100% - min(42vw,560px) - 48px))}}
#panel-lb .lb-root{background:rgba(0,0,0,.35)}
#panel-lb .lb-table{min-width:0}

/* Phones look like the desktop (user, 2026-10-07). Held sideways (a short,
   wide screen): the desktop layout itself, sized down. Held upright: the
   desktop's pieces in the desktop's order, stacked: the menu first, then
   the profile and the tiles, the footer at the bottom. Rows stay desktop
   size, so the whole menu fits. --menu-h is the list's live height (JS). */
@media (max-height:520px) and (min-aspect-ratio:9/10){
  .home-brand{left:max(28px,env(safe-area-inset-left));top:14px;font-size:16px}
  .home-menu{left:max(30px,calc(env(safe-area-inset-left) + 2px));top:44px;width:min(400px,46vw);max-height:calc(100% - 44px - var(--foot-h,40px) - 18px)}
  .home .tr-menu-title{font-size:26px;margin-bottom:4px}
  .home .tr-menu-item{min-height:28px;line-height:28px;font-size:18px}
  .home .tr-menu-group{padding-bottom:6px}
  .home-acct{left:auto;right:max(24px,env(safe-area-inset-right));top:40px;width:min(340px,44vw);gap:4px}
  .home-acct-lbl{font-size:14px}
  .home-acct-row{min-height:30px}
  .home-acct-row b{font-size:16px}
  .home-tiles{gap:8px;margin-top:6px}
  .home-tile{padding:10px}
  .home-tile img{width:40px;height:40px;margin-bottom:8px;border-radius:10px}
  .home-tile b{font-size:16px}
  .home-tile.is-trollnite{min-height:72px;padding:8px 12px}.home-tile.is-trollnite b{font-size:24px}.home-tile.is-trollnite em{top:8px;right:8px}
  .home-tile i{font-size:11px}
  .home-foot{left:max(44px,env(safe-area-inset-left));right:max(24px,env(safe-area-inset-right));bottom:10px;gap:14px;align-items:center}
  .home-online{font-size:24px}
  .home-donate{padding:5px 14px 5px 5px;gap:8px}
  .home-donate img{width:32px;height:32px}
  .home-donate b{font-size:16px}
  .home-donate i{font-size:10px}
  .home-panel{left:48vw;top:38px;width:calc(52vw - max(24px,env(safe-area-inset-right)));max-height:calc(100% - 38px - var(--foot-h,40px) - 24px);padding:16px}
}
@media (max-aspect-ratio:9/10){
  .home-brand{left:20px;top:calc(18px + env(safe-area-inset-top));font-size:18px}
  .home-backdrop::after{background:rgba(3,1,1,.3)}
  .home-menu{left:6px;right:20px;width:auto;top:calc(60px + env(safe-area-inset-top));
    max-height:calc(100% - 60px - 200px - var(--foot-h,58px) - 34px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
  .home .tr-menu-title{font-size:36px;margin-bottom:4px}
  .home .tr-menu-item{min-height:36px;line-height:36px;font-size:21px}
  .home .tr-menu-group{padding-bottom:10px}
  .home-acct{left:20px;right:20px;width:auto;top:calc(60px + env(safe-area-inset-top) + var(--menu-h,320px) + 10px)}
  .home-tiles{gap:8px;margin-top:8px}
  .home-tile{padding:12px}
  .home-tile img{width:48px;height:48px;margin-bottom:10px;border-radius:12px}
  .home-tile b{font-size:18px}
  .home-tile i{font-size:11px}
  .home-foot{left:20px;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));gap:12px;align-items:center}
  .home-online{font-size:28px}
  .home-donate{padding:6px 14px 6px 6px;gap:8px}
  .home-donate img{width:36px;height:36px}
  .home-donate b{font-size:17px}
  .home-donate i{font-size:11px}
  .home-panel{left:12px;right:12px;width:auto;top:calc(60px + env(safe-area-inset-top) + var(--menu-h,320px) + 10px);bottom:auto;max-height:calc(100% - 60px - env(safe-area-inset-top) - var(--menu-h,320px) - 10px - var(--foot-h,58px) - 34px - env(safe-area-inset-bottom));padding:18px}
}
/* News: a lobby-style card over the blurred home (HANDOFF.md). Sizes come
   from the reference shot: the card is ~52% of the screen's width, 562:337,
   art ~40% of it; type inside scales with the card (cqi). */
.home-news{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,30px);padding:24px 16px 84px;
  background:rgba(3,1,1,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.home-news{background:rgba(3,1,1,.88)}}
.home-news[hidden]{display:none}
.news-head{margin:0;font:700 clamp(36px,4.4vw,72px)/1 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);text-shadow:0 4px 20px rgba(0,0,0,.6)}
.news-stage{display:grid;grid-template-areas:"prev card next" ". dots .";align-items:center;column-gap:clamp(14px,3vw,40px);row-gap:16px}
.news-card{grid-area:card;touch-action:pan-y}
#news-prev{grid-area:prev}
#news-next{grid-area:next}
.news-dots{grid-area:dots;display:flex;justify-content:center;gap:4px}
.news-dots[hidden]{display:none}
/* 24px hit area, 10px dot; the current one is a long gold pill, so it
   doesn't rely on colour alone. */
.news-dot{display:grid;place-items:center;width:24px;height:24px;padding:0;border:0;background:none;cursor:pointer}
.news-dot::before{content:"";width:10px;height:10px;border-radius:999px;background:rgba(243,236,228,.4);transition:width .2s ease,background .2s ease}
.news-dot[aria-current]::before{width:26px;background:var(--gold)}
.news-dot[aria-current]{width:38px}
.news-dot:hover::before{background:var(--ink)}
.news-dot[aria-current]:hover::before{background:var(--gold)}
.news-dot:focus-visible{outline:2px solid var(--hot);outline-offset:1px;border-radius:999px}
.news-card{container-type:inline-size;position:relative;display:grid;grid-template-columns:40% 1fr;width:min(52vw,760px);min-width:520px;aspect-ratio:562/337;
  border-radius:10px;overflow:hidden;background:var(--ink);color:var(--void);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.news-art{position:relative;z-index:1;margin-right:-9cqi;overflow:visible}
.news-art::before{content:"";position:absolute;inset:0;border-radius:0 22cqi 22cqi 0/0 50% 50% 0;background:radial-gradient(circle at 30% 30%,#3a1a0c,#120603 70%);overflow:hidden}
/* the hot arc riding the curve, like the reference's stroke */
.news-art::after{content:"";position:absolute;inset:-6% -2.2cqi -6% 0;border-radius:0 24cqi 24cqi 0/0 50% 50% 0;border:3px solid transparent;border-right-color:var(--news-accent,var(--hot));border-top-color:var(--news-accent,var(--hot));opacity:.85;pointer-events:none;clip-path:inset(0 0 45% 0);filter:drop-shadow(0 0 6px var(--news-accent,var(--hot)))}
.news-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:0 22cqi 22cqi 0/0 50% 50% 0}
/* Settles the art into the card: darker toward the curve and the floor,
   so no picture's bright edge fights the cream panel. */
.news-shade{position:absolute;inset:0;border-radius:0 22cqi 22cqi 0/0 50% 50% 0;pointer-events:none;
  background:linear-gradient(90deg,rgba(3,1,1,0) 55%,rgba(3,1,1,.4)),linear-gradient(180deg,rgba(3,1,1,0) 65%,rgba(3,1,1,.35))}
/* The story's lead, cut from the same frame (tools/news-art.mjs) and laid
   over it in the same box: unclipped, so they break out over the curve. */
.news-art img.news-hero{border-radius:0;z-index:1;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(3,1,1,.35))}
.news-art img.news-hero[hidden]{display:none}
.news-text{position:relative;z-index:2;display:flex;flex-direction:column;padding:7cqi 6cqi 5cqi 13cqi;min-width:0}
.news-text h3{margin:0 0 3.4cqi;font:700 max(20px,4.8cqi)/1.05 var(--display);letter-spacing:.05em;text-transform:uppercase}
.news-body p{margin:0 0 2.6cqi;font:400 max(13px,2.25cqi)/1.5 var(--body);color:#2a1d14}
.news-tag{margin:1cqi 0 4cqi;font:700 max(12px,2.1cqi)/1.3 var(--body);letter-spacing:.02em;text-transform:uppercase}
.news-tag:empty{display:none}
.news-more{align-self:flex-end;margin-top:auto;display:inline-flex;align-items:center;min-height:44px;padding:0 max(18px,4cqi);border-radius:999px;background:var(--gold);color:var(--void);
  font:600 max(14px,2.8cqi)/1 var(--display);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;box-shadow:0 6px 16px rgba(120,60,0,.25);transition:transform .15s ease,background .15s ease}
.news-more:hover,.news-more:focus-visible{color:var(--void);background:#ffdf9c;transform:translateY(-1px)}
.news-more:focus-visible{outline:2px solid var(--void);outline-offset:3px}
.news-more[hidden]{display:none}
.news-arrow{flex:none;display:grid;place-items:center;width:46px;height:46px;padding:0;border:0;border-radius:50%;background:#fff;color:var(--void);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform .15s ease}
.news-arrow:hover{transform:scale(1.08)}
.news-arrow:focus-visible{outline:2px solid var(--hot);outline-offset:3px}
.news-arrow svg{width:20px;height:20px}
.news-arrow[hidden]{display:none}

<script type="module">

let NEWS = [

    id: 'v1-wip',
    title: 'Version 1.0 is cooking',
    body: [

    ],
    tag: '',
    image: 'assets/images/news/ladder-champion.webp',
    hero: 'assets/images/news/ladder-champion-hero.webp',
    alt: "The week's winner on top of a shipping container with a gold rifle, two beaten trolls below, one sad, one with an L on their forehead",
    focus: '50% 40%',
    accent: '#ffd27a',
    go: 'leaderboard',   // a menu screen instead of a page
  },
  {
    id: 'stickers',
    title: 'Print, cut, slap',
    body: [
      'The sticker sheets are up. Print them at home and leave a grin somewhere it shouldn\'t be.',
    ],
    tag: 'New sheets',
    image: 'assets/images/news/stickers-slap.webp',
    hero: 'assets/images/news/stickers-slap-hero.webp',
    alt: 'The Troll Runner slapping a trollface sticker onto a glass panel already covered in them',
    focus: '52% 88%',
    accent: '#8cff2e',
    href: 'stickers.html',
  },
];
const newsEl = $('home-news');
const newsCard = newsEl.querySelector('.news-card');
const reduceMotion = matchMedia('(prefers-reduced-motion:reduce)');
let newsIdx = 0;
let newsReturn = null;
function renderNews(dir = 0) {
  const s = NEWS[newsIdx];
  $('news-title').textContent = s.title;
  $('news-body').replaceChildren(...s.body.map((t) => Object.assign(document.createElement('p'), { textContent: t })));
  $('news-tag').textContent = s.tag || '';
  const img = $('news-img');
  img.src = s.image;
  img.alt = s.alt || '';
  img.style.objectPosition = s.focus || '50% 30%';
  const hero = $('news-hero');
  hero.hidden = !s.hero;
  if (s.hero) { hero.src = s.hero; hero.style.objectPosition = img.style.objectPosition; }
  newsCard.style.setProperty('--news-accent', s.accent || 'var(--hot)');
  const more = $('news-more');
  more.hidden = !s.href && !s.go;
  const href = s.href || '#';
  more.href = href;
  const external = /^https?:/i.test(href) && !href.startsWith(location.origin);
  more.target = external ? '_blank' : '';
  more.rel = external ? 'noopener noreferrer' : '';
  const many = NEWS.length > 1;
  $('news-prev').hidden = $('news-next').hidden = $('news-dots').hidden = !many;
  $('news-dots').querySelectorAll('button').forEach((d, i) => {
    if (i === newsIdx) d.setAttribute('aria-current', 'true'); else d.removeAttribute('aria-current');
  });
  if (dir && newsCard.animate) {
    const from = reduceMotion.matches ? { opacity: 0 } : { opacity: 0, transform: `translateX(${dir * 28}px)` };
    newsCard.animate([from, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'ease-out' });
  }
}
function goNews(i, dir) {
  newsIdx = (i + NEWS.length) % NEWS.length;
  renderNews(dir);
}
function buildNewsDots() {
  $('news-dots').replaceChildren(...NEWS.map((s, i) => {
    const d = document.createElement('button');
    d.type = 'button';
    d.className = 'news-dot';
    d.setAttribute('aria-label', `Story ${i + 1} of ${NEWS.length}: ${s.title}`);
    d.addEventListener('click', () => { if (i !== newsIdx) goNews(i, i > newsIdx ? 1 : -1); });
    return d;
  }));
}
buildNewsDots();
/* The live stories: published ones, pinned first, then newest, the top
   five. An empty answer means no news (the menu item goes); a failed one
   (no table yet, offline) keeps the launch stories. */
async function loadNews() {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/troll_news?select=id,title,body,tag,image,hero,alt,focus,accent,href,go&published=eq.true&order=pinned.desc,published_at.desc,created_at.desc&limit=5`,
      { cache: 'no-store', headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } });
    if (!r.ok) return;
    const rows = await r.json();
    if (!Array.isArray(rows)) return;
    NEWS = rows.map((s) => ({
      id: s.id, title: s.title, body: String(s.body || '').split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean),
      tag: s.tag || '', image: s.image, hero: s.hero || null, alt: s.alt || '', focus: s.focus, accent: s.accent,
      // (the table's checks already refuse anything else; this is a second lock)
      href: /^(https:\/\/|\/|[a-z0-9][^:]*$)/i.test(s.href || '') ? s.href : null,
      go: ['arcade', 'leaderboard', 'map'].includes(s.go) ? s.go : null,
    }));
    newsIdx = Math.min(newsIdx, Math.max(0, NEWS.length - 1));
    buildNewsDots();
    if (!NEWS.length) closeNews(); else if (!newsEl.hidden) renderNews();
    menu.refresh();
    setTimeout(autoOpenNews, 900);   // the menu paints first
  } catch {}
}
/* Once a visit (user, 2026-10-28: "a one time thing when users are on
   the website unless they exit out of the site"): the card opens by
   itself when someone arrives, and not again while they browse the site
   and come back to the home page; closing the site and coming back later
   shows it again. sessionStorage is exactly that span (one tab, until
   it's closed). Only from the table's answer (never the launch stories),
   and never over something else: the site lock, the accounts window, a
   screen or panel off the main menu, a ?open= deep link (that visit
   still counts as unseen). No storage (blocked): never, rather than on
   every page load. */
const NEWS_SHOWN_KEY = 'tr_news_shown';
function newsShown() {
  try { return sessionStorage.getItem(NEWS_SHOWN_KEY) === '1'; } catch { return null; }
}
function markNewsShown() {
  try { sessionStorage.setItem(NEWS_SHOWN_KEY, '1'); } catch {}
}
function autoOpenNews() {
  if (newsShown() !== false || !NEWS.length || !newsEl.hidden) return;
  const covered = document.querySelector('.site-lock-overlay.is-visible')
    || document.getElementById('troll-accounts-modal')?.offsetParent
    || menu.depth() > 0 || document.body.classList.contains('has-panel')
    || new URLSearchParams(location.search).has('open');
  if (!covered) openNews();
}
function openNews(start = 0) {
  if (!NEWS.length) return;
  newsReturn = document.activeElement;
  newsIdx = Math.min(start, NEWS.length - 1);
  renderNews();
  NEWS.forEach((s) => { new Image().src = s.image; if (s.hero) new Image().src = s.hero; });   // paging never waits on art
  newsEl.hidden = false;
  markNewsShown();   // opened either way (button or by itself): this visit has seen it
  (newsEl.querySelector('.news-more:not([hidden])') || $('news-close')).focus();
}
function closeNews() {
  if (newsEl.hidden) return;
  newsEl.hidden = true;
  if (location.hash === '#news') history.replaceState(null, '', location.pathname + location.search);
  (newsReturn && newsReturn !== document.body ? newsReturn : nav.querySelector('.tr-menu-item'))?.focus?.();
}
$('news-close').addEventListener('click', closeNews);
$('news-more').addEventListener('click', (e) => {
  const go = NEWS[newsIdx].go;
  if (!go) return;
  e.preventDefault();
  closeNews();
  menu.go(go);
});
$('news-prev').addEventListener('click', () => goNews(newsIdx - 1, -1));
$('news-next').addEventListener('click', () => goNews(newsIdx + 1, 1));
newsEl.addEventListener('click', (e) => { if (e.target === newsEl) closeNews(); });
// Swipe the card. No pointer capture (it retargets the click to the card);
// a swipe eats the click that follows it so READ MORE doesn't fire.
{
  let x0 = null, swiped = false;
  newsCard.addEventListener('pointerdown', (e) => { x0 = e.clientX; swiped = false; });
  newsCard.addEventListener('pointerup', (e) => {
    if (x0 === null || NEWS.length < 2) return;
    const dx = e.clientX - x0;
    x0 = null;
    if (Math.abs(dx) < 40) return;
    swiped = true;
    goNews(newsIdx + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
  });
  newsCard.addEventListener('pointercancel', () => { x0 = null; });
  newsCard.addEventListener('click', (e) => { if (swiped) { e.preventDefault(); swiped = false; } }, true);
}
// Capture phase: while the card is up, keys don't reach the menu behind it.
window.addEventListener('keydown', (e) => {

    const f = [...newsEl.querySelectorAll('button:not([hidden]),a[href]:not([hidden])')].filter((el) => !el.closest('[hidden]'));
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey ? i <= 0 : i === f.length - 1) { e.preventDefault(); f[e.shiftKey ? f.length - 1 : 0].focus(); }
    return;
  }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && NEWS.length > 1) {
    e.preventDefault();
    const dir = e.key === 'ArrowLeft' ? -1 : 1;
    goNews(newsIdx + dir, dir);
  }
  e.stopImmediatePropagation();   // the focused button still gets its own Enter/Space
}, true);

window.addEventListener('hashchange', newsFromHash);
newsFromHash();
loadNews();   // (resolves after this script has run, so the menu exists by then)

const screens = {
  main: () => ({
    title: 'Main Menu',
    groups: [
      NEWS.length ? [
        { id: 'news', label: 'News', desc: NEWS[0].title, onSelect: () => openNews() },

      [

        { id: 'terminal', label: 'Terminal', desc: 'The Trollface Terminal. The archive, the riddles, the transmissions.', href: 'https://trolltruths.com', newTab: true },
      ],
      [
        { id: 'stickers', label: 'Stickers', desc: 'Printable troll stickers. Print, cut, slap.', href: 'stickers.html', newTab: true },
      ],
      isTrollRunner() ? [
        { id: 'about', label: 'About', desc: 'The socials and the admin login.', go: 'about' },
      ] : [],
    ],
  }),
  // Grin Sabers and Troll Us aren't open yet (user, 2026-10-20), nor is
  // Troll Kombat (user, 2026-10-29): listed for
  // everyone but only troll_runner can open them (pages: owner-gate.js).
  arcade: () => ({
    title: 'Arcade',
    groups: [
      [
        { id: 'a-forces', label: 'Trollnite', desc: 'Online PvP, Zombies and Troll Royale. The big one.', href: 'troll-ops.html' },
        { id: 'a-kombat', label: 'Troll Kombat', desc: 'Two-player fighting. Pepe, Doge and the gladiator.', href: 'troll-kombat', ...soon() },
        { id: 'a-trollman', label: 'Troll Man', desc: 'Eat the dots, dodge the memes. The arcade classic, trolled.', href: 'troll-man' },
        { id: 'a-sabers', label: 'Grin Sabers', desc: 'Saber duels for trollfaces. Block it, disarm them, bonk them.', href: 'sabers', ...soon() },
        { id: 'a-trollus', label: 'Troll Us', desc: 'Among Us, but everyone is a trollface. Very sus.', href: 'trollus', ...soon() },
      ],
      [
        { id: 'a-lb', label: 'Leaderboard', desc: "This week's top trolls across the arcade.", go: 'leaderboard' },
      ],
      [
        { id: 'back', label: 'Back', desc: 'Back to the main menu.', onSelect: (_, m) => m.back() },
      ],
    ],
  }),
  about: () => (isTrollRunner() ? panel('panel-about', 'About', 'Back to the main menu.') : null),
  leaderboard: panel('panel-lb', 'Leaderboard', 'Back to the arcade.'),
  ...mapMode.screens,
};

const PANELS = ['panel-about', 'panel-lb'];

// The leaderboard engine loads the first time its panel opens.
let lbLoad = null;
function mountLeaderboard() {
  lbLoad = lbLoad || new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'assets/js/troll-leaderboard.js?v=lb-engine-v1-nd2';
    sc.onload = resolve; sc.onerror = reject;
    document.head.appendChild(sc);
  }).then(() => window.TrollLeaderboard?.mountArcadeBoard('#arcade-lb-root'))
    .catch(() => { $('arcade-lb-root').innerHTML = '<p class="lb-foot">Leaderboard unavailable right now.</p>'; lbLoad = null; });
}
const menu = createBo2Menu(nav, {
  screens, keys: true,
  onScreen(id, s, m) {
    PANELS.forEach((p) => { $(p).hidden = p !== s.panel; });
    if (s.panel === 'panel-lb') mountLeaderboard();
    document.body.classList.toggle('has-panel', !!s.panel || id === 'search' || id === 'pinsearch');
    // The footer Back is for screens without their own Back row.
    const ownBack = (s.groups || []).flat().some((it) => it && it.id === 'back');
    $('home-back').classList.toggle('is-on', m.depth() > 0 && !ownBack);
    mapMode.onScreen(id, s);
    document.documentElement.style.setProperty('--menu-h', `${nav.offsetHeight}px`);
  },
});
$('home-back').addEventListener('click', () => menu.back());
$('home-map-tile').addEventListener('click', () => menu.go('map'));

/* ── Account row ──────────────────────────────────────────────────────── */
function renderAccount() {
  const p = accounts() && accounts().getCachedProfile && accounts().getCachedProfile();
  const row = $('home-acct-row');
  row.querySelector('img')?.remove();
  if (p) {
    $('home-acct-name').textContent = p.username || 'Troll';
    $('home-acct-note').textContent = `LV ${p.level || 1}`;
    if (p.avatarUrl) {
      const img = document.createElement('img');
      img.src = p.avatarUrl; img.alt = '';
      row.prepend(img);
    }
    row.setAttribute('aria-label', `Your profile: ${p.username}`);
  } else {
    $('home-acct-name').textContent = 'Guest troll';
    $('home-acct-note').textContent = 'Log in to save progress';
    row.setAttribute('aria-label', 'Log in');
  }
  // About comes and goes with the troll_runner sign-in.
  if (menu.current() === 'about' && !isTrollRunner()) menu.back();
  else if (menu.current() === 'main' || menu.current() === 'arcade') menu.refresh();
}
$('home-acct-row').addEventListener('click', openProfile);
window.addEventListener('trollrunner:auth-changed', renderAccount);
document.addEventListener('DOMContentLoaded', renderAccount);
renderAccount();

// One view per day per tab session for the admin analytics (admins skipped).
async function recordView() {
  const day = new Date().toISOString().slice(0, 10);
  const key = `trollrunner_view_daily_track_v1:${day}`;
  try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch {}
  try {
    const token = accounts()?.getAccessToken && await accounts().getAccessToken();
    if (token) {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/troll_is_admin`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}` }, body: '{}' });
      if (r.ok && (await r.json()) === true) return;
    }
    await fetch(`${SUPABASE_URL}/rest/v1/rpc/troll_record_view`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }, body: JSON.stringify({ p_date_key: day, p_viewer_id: viewerId() }) });
  } catch {}
}

/* ── Live "running now / coding now" status ────────────────────────────── */
let sharedRow = null, sharedAt = 0;
async function fetchShared() {
  if (sharedRow && Date.now() - sharedAt < 10000) return sharedRow;
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/site_updates?select=updates,live_status_enabled&id=eq.main&limit=1`, { cache: 'no-store', headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } });
    const json = r.ok ? await r.json() : [];
    sharedRow = json[0] || {};
    sharedAt = Date.now();
  } catch { sharedRow = sharedRow || {}; }
  return sharedRow;
}
const truthy = (v) => v === true || v === '1' || v === 1;
async function refreshLive() {
  const row = await fetchShared();
  const meta = (Array.isArray(row.updates) ? row.updates : []).find((u) => u && u.id === '__trollrunner_live_status_meta__');
  const s = (meta && meta.liveStatuses) || {};
  const running = truthy(s.running), coding = truthy(s.coding);
  const live = $('home-live');
  live.replaceChildren();
  const bits = [running && 'running', coding && 'coding'].filter(Boolean);
  if (bits.length) {
    const dot = document.createElement('i');
    dot.setAttribute('aria-hidden', 'true');
    live.append(dot, `Live: the Troll Runner is ${bits.join(' and ')} right now`);
  }
}

/* ── Admin entry (About panel) ────────────────────────────────────────── */
async function goToAdmin() {
  const helper = window.TrollrunnerAdminAuth;
  if (!helper) { $('admin-auth-status').textContent = 'Admin auth is still loading.'; return; }
  if (helper.hasAdminSession && await helper.hasAdminSession()) { location.href = 'admin.html'; return; }
  const pass = $('admin-pass').value.trim();
  if (!pass) { $('admin-pass').focus(); return; }
  try { await helper.signInWithAdminPassword(pass, { silent: true }); location.href = 'admin.html'; }
  catch (e) { $('admin-auth-status').textContent = e && e.message ? String(e.message) : 'Wrong admin password.'; $('admin-pass').select(); }
}
window.goToAdmin = goToAdmin;
$('admin-go').addEventListener('click', goToAdmin);
$('admin-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') goToAdmin(); });

/* ── Old deep links (?open=...) from world.html, hub/ and elsewhere ────── */
(function deepLink() {
  const q = new URLSearchParams(location.search);
  const open = q.get('open');
  if (!q.has('open') && !q.has('desktop') && !q.has('mobile') && !q.has('enter')) return;
  history.replaceState(null, '', location.pathname + location.hash);
  const go = { about: 'about', map: 'map', arcade: 'arcade', games: 'leaderboard', leaderboard: 'leaderboard' };
  const href = { tf: 'troll-ops.html', maps: 'maps.html', pfp: 'pfp.html', stickers: 'stickers.html', finance: 'https://finance.trollrunner.net', terminal: 'https://trolltruths.com' };
  if (open === 'account') document.addEventListener('DOMContentLoaded', () => setTimeout(openProfile, 300));
  else if (go[open] && (open !== 'about' || isTrollRunner())) menu.go(go[open]);
  else if (href[open]) location.replace(href[open]);
})();

/* ── Boot: menu first, then the network, then the planet ──────────────── */
function bootLater() {
  joinSitePresence({ onCount: (n) => { $('home-online').textContent = `${n} Online`; } });
  recordView();
  refreshLive();
  setInterval(() => { if (!document.hidden) refreshLive(); }, 30000);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootLater); else bootLater();

var backdrop = null;   // var: read by menu callbacks that can run before this line
const idle = window.requestIdleCallback || ((fn) => setTimeout(fn, 200));
window.addEventListener('load', () => idle(async () => {
  try {
    const { mountMenuBackdrop } = await import('./assets/js/menu-globe.js?v=home7-pm1');
    backdrop = mountMenuBackdrop($('home-backdrop'));
    document.querySelector('.home-still')?.remove();
    window.__trHome = { backdrop, menu };   // for headless tests
  } catch (e) { console.warn('[home] backdrop', e); }
}));
document.addEventListener('visibilitychange', () => {
  if (!backdrop) return;
  document.hidden ? backdrop.pause() : backdrop.resume();
});
</script>
