  mesh sides, a curved bill out over the brow). Traced from TROLLS #2630.
  Same cap as hat-trucker-yobucks.svg, its own colours and print.
  Frame: the head-trait frame (traits/README.md). 1000 x 1033 units =
  headPivot x -0.30..0.30 m, y 0.62..0 m; the face board's art sits at
  (100, 233.3) 800 x 750. In game the bill band (y 345..448,
  blocky-body.js HATS) stands out in front only.
-->
