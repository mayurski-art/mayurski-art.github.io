<!--
  TROLLS #989's face (FACIALS / Bubblegum, refs/trolls-goku-dev.png) without
  the gum: the trollface itself (its outline, jaw, cheek folds and chin
  lines) with only the expression changed (user, 2026-10-15): its nose and
  grin painted out, and the lips puckered to blow put in their place,
  taken from the user's ChatGPT drawing (face-989-art.png) and lined up on
  the trollface's own eyes. The trollface keeps its own brows and eyes, as
  the NFT draws them (user, 2026-10-16: the drawing's squint didn't match).
  In the trollface png's frame (800 x 730), so it swaps in for the face.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 730" width="800" height="730">
  <defs>
    <!-- what of the trollface stays: everything but the nose and grin -->
    <mask id="keep" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="730">
      <rect width="800" height="730" fill="#fff"/>
      <path fill="#000" d="M142 300 L286 292 L292 262 L342 262 L350 290 L556 286 L562 258 L652 262 L700 292 L702 350 L655 425 L560 505 L470 548 L300 556 L170 548 L118 505 L108 342 L142 336 Z"/>
    </mask>
    <!-- the drawing's lines alone: its white made see-through (it was a lighter white than the skin) -->
    <filter id="lines" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 0 0 0 0.02  0 0 0 0 0.02  0 0 0 0 0.02  -1 -1 -1 1 1.2"/></filter>
    <filter id="skin" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 0 0 0 0.984  0 0 0 0 0.984  0 0 0 0 0.984  0 0 0 1 0"/></filter>
    <!-- the drawing's expression only (drawing px): brows, eyes, nose, lips;
         not its outline, cheek folds or chin -->
    <clipPath id="expr" clipPathUnits="userSpaceOnUse">
      <path d="M470 530 L740 530 L745 495 L862 495 L872 530 L1085 530 L1080 620 L930 700 L920 850 L760 860 L700 760 L560 700 L470 640 Z"/>
    </clipPath>
  </defs>
  <!-- the skin, then the trollface with its features painted out -->
  <image href="../../../../images/wallpaper/trollface%20transparent.png" width="800" height="730" filter="url(#skin)"/>
  <image href="../../../../images/wallpaper/trollface%20transparent.png" width="800" height="730" mask="url(#keep)"/>
  <!-- the new expression: the drawing's eyes (centres ~515,450 and 885,485)
       on the trollface's (~248,238 and 500,238) -->
  <g transform="translate(-102 -68) scale(0.68)">
    <image href="face-989-art.png" width="1254" height="1254" clip-path="url(#expr)" filter="url(#lines)"/>
  </g>
</svg>
