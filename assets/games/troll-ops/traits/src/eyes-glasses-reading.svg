<!--
  TROLLS trait: EYES / Glasses Reading. Round gold wire frames over the
  eyes, pale blue glass with a glint, a keyhole bridge over the nose and
  the arms running back to the face's edges. Traced from TROLLS #2631.
  Front only. Frame: the head-trait frame (traits/README.md).
-->
