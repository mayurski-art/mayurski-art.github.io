    <path fill="none" stroke="#3a3a40" stroke-width="5" d="M470 158 C560 205 630 300 650 412"/>
    <!-- sweatband line -->
    <path fill="none" stroke="#3a3a40" stroke-width="5" d="M200 412 C380 428 600 412 790 380"/>
    <!-- button -->
    <ellipse cx="470" cy="148" rx="30" ry="13" fill="#17171a"/>
