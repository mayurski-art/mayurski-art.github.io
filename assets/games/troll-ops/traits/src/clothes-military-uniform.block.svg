<!--
  TROLLS trait: CLOTHES / Miltary Uniform (the metadata's spelling) on the
  BLOCK body (blocky-body.js): a grey-green digital camo combat jacket, kept
  plain (user, 2026-10-31: no placket, no collar, no pockets, few wrinkles):
  tan shoulder straps lying along the top of each shoulder, armhole seams,
  and one long fold in from each armpit across the chest. Traced from
  TROLLS #2531. The camo long sleeves are the box arms' in the same tile
  (KITS "camo", blocky-body.js camoMaterial), the trousers the farmer's leg
  pieces in its grey-green, tan boots.
  Same template as clothes-farmer.block.svg, 1 unit = 1 mm:
    front  x    0..400  (seen from the front: the troll's right on the left)
    back   x  400..800  (seen from behind: the troll's left on the left)
    right  x  800..1000 (the troll's right side: its back on the left)
    left   x 1000..1200 (its left side: its front on the left)
    top    x    0..400, y 560..760: the shoulders from above, front edge first
  y 0 is the torso's top, y 520 the hips; the jacket's hem y 470, the trousers below.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <!-- the digital camo: 8 mm pixels in four greys, one tile repeated -->
    <pattern id="camo" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#7c8376"/>
      <g fill="#8f968a">
        <rect x="0" y="0" width="16" height="8"/><rect x="8" y="8" width="8" height="8"/><rect x="40" y="0" width="8" height="16"/>
        <rect x="48" y="8" width="16" height="8"/><rect x="24" y="24" width="16" height="8"/><rect x="32" y="32" width="8" height="8"/>
        <rect x="0" y="40" width="8" height="16"/><rect x="8" y="48" width="16" height="8"/><rect x="48" y="40" width="8" height="8"/>
        <rect x="56" y="48" width="8" height="16"/><rect x="24" y="56" width="16" height="8"/>
      </g>
      <g fill="#5e665a">
        <rect x="24" y="0" width="8" height="8"/><rect x="16" y="16" width="8" height="8"/><rect x="56" y="24" width="8" height="8"/>
        <rect x="48" y="24" width="8" height="16"/><rect x="0" y="24" width="8" height="8"/><rect x="40" y="48" width="8" height="8"/>
        <rect x="16" y="40" width="8" height="8"/><rect x="8" y="32" width="8" height="8"/><rect x="32" y="8" width="8" height="8"/>
        <rect x="40" y="56" width="8" height="8"/><rect x="0" y="56" width="8" height="8"/>
      </g>
      <g fill="#9a9e90">
        <rect x="16" y="0" width="8" height="8"/><rect x="32" y="16" width="16" height="8"/><rect x="0" y="16" width="8" height="8"/>
        <rect x="56" y="0" width="8" height="8"/><rect x="24" y="40" width="8" height="8"/><rect x="48" y="56" width="8" height="8"/>
        <rect x="8" y="24" width="8" height="8"/><rect x="40" y="32" width="8" height="8"/>
      </g>
    </pattern>
  </defs>
  <rect width="1200" height="760" fill="url(#camo)"/>
  <g stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- FRONT: the armhole seams curving in from each shoulder -->
    <path stroke="#2b2f2a" stroke-width="4" d="M30 10 C52 80 56 170 44 250 M370 10 C348 80 344 170 356 250"/>
    <!-- one long fold in from each armpit across the chest -->
    <g stroke="#0e100d" stroke-width="6">
      <path d="M22 170 C70 180 126 196 176 212"/>
      <path d="M378 182 C338 196 290 210 224 224"/>
    </g>
    <!-- the straps' front edge, a sliver of tan where they meet the shoulder's front -->
    <path fill="#b9ad88" stroke="#060606" stroke-width="4" d="M10 0 L110 0 L110 8 L10 8 Z M290 0 L390 0 L390 8 L290 8 Z"/>
    <!-- BACK: the yoke seam, the centre seam, one fold -->
    <path stroke="#2b2f2a" stroke-width="4" d="M416 120 C520 140 680 140 784 120 M600 140 L600 466"/>
    <path stroke="#0e100d" stroke-width="6" d="M430 260 C470 272 520 280 580 284"/>
    <path fill="#b9ad88" stroke="#060606" stroke-width="4" d="M410 0 L510 0 L510 8 L410 8 Z M690 0 L790 0 L790 8 L690 8 Z"/>
    <!-- SIDES: the side seam, a fold under the arm -->
    <path stroke="#2b2f2a" stroke-width="4" d="M900 20 L900 466 M1100 20 L1100 466"/>
    <path stroke="#0e100d" stroke-width="5" d="M836 200 C860 214 880 226 896 240 M1104 206 C1122 220 1140 232 1164 246"/>
    <!-- the jacket's hem all round, the trousers below with their waistband -->
    <path stroke="#060606" stroke-width="6" d="M0 470 L1200 470"/>
    <path stroke="#5e665a" stroke-width="8" d="M0 486 L1200 486"/>
    <path stroke="#5e665a" stroke-width="5" d="M120 490 L120 560 M280 490 L280 560 M600 490 L600 560"/>
    <!-- TOP: the shoulders from above; a strap lies along each, from the
         neck out to the arm, buttoned at its inner end -->
    <path fill="#b9ad88" stroke="#060606" stroke-width="5" d="M0 626 L114 622 C124 622 128 630 128 646 C128 662 124 670 114 670 L0 674 Z"/>
    <path fill="#b9ad88" stroke="#060606" stroke-width="5" d="M400 626 L286 622 C276 622 272 630 272 646 C272 662 276 670 286 670 L400 674 Z"/>
    <g fill="#8b836a" stroke="#060606" stroke-width="4">
      <circle cx="108" cy="646" r="8"/><circle cx="292" cy="646" r="8"/>
    </g>
  </g>
</svg>
