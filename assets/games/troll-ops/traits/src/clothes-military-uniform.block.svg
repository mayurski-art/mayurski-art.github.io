<!--
  TROLLS trait: CLOTHES / Miltary Uniform (the metadata's spelling) on the
  BLOCK body (blocky-body.js): a grey-sage digital camo combat jacket, a
  stand-up collar, a zip down the middle, slanted chest pockets, tan
  shoulder straps, camo trousers below. Traced from TROLLS #2531. The camo
  long sleeves and trousers are the box arms' and the farmer's leg pieces
  in the same camo (KITS "camo", blocky-body.js camoMaterial), tan boots.
  Same template as clothes-farmer.block.svg, 1 unit = 1 mm:
    front  x    0..400  (seen from the front: the troll's right on the left)
    back   x  400..800  (seen from behind: the troll's left on the left)
    right  x  800..1000 (the troll's right side: its back on the left)
    left   x 1000..1200 (its left side: its front on the left)
    top    x    0..400, y 560..760: the shoulders from above, front edge first
  y 0 is the torso's top, y 520 the hips; the jacket's hem y 470, the trousers below.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <!-- the digital camo: 8 mm pixels in four greys, one tile repeated -->
    <pattern id="camo" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#7c8376"/>
      <g fill="#8f968a">
        <rect x="0" y="0" width="16" height="8"/><rect x="8" y="8" width="8" height="8"/><rect x="40" y="0" width="8" height="16"/>
        <rect x="48" y="8" width="16" height="8"/><rect x="24" y="24" width="16" height="8"/><rect x="32" y="32" width="8" height="8"/>
        <rect x="0" y="40" width="8" height="16"/><rect x="8" y="48" width="16" height="8"/><rect x="48" y="40" width="8" height="8"/>
        <rect x="56" y="48" width="8" height="16"/><rect x="24" y="56" width="16" height="8"/>
      </g>
      <g fill="#5e665a">
        <rect x="24" y="0" width="8" height="8"/><rect x="16" y="16" width="8" height="8"/><rect x="56" y="24" width="8" height="8"/>
        <rect x="48" y="24" width="8" height="16"/><rect x="0" y="24" width="8" height="8"/><rect x="40" y="48" width="8" height="8"/>
        <rect x="16" y="40" width="8" height="8"/><rect x="8" y="32" width="8" height="8"/><rect x="32" y="8" width="8" height="8"/>
        <rect x="40" y="56" width="8" height="8"/><rect x="0" y="56" width="8" height="8"/>
      </g>
      <g fill="#9a9e90">
        <rect x="16" y="0" width="8" height="8"/><rect x="32" y="16" width="16" height="8"/><rect x="0" y="16" width="8" height="8"/>
        <rect x="56" y="0" width="8" height="8"/><rect x="24" y="40" width="8" height="8"/><rect x="48" y="56" width="8" height="8"/>
        <rect x="8" y="24" width="8" height="8"/><rect x="40" y="32" width="8" height="8"/>
      </g>
    </pattern>
  </defs>
  <rect width="1200" height="760" fill="url(#camo)"/>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- FRONT: the zip down the middle, with its tab at the collar -->
    <path fill="none" stroke="#060606" stroke-width="5" d="M200 46 L200 470"/>
    <path fill="none" stroke="#6b7268" stroke-width="10" d="M194 50 L194 466 M206 50 L206 466"/>
    <path fill="none" stroke="#060606" stroke-width="3" d="M194 50 L194 466 M206 50 L206 466"/>
    <rect x="190" y="52" width="20" height="30" rx="4" fill="#7a8276" stroke="#060606" stroke-width="4"/>
    <!-- the stand-up collar, a hair open at the zip -->
    <path fill="url(#camo)" stroke="#060606" stroke-width="6" d="M96 0 L200 0 L200 46 L116 46 L104 24 Z"/>
    <path fill="url(#camo)" stroke="#060606" stroke-width="6" d="M304 0 L200 0 L200 46 L284 46 L296 24 Z"/>
    <path fill="#8a9086" stroke="none" d="M104 40 L200 40 L200 46 L116 46 Z M296 40 L200 40 L200 46 L284 46 Z"/>
    <!-- the shoulder straps, tan, buttoned at the collar -->
    <path fill="#b9ad88" stroke="#060606" stroke-width="5" d="M16 0 L112 0 L112 30 L26 30 Z"/>
    <path fill="#b9ad88" stroke="#060606" stroke-width="5" d="M384 0 L288 0 L288 30 L374 30 Z"/>
    <!-- the slanted chest pockets with their flaps -->
    <g fill="url(#camo)" stroke="#060606" stroke-width="5">
      <path d="M56 150 L170 170 L160 300 L46 280 Z"/>
      <path d="M344 150 L230 170 L240 300 L354 280 Z"/>
      <path fill="#8d9389" d="M50 142 L176 164 L172 206 L46 184 Z"/>
      <path fill="#8d9389" d="M350 142 L224 164 L228 206 L354 184 Z"/>
    </g>
    <g fill="#8b836a" stroke="#060606" stroke-width="4">
      <rect x="92" y="176" width="30" height="16" rx="3"/>
      <rect x="278" y="176" width="30" height="16" rx="3"/>
    </g>
    <!-- BACK: the collar and a yoke seam -->
    <path fill="url(#camo)" stroke="#060606" stroke-width="6" d="M496 0 L704 0 L696 46 L504 46 Z"/>
    <path fill="#8a9086" stroke="none" d="M504 40 L696 40 L696 46 L504 46 Z"/>
    <path fill="none" stroke="#6b7268" stroke-width="6" d="M416 120 C520 140 680 140 784 120"/>
    <path fill="#b9ad88" stroke="#060606" stroke-width="5" d="M416 0 L512 0 L512 30 L426 30 Z"/>
    <path fill="#b9ad88" stroke="#060606" stroke-width="5" d="M784 0 L688 0 L688 30 L774 30 Z"/>
    <!-- SIDES: the side seams, the collar's end -->
    <path fill="url(#camo)" stroke="#060606" stroke-width="6" d="M856 0 L944 0 L940 46 L860 46 Z"/>
    <path fill="url(#camo)" stroke="#060606" stroke-width="6" d="M1056 0 L1144 0 L1140 46 L1060 46 Z"/>
    <g fill="none" stroke="#6b7268" stroke-width="5">
      <path d="M900 60 L900 466"/><path d="M1100 60 L1100 466"/>
    </g>
    <!-- the jacket's hem all round, the trousers below with their waistband -->
    <path fill="none" stroke="#060606" stroke-width="6" d="M0 470 L1200 470"/>
    <path fill="none" stroke="#6b7268" stroke-width="8" d="M0 486 L1200 486"/>
    <g fill="none" stroke="#6b7268" stroke-width="5">
      <path d="M120 490 L120 560 M280 490 L280 560 M600 490 L600 560"/>
    </g>
    <!-- TOP: the shoulders from above, the collar along the front edge and the straps out to the arms -->
    <path fill="url(#camo)" stroke="#060606" stroke-width="6" d="M96 560 L304 560 C298 600 254 620 200 620 C146 620 102 600 96 560 Z"/>
    <path fill="#b9ad88" stroke="#060606" stroke-width="5" d="M8 574 L108 578 L108 612 L8 608 Z"/>
    <path fill="#b9ad88" stroke="#060606" stroke-width="5" d="M392 574 L292 578 L292 612 L392 608 Z"/>
    <g fill="#8b836a" stroke="#060606" stroke-width="4">
      <circle cx="98" cy="595" r="8"/><circle cx="302" cy="595" r="8"/>
    </g>
  </g>
</svg>
