<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://mayurski-art.github.io https://trollrunner.net https://www.trollrunner.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://tjsyhfplxjtakdfkpdtg.supabase.co wss://tjsyhfplxjtakdfkpdtg.supabase.co https://solana-rpc.publicnode.com https://api.devnet.solana.com https://lite-api.jup.ag; object-src 'none'; base-uri 'self'; frame-ancestors 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050008">
  <meta name="description" content="Troll Runner Arcade — Trollrunner Game Night. Cursed meme-coin cabinets from Troll Kombat to Papa Troll's Pizzeria. Take the controller.">
  <title>Troll Runner Arcade — Game Night</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23050008'/%3E%3Ctext x='6' y='40' font-size='17' fill='%234dff73' font-family='monospace' font-weight='900'%3E%24T%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;900&family=DM+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/games/hub/base.css?v=hub-base-v1">
  <link rel="stylesheet" href="assets/games/hub/arcade-hub.css?v=hub-v6-hidden-cards">
  <link rel="stylesheet" href="assets/games/hub/preview.css?v=preview-v1">
  <link rel="stylesheet" href="assets/css/troll-leaderboard.css?v=lb-engine-v1">
  <style>
    /* Matches the back-arrow added to Maps/Stickers/PFP Studio when
       those subdomains folded into this repo — same fixed top-left
       affordance, adapted to the arcade's dark palette (tokens come from
       hub/base.css's :root, already loaded above). */
    .back-island{
      position:fixed; top:16px; left:16px; z-index:80;
      display:inline-flex; width:36px; height:36px; border-radius:10px;
      align-items:center; justify-content:center; font-size:16px;
      background:var(--panel-strong); border:1px solid var(--line); color:var(--ink);
      text-decoration:none;
      transition:background .15s ease, border-color .15s ease;
    }
    .back-island:hover, .back-island:focus-visible{ background:#ffffff1f; border-color:var(--green); }
  </style>
</head>
<body class="intro-complete">
  <a href="https://trollrunner.net/" class="back-island" aria-label="Back to trollrunner.net" title="Back to trollrunner.net">&larr;</a>
  <div class="hub-shell">
    <header class="hub-topbar">
      <div class="hub-topbar-brand">
        <div class="hub-logo">TROLLRUNNER<span>ARCADE</span></div>
      </div>

      <div class="hub-topbar-account">
        <button type="button" class="hub-profile-card" id="hub-profile-card" aria-label="Account">
          <span class="hub-profile-avatar" id="hub-profile-avatar">🧌</span>
          <span class="hub-profile-text">
            <span class="hub-profile-name" id="hub-profile-name">Guest troll</span>
            <span class="hub-profile-sub" id="hub-profile-sub">Log in to save progress</span>
          </span>
        </button>
        <!-- ?enter=1 skips trollrunner.net's boot/lock entrance (loading bar +
             drag-the-troll-to-the-finish-line) — see index.html there for why
             a same-origin sessionStorage relay can't be used from this
             different-origin subdomain instead. -->
        <a class="hub-home-link" href="https://trollrunner.net/?enter=1" aria-label="Home">🏠</a>
      </div>
    </header>

    <main class="hub-main" id="hub-games">
      <div class="hub-hero">
        <h1>Choose Games</h1>
      </div>

      <div class="hub-carousel" id="hub-carousel" aria-label="Games">
        <div class="hub-carousel-track" id="hub-carousel-track">
        <article class="hub-card" data-accent="green" data-preview='{"summary":"A meme-coin fighting game — pick your troll, brawl locally on one keyboard or host/join an online match with a room code.","controls":["P1 — A/D move, W jump, S crouch, J punch, K kick, L special, Space block, Shift dash","P2 — ←/→ move, ↑ jump, ↓ crouch, 1 punch, 2 kick, 3 special, 0 block, 5 dash","Touch — pad to move, 👊 punch, 🦵 kick, ✨ special, 🛡 block","Pause — P1 Esc/P, P2 Enter (versus mode needs both players to approve)"],"playersOnline":"live"}'>
          <div class="hub-card-art">
            <span class="hub-card-tag">Fighting</span>
            <img src="assets/games/troll-kombat/ui/trollkombat-prescreen.jpg" alt="Troll Kombat key art — Pepe, the gladiator trollface, and Doge facing off">
          </div>
          <div class="hub-card-body">
            <h3>Troll Kombat</h3>
            <p class="hub-card-meta">👥 2-Player</p>
            <a class="hub-card-play" href="troll-kombat.html" data-fs="Troll Kombat">Play Now ▶</a>
          </div>
        </article>

        <article class="hub-card" data-accent="green" data-category="shooter" data-title="troll forces troll ops troll royale battle royale shooter fps" data-preview='{"summary":"Online troll FPS — team deathmatch, Search & Destroy, Infection, zombies and Troll Royale on a floating island. Skins, scorestreaks, the Trollsaber and the Keyboard Warrior.","controls":["WASD to move, mouse to aim","Left click to fire, R to reload","Shift to sprint, Space to jump","G lethal, F tactical, X swap or pick up"],"playersOnline":"live"}'>
          <div class="hub-card-art">
            <span class="hub-card-tag">Shooter</span>
            <img src="assets/games/troll-ops/ui/troll-forces-key-art.jpg?v=2" alt="Troll Forces key art — four trolls with a skinned Problem 416, the Trollsaber, the Keyboard Warrior and a Vice Grin rifle on Trollface Island" loading="lazy">
          </div>
          <div class="hub-card-body">
            <h3>Troll Forces</h3>
            <p class="hub-card-meta">👥 Online PvP · Troll Royale</p>
            <a class="hub-card-play" href="troll-ops.html" data-fs="Troll Forces">Play Now ▶</a>
          </div>
        </article>
        </div>
      </div>

      <section class="arcade-rack leaderboard-rack" aria-labelledby="arcade-lb-title">
        <div class="section-heading">
          <p class="eyebrow">Weekly ladder</p>
          <h2 id="arcade-lb-title">Top Trolls — Whole Arcade</h2>
        </div>
        <div id="arcade-lb-root" class="lb-root">
          <p class="lb-foot">Loading leaderboard…</p>
        </div>
      </section>

      <div class="hub-footer">
        <div class="hub-stats">
          <div class="hub-stat">
            <span class="hub-stat-icon">🎮</span>
            <div>
              <p class="hub-stat-label">Games played</p>
              <p class="hub-stat-value" id="hub-stat-played">--</p>
            </div>
          </div>
          <div class="hub-stat">
            <span class="hub-stat-icon">👑</span>
            <div>
              <p class="hub-stat-label">High score</p>
              <p class="hub-stat-value" id="hub-stat-highscore">--</p>
            </div>
          </div>
          <div class="hub-stat">
            <span class="hub-stat-icon">⭐</span>
            <div>
              <p class="hub-stat-label">Achievements</p>
              <p class="hub-stat-value" id="hub-stat-achievements">-- / --</p>
            </div>
          </div>
          <div class="hub-stat">
            <span class="hub-stat-icon">🏆</span>
            <div>
              <p class="hub-stat-label">Rank</p>
              <p class="hub-stat-value" id="hub-stat-rank">--</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/games/hub/arcade-hub.js?v=hub-v9-login-copy" defer></script>
  <script src="assets/games/hub/preview.js?v=preview-v1" defer></script>
  <script src="assets/js/fs-launcher.js?v=fsl-v1" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.3" integrity="sha384-uVefCux0Kf6w34gQVv8+jUPUwvwFUdnrcwI1kOJHs7sfPPXdDDucwcrPrppD6oUe" crossorigin="anonymous"></script>
  <script src="https://www.trollrunner.net/assets/js/troll-accounts.js"></script>
  <script src="assets/games/shared/site-lock.js"></script>
  <script src="https://mayurski-art.github.io/assets/js/troll-notis.js"></script>
  <script src="assets/js/troll-leaderboard.js?v=lb-engine-v1"></script>
  <script>
    if (window.TrollLeaderboard) window.TrollLeaderboard.mountArcadeBoard("#arcade-lb-root");
  </script>
</body>
</html>
