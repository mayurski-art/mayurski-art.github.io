<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Spotify entries are for Troll Radio: the IFrame Embed API script comes
       from open.spotify.com and mounts a player iframe, so both script-src
       and frame-src have to name it or the radio silently never loads. It
       also evaluates strings, hence 'unsafe-eval' — index.html's CSP carries
       it for the same player. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://open.spotify.com https://*.spotifycdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://open.spotify.com https://*.spotifycdn.com; frame-src https://open.spotify.com https://*.spotify.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>TROLLRUNNER WORLD</title>
  <meta name="description" content="The TrollRunner world — every app on the island. Run to enter.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TROLLRUNNER">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
  <script>
  // The other half of the phone routing in index.html: this page is the phone
  // entrance, so a desktop visitor who lands here directly is sent to the
  // troll desktop. ?mobile=1 opts out, which is how you preview this on a
  // laptop without being bounced.
  (() => {
    try {
      const q = new URLSearchParams(location.search);
      // ?mobile=1 previews on a laptop; ?embed=1 means index.html is already
      // hosting us at the root URL, so bouncing would fight its own swap.
      if (q.has('mobile') || q.has('embed')) return;
    } catch {}
    const ua = navigator.userAgent || '';
    const isPhone =
      /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) ||
      (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ||
      (matchMedia('(pointer: coarse)').matches && matchMedia('(max-width: 820px)').matches);
    if (!isPhone) location.replace('/?desktop=1');
  })();
  </script>
  <style>
    :root {
      --font-display: "Archivo Black", Impact, "Arial Black", sans-serif;
      --font-ui: "Space Grotesk", system-ui, Arial, sans-serif;
      --font-mono: "Rubik", system-ui, Arial, sans-serif;

      --accent: #8fe36a;
      --fg: #ffffffeb;
      --fg-dim: #ffffff8c;
      --legible: 0 1px 12px #00000059;
      --ease: cubic-bezier(.22, 1, .36, 1);

      --glass-fill: #060608d1;
      --glass-stroke: #ffffff1a;
      --glass-highlight: #ffffff14;
      --glass-radius: 8px;
      --glass-blur: blur(34px) saturate(160%);
      --glass-shadow: 0 28px 70px #000000a6, 0 2px 10px #00000073,
                      inset 0 1px 0 var(--glass-highlight), inset 0 -1px 0 #ffffff08;
      --glass-bg: linear-gradient(165deg, #ffffff0d 0%, #ffffff04 38%, #00000047 100%), var(--glass-fill);

      /* Their site swaps the pointer for a troll; ours uses our own face,
         cut from the official logo art in the PFP set. */
      --cursor-troll: url(assets/images/troll-cursor.png) 6 3, pointer;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: #000; color: var(--fg);
      font-family: var(--font-ui); -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    a, button, .app, .runner { cursor: var(--cursor-troll); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
    .vh {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ---------- space ---------- */
    .space { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #000; pointer-events: none; }
    .space canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .space::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 70% 55% at 50% 58%, #0d1a12 0%, transparent 70%);
    }

    /* ---------- animated wallpaper ----------
       Sits as its own rectangle in the middle of the screen, icons above it
       and the dock below, with the starfield showing through behind. `contain`
       keeps the whole clip visible — `cover` cropped it to a close-up of the
       track on a portrait phone. No mask: the frame stays as authored. */
    .island {
      position: fixed; z-index: 1; left: 50%; top: 54%;
      /* Overridden on phones below, where three rows of icons need the room. */
      transform: translate(-50%, -50%);
      width: min(96vw, 1000px); aspect-ratio: 16 / 9;
      pointer-events: none;
    }
    .island video { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* ================= BOOT ================= */
    .boot {
      position: fixed; inset: 0; z-index: 90; background: #000;
      display: grid; place-content: center; justify-items: center; gap: 22px;
      transition: opacity .5s var(--ease), visibility 0s linear .5s;
    }
    body[data-phase="boot"] .boot { opacity: 1; visibility: visible; transition-delay: 0s; }
    body:not([data-phase="boot"]) .boot { opacity: 0; visibility: hidden; pointer-events: none; }
    .boot .wordmark { font-size: clamp(34px, 9vw, 58px); }
    /* Carried over from the desktop gate so the phone entrance reads as the
       same brand, restated in this page's palette rather than its own. */
    .est {
      margin: 0; font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .38em; text-indent: .38em; color: var(--fg-dim);
      text-transform: uppercase;
    }
    .boot-bar {
      width: min(64vw, 320px); height: 4px; border-radius: 99px;
      background: #ffffff1f; overflow: hidden;
    }
    .boot-bar i { display: block; height: 100%; width: 0%; background: #fff; border-radius: 99px; }
    .boot-line {
      font-family: var(--font-mono); font-size: 14px; color: var(--fg-dim);
      letter-spacing: .04em;
    }
    .boot-line b { color: var(--fg); font-weight: 400; }
    .caret {
      display: inline-block; width: 8px; height: 15px; background: var(--fg-dim);
      vertical-align: -2px; margin-left: 3px; animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ================= SHELL ================= */
    .shell {
      position: relative; z-index: 3; min-height: 100%;
      display: flex; flex-direction: column;
      opacity: 0; transition: opacity .6s var(--ease);
    }
    body:not([data-phase="boot"]) .shell { opacity: 1; }

    .topbar {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: 22px 26px; gap: 12px;
    }
    .stat {
      font-family: var(--font-ui); font-weight: 700; font-size: 14px;
      text-shadow: var(--legible); justify-self: start;
    }
    .stat span { color: var(--fg-dim); font-weight: 500; }
    .wordmark {
      display: inline-flex; align-items: center; gap: 1px; justify-self: center;
      font-family: var(--font-display); font-size: 24px; line-height: 1;
      letter-spacing: -.01em; text-shadow: var(--legible); white-space: nowrap;
    }
    .wordmark img { width: 26px; height: 26px; object-fit: contain; margin: 0 1px; }
    .menu-btn {
      width: 42px; height: 42px; display: grid; place-items: center;
      border-radius: 8px; justify-self: end; transition: background .2s var(--ease);
    }
    .menu-btn:hover { background: #ffffff14; }
    .menu-btn span, .menu-btn span::before, .menu-btn span::after {
      display: block; width: 22px; height: 2px; background: var(--fg); border-radius: 2px;
      transition: transform .3s var(--ease), opacity .2s var(--ease);
    }
    .menu-btn span { position: relative; }
    .menu-btn span::before, .menu-btn span::after { content: ""; position: absolute; left: 0; }
    .menu-btn span::before { top: -7px; }
    .menu-btn span::after { top: 7px; }

    /* ================= APP GRID ================= */
    .apps {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 20px 10px; width: 100%; max-width: 520px; margin: 6px auto 0;
      padding: 0 18px;
      opacity: 0; transform: translateY(-10px);
      transition: opacity .5s var(--ease) .1s, transform .6s var(--ease) .1s;
    }
    body[data-phase="home"] .apps { opacity: 1; transform: none; }
    .app { display: grid; justify-items: center; gap: 7px; }
    .app-tile {
      width: 62px; height: 62px; border-radius: 15px; overflow: hidden;
      background: #101014; border: 1px solid var(--glass-stroke);
      box-shadow: 0 8px 20px #000000a6;
      display: grid; place-items: center;
      transition: transform .22s var(--ease), box-shadow .22s var(--ease);
    }
    .app:hover .app-tile, .app:focus-visible .app-tile {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 14px 26px #000000c4, 0 0 16px color-mix(in srgb, var(--c, var(--accent)) 55%, transparent);
    }
    .app-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .app-name {
      font-size: 12px; font-weight: 500; text-align: center; line-height: 1.2;
      text-shadow: var(--legible); color: var(--fg);
    }
    /* PFP has no final art yet — the tile says so instead of faking one. */
    .app-tile.is-placeholder {
      border: 1.5px dashed color-mix(in srgb, var(--c) 65%, transparent);
      background: linear-gradient(165deg, #ffffff12, #00000059);
      display: grid; place-content: center; gap: 2px;
    }
    .app-tile.is-placeholder b {
      font-family: var(--font-display); font-size: 13px; color: var(--c); line-height: 1;
    }
    .app-tile.is-placeholder i {
      font-family: var(--font-mono); font-style: normal; font-size: 7px;
      color: var(--fg-dim); letter-spacing: .1em; text-align: center;
    }

    /* ================= RUN TO ENTER ================= */
    .lockbar {
      padding: 18px 20px calc(24px + env(safe-area-inset-bottom));
      display: grid; justify-items: center; gap: 12px;
      /* Pushed to the foot of the shell: the tagline and the track are the
         lock screen's only controls, and they belong under the thumb. */
      margin-top: auto;
      transition: opacity .45s var(--ease), transform .5s var(--ease);
    }
    /* The dock follows the lockbar in source order, so while it's only faded
       out it still reserves space and lifts the track off the bottom. */
    body:not([data-phase="home"]) .dock { display: none; }
    /* Same for the app grid above: invisible during lock, but it shouldn't
       hold the layout open either. */
    body:not([data-phase="home"]) .apps { display: none; }
    /* The footer sits after the lockbar, so with the track pinned to the foot
       it would be shoved past the fold and make the lock screen scroll. Named
       phases rather than :not(home) — this selector outweighs the base .foot
       rule, so it decides the footer in every phase and should say which. */
    body[data-phase="boot"] .foot,
    body[data-phase="lock"] .foot { display: none; }
    /* On home the dock owns the bottom edge; a footer under it only lands on
       top of the wallpaper as ghost text. */
    body[data-phase="home"] .foot { display: none; }
    body:not([data-phase="lock"]) .lockbar {
      opacity: 0; transform: translateY(16px); pointer-events: none;
      position: absolute; bottom: 0; left: 0; right: 0;
    }
    .track {
      position: relative; width: min(92vw, 560px); height: 68px;
      border-radius: 999px; overflow: hidden;
      background: var(--glass-bg); border: 1px solid var(--glass-stroke);
      box-shadow: var(--glass-shadow);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      touch-action: none;
    }
    /* lane markings so it reads as a running track, not a slider */
    .track::before {
      content: ""; position: absolute; inset: 50% 78px auto 68px; height: 2px;
      transform: translateY(-50%);
      background: repeating-linear-gradient(90deg, #ffffff2b 0 14px, transparent 14px 30px);
    }
    .track-fill {
      position: absolute; inset: 0 auto 0 0; width: 0;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 16%, transparent), color-mix(in srgb, var(--accent) 34%, transparent));
    }
    .finish {
      position: absolute; top: 0; bottom: 0; right: 0; width: 54px;
      background:
        repeating-conic-gradient(#ffffffd9 0 25%, #00000000 0 50%) 0 0 / 12px 12px;
      opacity: .5; border-left: 1px solid var(--glass-stroke);
    }
    .track-label {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-family: var(--font-display); font-size: 15px; letter-spacing: .06em;
      color: var(--fg-dim); pointer-events: none; text-transform: uppercase;
    }
    .track-label .dist {
      font-family: var(--font-mono); letter-spacing: .04em;
      color: var(--accent); text-transform: none;
    }
    .runner {
      position: absolute; top: 5px; left: 5px; width: 58px; height: 58px;
      border-radius: 999px; background: #0d0d11;
      border: 1px solid var(--glass-stroke); box-shadow: 0 6px 18px #000000a6;
      display: grid; place-items: center; cursor: grab; touch-action: none;
      will-change: transform;
    }
    .runner:active { cursor: grabbing; }
    .runner img { width: 42px; height: 42px; object-fit: contain; pointer-events: none; }
    .lock-hint {
      font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim);
      letter-spacing: .08em; text-transform: uppercase;
    }
    /* The promise above the door. RUN takes the accent because it's the verb
       the whole brand turns on — and the gesture below it is a race. */
    .tagline {
      margin: 0 0 2px; font-family: var(--font-display);
      font-size: clamp(15px, 4.2vw, 22px); letter-spacing: -.01em;
      text-transform: uppercase; text-align: center; text-shadow: var(--legible);
      color: var(--fg);
    }
    .tagline em { font-style: normal; color: var(--accent); }

    /* ================= DOCK ================= */
    .dock {
      /* margin-top:auto drops it to the foot of the shell, clear of the
         wallpaper rectangle rather than floating across it. */
      margin: auto auto calc(18px + env(safe-area-inset-bottom));
      display: flex; gap: 22px; padding: 12px 20px;
      background: var(--glass-bg); border: 1px solid var(--glass-stroke);
      border-radius: 22px; box-shadow: var(--glass-shadow);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      opacity: 0; transform: translateY(14px);
      transition: opacity .5s var(--ease) .2s, transform .6s var(--ease) .2s;
    }
    body[data-phase="home"] .dock { opacity: 1; transform: none; }
    body:not([data-phase="home"]) .dock { pointer-events: none; }
    .dock a { display: grid; justify-items: center; gap: 6px; width: 56px; }
    .dock .ico {
      width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center;
      background: #14141a; border: 1px solid var(--glass-stroke);
      transition: transform .2s var(--ease);
    }
    .dock a:hover .ico, .dock a:focus-visible .ico { transform: translateY(-3px) scale(1.06); }
    .dock svg { width: 22px; height: 22px; fill: var(--fg); }
    .dock span { font-size: 10.5px; color: var(--fg-dim); }

    /* ================= FOOTER (desktop) ================= */
    .foot {
      display: none;
      align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding: 0 30px 24px;
      font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em;
      color: var(--fg-dim); text-transform: uppercase;
    }
    .foot a:hover { color: var(--accent); }

    /* ================= MENU SHEET ================= */
    .sheet {
      position: fixed; inset: 0; z-index: 80; overflow-y: auto;
      padding: 78px 22px 40px;
      background: linear-gradient(170deg, #0b0f0c 0%, #000 55%);
      opacity: 0; visibility: hidden; transform: translateY(10px);
      transition: opacity .28s var(--ease), transform .34s var(--ease), visibility 0s linear .28s;
    }
    .sheet.is-open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s, 0s, 0s; }
    .sheet-inner {
      max-width: 640px; margin: 0 auto;
      background: var(--glass-bg); border: 1px solid var(--glass-stroke);
      border-radius: 20px; box-shadow: var(--glass-shadow); padding: 30px 26px 26px;
    }
    .sheet h2 { font-family: var(--font-display); font-size: 40px; margin: 0 0 6px; letter-spacing: -.01em; }
    .sheet .sub { color: var(--fg-dim); margin: 0 0 26px; font-size: 15px; }
    .sheet .group { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--fg-dim); margin: 22px 0 6px; }
    .sheet .link {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 9px 0; font-size: 21px; font-weight: 500;
      transition: color .16s var(--ease), padding-left .18s var(--ease);
    }
    .sheet .link:hover { color: var(--accent); padding-left: 6px; }
    .sheet .link .ext { font-family: var(--font-mono); font-size: 12px; color: var(--fg-dim); }
    .sheet .rule { border: 0; border-top: 1px solid var(--glass-stroke); margin: 26px 0 16px; }
    .sheet .tagline { color: var(--fg-dim); font-size: 13px; margin: 0 0 16px; }
    .socials { display: flex; gap: 20px; }
    .socials a { display: grid; place-items: center; width: 34px; height: 34px; }
    .socials svg { width: 21px; height: 21px; fill: var(--fg); }
    .socials a:hover svg { fill: var(--accent); }
    .sheet-close {
      position: fixed; top: 22px; right: 26px; z-index: 81;
      width: 42px; height: 42px; display: grid; place-items: center; font-size: 26px;
      opacity: 0; visibility: hidden; transition: opacity .28s var(--ease), visibility 0s linear .28s;
    }
    .sheet.is-open ~ .sheet-close { opacity: 1; visibility: visible; transition-delay: 0s; }

    /* Touch devices take the phone treatment at ANY width, not just under
       720px. iOS ignores the viewport meta of a framed document, and
       index.html serves this page to phones inside a full-screen iframe — so
       a 390px iPhone lays this out at roughly 780 CSS px and used to fall
       into the desktop branch below, which is how the app icons went
       missing. Pointer type is the honest question here; width is not. */
    @media (max-width: 720px), (pointer: coarse) {
      .topbar { padding: 16px 16px; }
      .wordmark { font-size: 19px; }
      .wordmark img { width: 21px; height: 21px; }
      .stat { font-size: 12px; }
      .sheet h2 { font-size: 32px; }
      .sheet .link { font-size: 19px; }
      .apps { gap: 12px 4px; margin-top: 2px; }
      .app-tile { width: 54px; height: 54px; border-radius: 13px; }
      .app-name { font-size: 11px; }
      /* Eleven icons make three rows, so the wallpaper drops clear of them.
         Anchored off the BOTTOM, above the dock, rather than at a fixed 66%:
         the grid's height moves with the tile size and the viewport, and a
         percentage from the top kept letting the last row of labels land on
         the artwork. */
      .island { top: auto; bottom: 14vh; transform: translateX(-50%); width: 90vw; }
      .track { height: 62px; }
      .runner { width: 52px; height: 52px; }
      .runner img { width: 38px; height: 38px; }
    }
    /* Same reason: when the layout viewport can't be trusted, px tile sizes
       can't be either. Sizing in vw with px bounds keeps a tile roughly a
       thumb wide whether this document thinks it's 390px or 780px. */
    @media (pointer: coarse) {
      .apps { max-width: min(520px, 96vw); padding: 0 3vw; gap: 3vw 1vw; }
      .app-tile { width: clamp(54px, 15vw, 120px); height: clamp(54px, 15vw, 120px); }
      .app-name { font-size: clamp(11px, 3vw, 23px); }
      /* On a phone the art IS the icon: no plate, no crop, no rounded
         clipping — the source PNGs render exactly as they sit in
         assets/images/icons, transparent edges and all. */
      .app-tile { background: none; border: 0; border-radius: 0; box-shadow: none; overflow: visible; }
      .app-tile img { object-fit: contain; }
      .app:hover .app-tile, .app:focus-visible .app-tile { box-shadow: none; }
      /* The dashed "PFP SOON" plate is the exception — it has no art behind
         it, so stripping its box would leave the label floating on nothing. */
      .app-tile.is-placeholder { border: 1.5px dashed color-mix(in srgb, var(--c) 65%, transparent);
        background: linear-gradient(165deg, #ffffff12, #00000059); border-radius: clamp(13px, 3.6vw, 28px); }
    }
    @media (min-width: 721px) and (pointer: fine) {
      /* The island launcher this branch was written for is gone, so the app
         grid is the launcher at every size now — it just gets more room. */
      .apps { max-width: 760px; gap: 26px 14px; }
      .app-tile { width: 76px; height: 76px; border-radius: 18px; }
      .app-name { font-size: 13px; }
      /* Their desktop anchors the wordmark top-left rather than centring it,
         and drops the stat line the phone header carries. */
      .topbar { display: flex; justify-content: space-between; padding: 26px 30px; }
      .stat { display: none; }
      .wordmark { font-size: 27px; }
      .wordmark img { width: 29px; height: 29px; }
    }

    /* ================= TROLL RADIO =================
       Bottom-right of the home screen, clear of the centred dock. The button
       is the whole UI until you tap it; the panel slides up from it. */
    .radio-btn {
      position: fixed; z-index: 60;
      right: calc(14px + env(safe-area-inset-right));
      bottom: calc(20px + env(safe-area-inset-bottom));
      width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
      background: var(--glass-bg); border: 1px solid var(--glass-stroke);
      box-shadow: var(--glass-shadow);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      transition: transform .2s var(--ease), opacity .3s var(--ease), border-color .2s var(--ease);
    }
    .radio-btn svg { width: 23px; height: 23px; fill: var(--fg); }
    .radio-btn:active { transform: scale(.94); }
    /* Playing state has to read at a glance from across the room. */
    .radio-btn.is-playing { border-color: color-mix(in srgb, var(--accent) 70%, transparent); }
    .radio-btn.is-playing svg { fill: var(--accent); }
    .radio-btn.is-playing::after {
      content: ""; position: absolute; inset: -4px; border-radius: 50%;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      animation: radio-pulse 1.8s var(--ease) infinite;
    }
    @keyframes radio-pulse { 0% { transform: scale(.94); opacity: .9; } 100% { transform: scale(1.22); opacity: 0; } }
    body:not([data-phase="home"]) .radio-btn { opacity: 0; pointer-events: none; }

    .radio {
      position: fixed; z-index: 61;
      right: calc(10px + env(safe-area-inset-right));
      bottom: calc(84px + env(safe-area-inset-bottom));
      width: min(330px, calc(100vw - 20px));
      background: var(--glass-bg); border: 1px solid var(--glass-stroke);
      border-radius: 18px; box-shadow: var(--glass-shadow); overflow: hidden;
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      opacity: 0; visibility: hidden; transform: translateY(12px) scale(.97);
      transform-origin: 100% 100%;
      transition: opacity .24s var(--ease), transform .3s var(--ease), visibility 0s linear .24s;
    }
    .radio.is-open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s, 0s, 0s; }
    .radio-head {
      display: flex; align-items: center; gap: 8px; padding: 11px 12px 9px;
      border-bottom: 1px solid var(--glass-stroke);
      font-family: var(--font-display); font-size: 13px; letter-spacing: .08em;
    }
    .radio-head .grin { width: 18px; height: 18px; object-fit: contain; }
    .radio-head .sp { flex: 1; }
    .radio-head button, .radio-head a {
      width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px;
      font-family: var(--font-ui); font-size: 13px; color: var(--fg-dim);
      transition: background .16s var(--ease), color .16s var(--ease);
    }
    .radio-head button:hover, .radio-head a:hover { background: #ffffff14; color: var(--fg); }
    .radio-head button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }

    .radio-body { display: grid; gap: 10px; padding: 13px 14px 14px; }
    .radio-now { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .radio-art {
      width: 46px; height: 46px; flex: none; border-radius: 10px; overflow: hidden;
      background: #101014; border: 1px solid var(--glass-stroke); display: grid; place-items: center;
    }
    .radio-art img { width: 100%; height: 100%; object-fit: cover; }
    .radio-meta { min-width: 0; flex: 1; }
    .radio-song {
      font-weight: 700; font-size: 14px; line-height: 1.25;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .radio-artist {
      font-size: 11.5px; color: var(--fg-dim); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .radio-seekrow {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 10px; color: var(--fg-dim);
      font-variant-numeric: tabular-nums;
    }
    .radio-seekrow span { flex: none; min-width: 30px; text-align: center; }
    .radio-seek {
      flex: 1; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px;
      background: #ffffff26; outline: none;
    }
    .radio-seek::-webkit-slider-thumb {
      -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
      background: var(--accent); border: 0; cursor: pointer;
    }
    .radio-seek::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--accent); border: 0; }
    .radio-transport { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .radio-transport button {
      width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
      background: #ffffff0f; border: 1px solid var(--glass-stroke); font-size: 14px;
      transition: background .16s var(--ease), transform .16s var(--ease);
    }
    .radio-transport button:active { transform: scale(.93); }
    .radio-transport .play { width: 52px; height: 52px; background: var(--accent); color: #06140a; border-color: transparent; font-size: 17px; }
    .radio-status {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: .05em;
      color: var(--fg-dim); text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* Spotify's IFrame API exposes no track list and no skip, so the list is
       ours (assets/js/troll-radio-tracks.js) and skipping means loading the
       next URI by hand. */
    .radio-list { max-height: 0; overflow: hidden; transition: max-height .28s var(--ease); }
    .radio.is-browsing .radio-list { max-height: 46vh; border-top: 1px solid var(--glass-stroke); }
    .radio-list-inner { max-height: 46vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .radio-row {
      display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px 13px;
      text-align: left; font-size: 12.5px; border-bottom: 1px solid #ffffff0d;
    }
    .radio-row:hover { background: #ffffff0f; }
    .radio-row.is-current { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .radio-row-num {
      flex: none; width: 18px; text-align: right; font-family: var(--font-mono);
      font-size: 10px; color: var(--fg-dim);
    }
    .radio-row.is-current .radio-row-num { color: var(--accent); }
    .radio-row-info { min-width: 0; flex: 1; }
    .radio-row-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .radio-row-artist { font-size: 10.5px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* The real player. Never display:none and never removed — either kills
       playback — just parked off-screen. */
    .radio-host { position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; overflow: hidden; }

    @media (prefers-reduced-motion: reduce) {
      .apps, .dock, .shell, .boot, .sheet { animation: none !important; transition-duration: .01ms !important; }
      .app-tile { transition: none; }
      .caret { animation: none; }
      .radio-btn.is-playing::after { animation: none; }
    }
  </style>
</head>
<body data-phase="boot">

  <!-- Track Island, the same wallpaper the desktop uses. The still is the
       poster so there's art on screen before the video decodes, and it stays
       the whole picture if a phone refuses to autoplay. -->
  <div class="space" aria-hidden="true"><canvas id="stars"></canvas></div>

  <!-- Track Island, the desktop's animated wallpaper. The clip is painted on a
       daytime sky, so it's masked down to the island itself — otherwise it
       lands in the starfield as a sky-blue rectangle. -->
  <div class="island" aria-hidden="true">
    <video id="wp" autoplay loop muted playsinline preload="auto"
           poster="assets/images/wallpaper/trollrunner wallpaper 1.jpg">

    </video>
  </div>

  <!-- ============ BOOT ============ -->

    <div class="boot-bar"><i id="boot-fill"></i></div>

  </div>

  <!-- ============ SHELL ============ -->
  <div class="shell">
    <header class="topbar">
      <span class="stat" id="stat"></span>
      <a class="wordmark" href="/" aria-label="TrollRunner home">
        TR<img src="assets/animations/troll-grin.gif" alt="">LLRUNNER
      </a>
      <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="sheet" aria-label="Open menu">
        <span></span>
      </button>
    </header>

    <nav class="apps" id="apps" aria-label="Apps"></nav>


    <!-- ============ RUN TO ENTER ============ -->
    <div class="lockbar" id="lockbar">
      <p class="tagline">watch troll <em>RUN</em> to billions</p>
      <div class="track" id="track">
        <div class="track-fill" id="track-fill"></div>
        <div class="finish" aria-hidden="true"></div>
        <div class="track-label" id="track-label">Run to enter</div>
        <div class="runner" id="runner" role="button" tabindex="0"
             aria-label="Run to enter — drag right, or press Enter">

        </div>

      <p class="lock-hint" id="lock-hint">Drag the troll to the finish line</p>
    </div>

    <nav class="dock" id="dock" aria-label="Social"></nav>

  </div>

  <!-- ============ TROLL RADIO ============ -->
  <button class="radio-btn" id="radio-btn" type="button" aria-expanded="false" aria-controls="radio" aria-label="Troll Radio">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>
  </button>
  <div class="radio" id="radio" role="dialog" aria-label="Troll Radio" aria-hidden="true">
    <div class="radio-head">
      <img class="grin" src="assets/animations/troll-grin.gif" alt="">
      <span class="sp">TROLL RADIO</span>
      <button id="radio-list-btn" type="button" aria-label="Browse the playlist" aria-pressed="false" aria-controls="radio-list">☰</button>
      <a href="https://open.spotify.com/playlist/0ni59E9HbWpAe8Ydnseh4O" target="_blank" rel="noopener" aria-label="Open the playlist on Spotify">↗</a>
      <button id="radio-close" type="button" aria-label="Close Troll Radio">✕</button>
    </div>
    <div class="radio-body">
      <div class="radio-now">
        <span class="radio-art"><img src="assets/animations/troll-grin.gif" alt=""></span>
        <span class="radio-meta">
          <span class="radio-song" id="radio-song">Troll Radio</span>
          <span class="radio-artist" id="radio-artist">Press play</span>
        </span>
      </div>
      <div class="radio-seekrow">
        <span id="radio-cur">0:00</span>
        <input class="radio-seek" id="radio-seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek through the track">
        <span id="radio-dur">0:00</span>
      </div>
      <div class="radio-transport">
        <button id="radio-prev" type="button" aria-label="Previous track">⏮</button>
        <button id="radio-play" class="play" type="button" aria-label="Play">▶</button>
        <button id="radio-next" type="button" aria-label="Next track">⏭</button>
      </div>
      <p class="radio-status" id="radio-status" aria-live="polite">Loading music…</p>
    </div>
    <div class="radio-list" id="radio-list">
      <div class="radio-list-inner" id="radio-list-inner" role="listbox" aria-label="Choose a song"></div>
    </div>
  </div>
  <!-- The API REPLACES the node it's handed with its iframe, taking the
       node's class with it — so the off-screen box has to be the wrapper,
       not the target, or the player lands in the middle of the page. -->
  <div class="radio-host" aria-hidden="true"><div id="radio-host"></div></div>

  <!-- ============ MENU ============ -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Menu">
    <div class="sheet-inner">
      <h2>MENU</h2>
      <p class="sub">Everywhere the Troll Runner goes.</p>
      <div id="sheet-links"></div>
      <hr class="rule">
      <p class="tagline">Run far. Drop trolls. Problem?</p>
      <div class="socials" id="socials"></div>
    </div>
  </div>
  <button class="sheet-close" id="sheet-close" type="button" aria-label="Close menu">✕</button>

  <script src="assets/js/troll-radio-tracks.js?v=20260812a"></script>
  <script>
  (() => {
    'use strict';

    /* Lifetime miles, read off the Coros app and updated by hand — there's no
       Coros API wired up, so this number is only as fresh as the last edit.
       Shown top-left the way trollface.io shows market cap.
       Last updated: 12 Aug 2026. */
    const MILES_RAN = 401;

    /* `h` is height as a % of the island box; width comes from the art's own
       aspect. `t` is the ground contact point in viewBox px (0–700), kept in
       three depth bands — back, mid, front — so the island reads as a surface
       rather than a row. Every t sits inside the land ellipse
       (cx 550, cy 392, rx 424, ry 132) so nothing floats off the edge. */
    const APPS = [
      // back band
      { id: 'terminal', label: 'Terminal',  sub: 'terminal.trollrunner.net',
        href: 'https://terminal.trollrunner.net', external: true, color: '#30d158',
        icon: 'assets/images/icons/terminal.png', img: 'assets/images/world/terminal.png',
        l: 41, t: 346, h: 11 },
      { id: 'stickers', label: 'Stickers',  sub: 'stickers.trollrunner.net',
        href: 'https://stickers.trollrunner.net', external: true, color: '#ff9500',
        icon: 'assets/images/icons/stickers.png', img: 'assets/images/world/stickers.png',
        l: 60, t: 352, h: 15 },
      // mid band
      { id: 'hub',      label: 'The Hub',   sub: 'trollrunner.net',
        href: 'https://www.trollrunner.net', external: true, color: '#4dff73',
        icon: 'assets/images/icons/hub.png', img: 'assets/images/world/hub.png',
        l: 24, t: 380, h: 15 },
      { id: 'pfp',      label: 'PFP Studio', sub: 'Build your troll', to: 'pfp.html',
        color: '#8fe36a', placeholder: true,
        l: 55, t: 436, h: 13 },
      { id: 'finance',  label: 'Finances',  sub: 'finance.trollrunner.net',
        href: 'https://finance.trollrunner.net', external: true, color: '#ffd84d',
        icon: 'assets/images/icons/finances.png', img: 'assets/images/world/finance.png',
        l: 72, t: 384, h: 11 },
      // front band
      { id: 'chat',     label: 'TrollChat', sub: 'Live room', to: 'chat.html',
        color: '#ff9500', icon: 'assets/images/icons/trollchat.png',
        img: 'assets/images/world/chat.png', l: 38, t: 470, h: 12 },
      { id: 'maps',     label: 'Maps',      sub: 'maps.trollrunner.net',
        href: 'https://maps.trollrunner.net', external: true, color: '#30d158',
        icon: 'assets/images/icons/troll-map.png', img: 'assets/images/world/maps.png',
        l: 82, t: 430, h: 11 },

      /* The rest of the desktop dock. These four aren't pages — they're
         windows inside the troll desktop — so they hand off to it with
         ?open=<id>, which index.html reads and opens on boot. */
      { id: 'account',  label: 'Account',        sub: 'Profile & login',
        to: '/?desktop=1&open=account',  color: '#4dff73',
        icon: 'assets/images/icons/account.png' },
      { id: 'updates',  label: 'Latest Updates', sub: 'What just shipped',
        to: '/?desktop=1&open=updates',  color: '#7aa0c4',
        icon: 'assets/images/icons/updates.png' },
      { id: 'feedback', label: 'Feedback',       sub: 'Tell me what broke',
        to: '/?desktop=1&open=feedback', color: '#e3b579',
        icon: 'assets/images/icons/feedback.png' },
      { id: 'recycle',  label: 'Recycle Bin',    sub: 'Deleted, allegedly',
        to: '/?desktop=1&open=recycle',  color: '#9b9ba1',
        icon: 'assets/images/icons/recycle.png' },
    ];

    const SOCIALS = [
      { name: 'X', href: 'https://x.com/troll_runner',
        path: 'M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z' },
      { name: 'TikTok', href: 'https://www.tiktok.com/@mayurski',
        path: 'M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 1 1-2.59-2.59c.27 0 .53.04.78.12v-3.2a5.8 5.8 0 0 0-.78-.05 5.79 5.79 0 1 0 5.79 5.79V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3a4.29 4.29 0 0 1-3.35-1.48z' },
    ];

    const $ = id => document.getElementById(id);
    const body = document.body;

    /* Single place phases change. Hidden layers are faded with opacity, which
       leaves them focusable, so each phase change also parks the inactive ones
       with `inert` — otherwise you can tab onto the unlock runner after you've
       already entered. */
    let lockTimer = 0;
    function setPhase(next) {
      body.dataset.phase = next;
      clearTimeout(lockTimer);
      /* Failsafe. The lock screen is the first thing anyone sees and it holds
         the app icons behind a gesture — so if it goes untouched it enters by
         itself rather than leaving someone staring at a screen they think is
         the whole site. The flourish still plays; it just can't trap you. */
      if (next === 'lock') {
        lockTimer = setTimeout(() => {
          if (body.dataset.phase === 'lock') sprint();
        }, 4200);
      }
      $('lockbar').inert = next !== 'lock';
      $('dock').inert = next !== 'home';
      $('boot').inert = next !== 'boot';
    }
    const calm = window.matchMedia('(prefers-reduced-motion: reduce)');
    const narrow = window.matchMedia('(max-width: 720px)');

    const linkAttrs = (el, a) => {
      if (a.external) {
        el.href = a.href; el.target = '_top'; el.rel = 'noopener';
        el.setAttribute('aria-label', a.label);
      } else {
        el.href = a.to; el.target = '_top';
        el.setAttribute('aria-label', a.label);
      }
    };

    /* ---------- top-left stat ---------- */
    if (MILES_RAN != null) {
      $('stat').innerHTML = `<span>Miles ran:</span> ${Number(MILES_RAN).toLocaleString()}`;
    }

    /* ---------- app grid ---------- */
    const apps = $('apps');
    for (const a of APPS) {
      const el = document.createElement('a');
      el.className = 'app';
      if (a.color) el.style.setProperty('--c', a.color);
      linkAttrs(el, a);

      const tile = document.createElement('span');
      tile.className = 'app-tile' + (a.placeholder ? ' is-placeholder' : '');
      if (a.placeholder) {
        const b = document.createElement('b'); b.textContent = 'PFP';
        const i = document.createElement('i'); i.textContent = 'SOON';
        tile.append(b, i);
      } else {
        const img = document.createElement('img');
        img.src = a.icon; img.alt = ''; img.loading = 'lazy';
        tile.appendChild(img);
      }
      const name = document.createElement('span');
      name.className = 'app-name';
      name.textContent = a.label;
      el.append(tile, name);
      apps.appendChild(el);
    }

    /* ---------- dock ---------- */
    const dock = $('dock');
    const svgIcon = path => {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('aria-hidden', 'true');
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', path);
      svg.appendChild(p);
      return svg;
    };
    for (const s of SOCIALS) {
      const a = document.createElement('a');
      a.href = s.href; a.target = '_top'; a.rel = 'noopener';
      a.setAttribute('aria-label', s.name);
      const ico = document.createElement('span');
      ico.className = 'ico';
      ico.appendChild(svgIcon(s.path));
      const label = document.createElement('span');
      label.textContent = s.name;
      a.append(ico, label);
      dock.appendChild(a);
    }

    /* ---------- menu sheet ---------- */
    const sheet = $('sheet'), menuBtn = $('menu-btn'), sheetClose = $('sheet-close');
    const sheetLinks = $('sheet-links');
    const GROUPS = [
      // ?desktop=1 tells index.html this was a deliberate choice, so it won't
      // bounce a phone straight back here.
      { name: 'World',  items: [{ label: 'Island', to: 'world.html' }, { label: 'Classic desktop', to: '/?desktop=1' }] },
      { name: 'Apps',   items: APPS },
      { name: 'Social', items: SOCIALS.map(s => ({ label: s.name, href: s.href, external: true })) },
    ];
    for (const g of GROUPS) {
      const h = document.createElement('p');
      h.className = 'group'; h.textContent = g.name;
      sheetLinks.appendChild(h);
      for (const it of g.items) {
        const a = document.createElement('a');
        a.className = 'link';
        linkAttrs(a, it);
        a.textContent = it.label;
        if (it.external) {
          const ext = document.createElement('span');
          ext.className = 'ext'; ext.textContent = '↗';
          a.appendChild(ext);
        }
        sheetLinks.appendChild(a);
      }
    }
    for (const s of SOCIALS) {
      const a = document.createElement('a');
      a.href = s.href; a.target = '_top'; a.rel = 'noopener';
      a.setAttribute('aria-label', s.name);
      a.appendChild(svgIcon(s.path));
      $('socials').appendChild(a);
    }

    let lastFocus = null;
    const setSheet = open => {
      sheet.classList.toggle('is-open', open);
      menuBtn.setAttribute('aria-expanded', String(open));
      sheet.inert = !open;
      if (open) { lastFocus = document.activeElement; sheetClose.focus(); }
      else if (lastFocus) { lastFocus.focus(); lastFocus = null; }
    };
    sheet.inert = true;
    menuBtn.addEventListener('click', () => setSheet(true));
    sheetClose.addEventListener('click', () => setSheet(false));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setSheet(false); });

    /* ================= BOOT SEQUENCE ================= */
    const BOOT_LINES = ['lacing up', 'stretching', 'trolololol'];
    const bootFill = $('boot-fill'), bootText = $('boot-text');

    function runBoot() {
      if (sessionStorage.getItem('trollrunner_world_seen') === '1') {
        setPhase('home');
        return;
      }
      if (calm.matches) {
        // No typing theatre for reduced motion — get to the lock screen.
        setPhase('lock');
        sessionStorage.setItem('trollrunner_world_seen', '1');
        return;
      }
      let i = 0, ch = 0, pct = 0;
      const type = setInterval(() => {
        const line = BOOT_LINES[i];
        bootText.textContent = line.slice(0, ++ch);
        if (ch >= line.length) { ch = 0; i = Math.min(i + 1, BOOT_LINES.length - 1); }
      }, 70);
      const grow = setInterval(() => {
        pct = Math.min(100, pct + Math.random() * 9 + 3);
        bootFill.style.width = pct + '%';
        if (pct >= 100) {
          clearInterval(grow); clearInterval(type);
          setTimeout(() => setPhase('lock'), 320);
        }
      }, 130);
      sessionStorage.setItem('trollrunner_world_seen', '1');
    }

    /* ================= RUN TO ENTER =================
       A straight slide-to-unlock would be someone else's gesture. Here the
       handle is the runner, the bar is a lane with a chequered finish, and
       the readout counts distance up as you go. Keyboard users get the same
       thing on arrow keys or Enter, because a drag-only door locks people out. */
    const track = $('track'), runner = $('runner');
    const fill = $('track-fill'), label = $('track-label'), hint = $('lock-hint');
    const RACE_MILES = 1.0;
    let progress = 0, dragging = false, startX = 0, startProgress = 0, done = false;

    const travel = () => track.clientWidth - runner.offsetWidth - 10;

    function render() {
      const x = progress * travel();
      runner.style.transform = `translateX(${x}px)`;
      fill.style.width = `${progress * 100}%`;
      if (progress > 0.02) {
        label.innerHTML = `<span class="dist">${(progress * RACE_MILES).toFixed(2)} mi</span>`;
      } else {
        label.textContent = 'Run to enter';
      }
    }

    function finish() {
      if (done) return;
      done = true;
      progress = 1; render();
      label.innerHTML = '<span class="dist">Finished</span>';
      hint.textContent = 'Welcome to the island';
      runner.setAttribute('aria-disabled', 'true');
      setTimeout(() => setPhase('home'), calm.matches ? 0 : 420);
    }

    function setProgress(p) {
      progress = Math.max(0, Math.min(1, p));
      render();
      // 0.985 demanded a pixel-perfect drag: a thumb that stopped just short
      // was thrown back to the start with no way in. Past the line is the
      // finish, and letting go past two-thirds counts as crossing it.
      if (progress >= 0.9) finish();
    }

    /* A tap runs the race for you. Dragging is the flourish, but making it the
       only way in meant the front door depended on pointer capture and touch
       deltas behaving identically everywhere — and when they didn't, there was
       no way onto the site at all. */
    function sprint() {
      if (done) return;
      const from = progress, start = performance.now(), ms = calm.matches ? 0 : 620;
      hint.textContent = 'Running…';
      (function step(now) {
        const k = ms ? Math.min(1, (now - start) / ms) : 1;
        setProgress(from + (1 - from) * (1 - Math.pow(1 - k, 3)));
        if (k < 1 && !done) requestAnimationFrame(step);
        else finish();
      })(start);
    }

    let moved = false;
    // Belt and braces: `click` is synthesised on tap by every browser, whatever
    // the pointer-capture and touch-delta behaviour underneath. Without this the
    // entrance can simply fail to open, which is the worst bug this page can have.
    runner.addEventListener('click', () => { if (!moved) sprint(); });
    // The runner circle is ~52px. The bar reads "RUN TO ENTER", so that's what
    // a thumb goes for — and tapping it did nothing, which is why the home
    // screen looked unreachable. The whole bar enters now.
    track.addEventListener('click', e => { if (e.target !== runner && !moved) sprint(); });
    // Anywhere on the lock screen enters — the tagline, the hint, the empty
    // space around them. Nothing about "the icons are behind this" is obvious
    // enough to justify a small target.
    $('lockbar').addEventListener('click', e => {
      if (e.target !== runner && e.target !== track && !moved) sprint();
    });
    runner.addEventListener('pointerdown', e => {
      if (done) return;
      dragging = true; moved = false; startX = e.clientX; startProgress = progress;
      try { runner.setPointerCapture(e.pointerId); } catch {}
    });
    runner.addEventListener('pointermove', e => {
      if (!dragging || done) return;
      if (Math.abs(e.clientX - startX) > 6) moved = true;
      setProgress(startProgress + (e.clientX - startX) / travel());
    });
    const release = () => {
      if (!dragging) return;
      dragging = false;
      // Barely moved? That was a tap — run it for them.
      if (!moved && !done) { sprint(); return; }
      if (!done) {
        // Let go past two-thirds and the runner carries through to the line
        // rather than being punished for stopping short.
        if (progress >= 0.66) { finish(); return; }
        // Otherwise jog back to the start.
        runner.style.transition = 'transform .35s var(--ease)';
        fill.style.transition = 'width .35s var(--ease)';
        setProgress(0);
        setTimeout(() => { runner.style.transition = ''; fill.style.transition = ''; }, 360);
      }
    };
    runner.addEventListener('pointerup', release);
    runner.addEventListener('pointercancel', release);

    runner.addEventListener('keydown', e => {
      if (done) return;
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sprint(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); setProgress(progress + 0.14); }
      else if (e.key === 'ArrowLeft')  { e.preventDefault(); setProgress(progress - 0.14); }
    });
    addEventListener('resize', render, { passive: true });
    render();
    runBoot();

    /* ================= TROLL RADIO =================
       Same playlist as the troll desktop, from the shared track file. The
       Spotify IFrame API can play, pause and load a URI — it cannot list a
       playlist or skip within one (see the desktop's notes), so the list is
       ours and "next" means loading the next URI ourselves. */
    const RADIO_TRACKS = window.TROLL_RADIO_TRACKS || [];
    const RADIO_PLAYLIST = 'spotify:playlist:0ni59E9HbWpAe8Ydnseh4O';
    const radioPanel = $('radio'), radioBtn = $('radio-btn');
    let radioCtl = null, radioReady = false, radioPlaying = false, radioUri = '';
    let radioDuration = 0, radioSeeking = false;

    const radioTime = ms => {
      const s = Math.max(0, Math.round((ms || 0) / 1000));
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    };
    const radioStatus = text => { $('radio-status').textContent = text; };

    function radioPaint() {
      const t = RADIO_TRACKS.find(x => x.uri === radioUri);
      $('radio-song').textContent = t ? t.title : (radioPlaying ? 'Now playing' : 'Troll Radio');
      $('radio-artist').textContent = t ? t.artist : 'Press play';
      $('radio-play').textContent = radioPlaying ? '❚❚' : '▶';
      $('radio-play').setAttribute('aria-label', radioPlaying ? 'Pause' : 'Play');
      radioBtn.classList.toggle('is-playing', radioPlaying);
      document.querySelectorAll('.radio-row').forEach(row => {
        row.classList.toggle('is-current', row.dataset.uri === radioUri);
      });
    }

    function radioBuildList() {
      const host = $('radio-list-inner');
      RADIO_TRACKS.forEach((t, i) => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'radio-row';
        row.dataset.uri = t.uri;
        row.setAttribute('role', 'option');
        row.innerHTML = '<span class="radio-row-num"></span><span class="radio-row-info">'
          + '<span class="radio-row-title"></span><span class="radio-row-artist"></span></span>';
        row.querySelector('.radio-row-num').textContent = String(i + 1);
        row.querySelector('.radio-row-title').textContent = t.title;
        row.querySelector('.radio-row-artist').textContent = t.artist;
        row.addEventListener('click', () => radioLoad(t.uri, true));
        host.appendChild(row);
      });
    }

    function radioLoad(uri, andPlay) {
      if (!radioCtl) return;
      radioUri = uri;
      radioCtl.loadUri(uri);
      if (andPlay) setTimeout(() => { try { radioCtl.play(); } catch {} }, 160);
      radioPaint();
    }

    function radioStep(offset) {
      if (!RADIO_TRACKS.length) return;
      const at = RADIO_TRACKS.findIndex(t => t.uri === radioUri);
      const next = (((at === -1 ? 0 : at + offset) % RADIO_TRACKS.length) + RADIO_TRACKS.length) % RADIO_TRACKS.length;
      radioLoad(RADIO_TRACKS[next].uri, true);
    }

    const radioSetOpen = open => {
      radioPanel.classList.toggle('is-open', open);
      radioPanel.setAttribute('aria-hidden', open ? 'false' : 'true');
      radioPanel.inert = !open;
      radioBtn.setAttribute('aria-expanded', String(open));
    };
    radioPanel.inert = true;
    radioBtn.addEventListener('click', () => radioSetOpen(!radioPanel.classList.contains('is-open')));
    $('radio-close').addEventListener('click', () => { radioSetOpen(false); radioBtn.focus(); });
    $('radio-list-btn').addEventListener('click', e => {
      const open = !radioPanel.classList.contains('is-browsing');
      radioPanel.classList.toggle('is-browsing', open);
      e.currentTarget.setAttribute('aria-pressed', String(open));
    });
    $('radio-play').addEventListener('click', () => {
      if (!radioReady) { radioStatus('Still loading — one sec'); return; }
      // togglePlay is the only transport the embed API actually gives us.
      radioCtl.togglePlay();
    });
    $('radio-next').addEventListener('click', () => radioStep(1));
    $('radio-prev').addEventListener('click', () => radioStep(-1));
    $('radio-seek').addEventListener('change', e => {
      if (radioCtl && radioDuration) radioCtl.seek((Number(e.target.value) / 100) * radioDuration / 1000);
    });

    $('radio-seek').addEventListener('pointerdown', () => { radioSeeking = true; });
    $('radio-seek').addEventListener('pointerup', () => { radioSeeking = false; });

    radioBuildList();
    radioStatus(RADIO_TRACKS.length ? `${RADIO_TRACKS.length} tracks — loading player…` : 'Playlist unavailable');

    window.onSpotifyIframeApiReady = (IFrameAPI) => {
      IFrameAPI.createController($('radio-host'), { uri: RADIO_PLAYLIST, width: '100%', height: '352' }, ctl => {
        radioCtl = ctl;
        radioReady = true;
        radioStatus('Ready — press play');
        ctl.addListener?.('playback_started', e => {
          if (e?.data?.playingURI) { radioUri = e.data.playingURI; radioPaint(); }
        });
        ctl.addListener?.('playback_update', e => {
          const d = e?.data;
          if (!d) return;
          if (d.playingURI && d.playingURI !== radioUri) { radioUri = d.playingURI; }
          if (typeof d.isPaused === 'boolean') radioPlaying = !d.isPaused;
          if (typeof d.duration === 'number' && d.duration > 0) {
            radioDuration = d.duration;
            $('radio-dur').textContent = radioTime(d.duration);
            $('radio-cur').textContent = radioTime(d.position);
            if (!radioSeeking) $('radio-seek').value = (d.position / d.duration) * 100;
          }
          radioPaint();
          radioStatus(radioPlaying ? 'Trolling to the beat' : 'Paused');
        });
        radioPaint();
      });
    };

    /* ================= STARFIELD =================
       Canvas rather than hundreds of DOM nodes; static single paint when the
       viewer has asked for reduced motion. */
    const canvas = $('stars'), ctx = canvas.getContext('2d');
    let stars = [], raf = 0;
    function seed() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.round((innerWidth * innerHeight) / 9000);
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * innerWidth, y: Math.random() * innerHeight,
        r: Math.random() * 1.25 + 0.25, a: Math.random() * 0.5 + 0.25,
        tw: Math.random() * 0.02 + 0.004, p: Math.random() * Math.PI * 2,
      }));
    }
    function draw(t) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const s of stars) {
        const alpha = calm.matches ? s.a : s.a + Math.sin(t * s.tw + s.p) * 0.22;
        ctx.globalAlpha = Math.max(0.05, Math.min(1, alpha));
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    function loop(t) { draw(t); raf = requestAnimationFrame(loop); }
    function startStars() {
      cancelAnimationFrame(raf); seed();
      if (calm.matches) draw(0); else raf = requestAnimationFrame(loop);
    }
    addEventListener('resize', startStars, { passive: true });
    calm.addEventListener?.('change', startStars);
    startStars();

    /* Autoplay, insistently. iOS only honours it when the element is muted AND
       inline at the moment play is attempted, and it can still refuse on a cold
       load, which is what leaves a poster sitting there looking like it wants a
       play button. So set the flags in JS too and retry on the events that fire
       once the tab is actually visible and the media is ready. */
    const wp = $('wp');
    if (wp) {
      wp.muted = true;
      wp.defaultMuted = true;
      wp.playsInline = true;
      wp.setAttribute('playsinline', '');
      wp.setAttribute('webkit-playsinline', '');
      const kick = () => { const r = wp.play?.(); if (r?.catch) r.catch(() => {}); };
      kick();
      for (const ev of ['loadeddata', 'canplay', 'canplaythrough']) wp.addEventListener(ev, kick);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) kick(); });
      // Last resort: the first touch anywhere counts as the gesture some
      // browsers hold out for.
      ['pointerdown', 'touchstart'].forEach(ev =>
        document.addEventListener(ev, kick, { once: true, passive: true }));
    }
  })();
  </script>

  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
