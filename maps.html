<title>Maps — Troll Runner</title>
<meta name="description" content="The troll world map — a 3D globe where every logged-in troll drops a pin for the city they're from.">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --void: #05070c;
  --surface: #0e1219;
  --raised: #161c26;
  --line: #232b38;
  --foreground: #e8ecf4;
  --muted: #8b94a8;
  --brand: #30d158;
  --pin: #ff2d55;
  --mine: #ffb020;
  color-scheme: dark;
}

html, body { height: 100%; }

body {
  background: var(--void);
  color: var(--foreground);
  font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
}

#map { position: fixed; inset: 0; opacity: 1; transform: scale(1); }

/* ── Observatory arrival ──────────────────────────────────────────────── */
/* Reveal that mirrors world.html's telescope zoom-in (#scope-transition) —
   played when arriving via ?enter=scope from the Maps landmark on the
   island. Pure CSS/JS placeholder; swap the eyepiece art later without
   touching the timing in the script block near the bottom of this file.
   is-arriving snaps to the dim/scaled starting state with no transition
   (so there's no flash of the transition playing before JS is ready);
   is-revealing swaps in the transition and the resting values in the same
   frame, so removing is-arriving next tick animates the reveal. */
#map.is-arriving { opacity: .45; transform: scale(1.08); transition: none; }
#map.is-revealing { transition: opacity .75s ease, transform .75s cubic-bezier(.2,.8,.2,1); }
#scope-arrival { display: none; position: fixed; inset: 0; z-index: 99999; pointer-events: none; }
#scope-arrival.is-showing { display: block; }
/* The "hole" is a 1px transparent dot whose box-shadow paints solid black
   everywhere else on screen (same box-shadow-as-vignette trick world.html's
   #scope-transition uses, just inverted: there the circle IS the visible
   content; here the circle is the see-through gap). Scaling that dot up
   grows the transparent gap and the black recedes with it — a plain
   `transform: scale()` transition, not clip-path/mask, so there's no
   gradient-interpolation edge cases to fight. */
.scope-arrival-hole {
  position: absolute; left: 50%; top: 50%; width: 1px; height: 1px; border-radius: 50%;
  background: transparent; box-shadow: 0 0 0 9999px #000;
  transform: translate(-50%,-50%) scale(1);
}
#scope-arrival.is-open .scope-arrival-hole {
  transform: translate(-50%,-50%) scale(3000);
  transition: transform .75s cubic-bezier(.2,.8,.2,1);
}
#scope-arrival.is-done { opacity: 0; transition: opacity .2s ease; }
.scope-arrival-reticle {
  position: absolute; inset: 0; opacity: 1; transition: opacity .3s ease;
}
#scope-arrival.is-open .scope-arrival-reticle { opacity: 0; }
.scope-arrival-reticle::before, .scope-arrival-reticle::after { content: ''; position: absolute; background: rgba(255,255,255,.45); }
.scope-arrival-reticle::before { left: 50%; top: 42%; bottom: 42%; width: 1px; transform: translateX(-50%); }
.scope-arrival-reticle::after { top: 50%; left: 42%; right: 42%; height: 1px; transform: translateY(-50%); }
@media (prefers-reduced-motion: reduce) {
  #map.is-arriving { opacity: 1; transform: none; transition: none; }
  #scope-arrival { display: none !important; }
}

/* ── MapLibre chrome, dragged into this theme ─────────────────────────── */
.maplibregl-ctrl-attrib, .maplibregl-ctrl-attrib a {
  background: rgba(10,14,20,0.75) !important;
  color: rgba(200,211,228,0.75) !important;
  font-size: 10px;
}
.maplibregl-ctrl-group {
  background: rgba(14,18,25,0.86) !important;
  border: 1px solid var(--line) !important;
  border-radius: 12px !important;
  overflow: hidden;
}
.maplibregl-ctrl-group button + button { border-top: 1px solid var(--line) !important; }
.maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1) brightness(1.6); }
.maplibregl-ctrl-bottom-right .maplibregl-ctrl-group { margin-bottom: 62px; }

/* ── Pins ──────────────────────────────────────────────────────────────── */
.pin {
  position: relative;
  width: 26px; height: 34px;
  cursor: pointer;
  transform-origin: 50% 100%;
  transition: transform 160ms cubic-bezier(.2,.8,.3,1);
}
.pin svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 3px 5px rgba(0,0,0,.55)); }
.pin:hover, .pin:focus-visible { transform: scale(1.22) translateY(-2px); z-index: 30; outline: none; }
.pin--mine { z-index: 20; }
.pin--mine::after {
  content: ""; position: absolute; left: 50%; bottom: -3px;
  width: 30px; height: 30px; margin-left: -15px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,176,32,.42), transparent 68%);
  animation: pin-pulse 2.6s ease-out infinite; pointer-events: none;
}
@keyframes pin-pulse { 0% { transform: scale(.55); opacity: .95; } 70%, 100% { transform: scale(1.5); opacity: 0; } }
.pin-card {
  position: absolute; bottom: calc(100% + 8px); left: 50%;
  transform: translateX(-50%) translateY(4px);
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 12px;
  background: rgba(14,18,25,.97); border: 1px solid var(--line);
  box-shadow: 0 12px 28px rgba(0,0,0,.6);
  white-space: nowrap; opacity: 0; visibility: hidden;
  transition: opacity 140ms ease, transform 140ms ease; pointer-events: none;
}
.pin:hover .pin-card, .pin:focus-visible .pin-card { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
.pin-card__avatar {
  width: 26px; height: 26px; border-radius: 50%; object-fit: cover;
  background: var(--raised); display: grid; place-items: center; font-size: 14px; flex: none;
}
.pin-card__name { font-size: 13px; font-weight: 600; line-height: 1.25; }
.pin-card__place { font-size: 11px; color: var(--muted); line-height: 1.25; }

/* ── Chrome ────────────────────────────────────────────────────────────── */
.panel {
  background: rgba(14,18,25,.86);
  backdrop-filter: blur(18px) saturate(150%);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 18px 44px rgba(0,0,0,.5);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 999px; padding: 10px 18px; font: inherit; font-size: 14px; font-weight: 600;
  border: 1px solid transparent; cursor: pointer;
  transition: filter 140ms ease, background-color 140ms ease, opacity 140ms ease;
}
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn--primary { background: var(--brand); color: #04210d; }
.btn--primary:not(:disabled):hover { filter: brightness(1.08); }
#drop-pin-btn { width: 40px; height: 40px; padding: 0; font-size: 17px; }
.btn--ghost { background: rgba(255,255,255,.05); border-color: var(--line); color: var(--foreground); }
.btn--ghost:not(:disabled):hover { background: rgba(255,255,255,.1); }
.btn--danger { background: rgba(255,45,85,.14); border-color: rgba(255,45,85,.4); color: #ff8098; }
.field {
  width: 100%; background: rgba(255,255,255,.04); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 14px; font: inherit; font-size: 14px; color: var(--foreground); outline: none;
}
.field::placeholder { color: var(--muted); }
.field:focus { border-color: rgba(48,209,88,.55); box-shadow: 0 0 0 3px rgba(48,209,88,.14); }
*:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.scroll-thin { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
a { color: inherit; }

.hud { position: fixed; z-index: 20; pointer-events: none; }
.hud > * { pointer-events: auto; }
.top-right { top: 16px; right: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.top-left { top: 16px; left: 16px; }
.back-island {
  display: inline-flex; width: 36px; height: 36px; border-radius: 10px;
  align-items: center; justify-content: center; font-size: 16px;
  text-decoration: none; background: rgba(255,255,255,0.05);
  border: 1px solid var(--line); color: var(--foreground);
  transition: background 0.15s ease, border-color 0.15s ease;
}
.back-island:hover, .back-island:focus-visible { background: rgba(255,255,255,0.1); }
.search-wrap { top: 16px; left: 50%; transform: translateX(-50%); width: min(28rem, calc(100vw - 2rem)); }
.search-input {
  width: 100%; border-radius: 999px; border: 1px solid var(--line);
  background: rgba(14,18,25,.7); padding: 10px 20px; font: inherit; font-size: 14px;
  color: var(--foreground); outline: none; text-align: center; backdrop-filter: blur(18px);
}
.search-input::placeholder { color: var(--muted); }
.search-input:focus { border-color: rgba(48,209,88,.5); }
.search-results { margin-top: 8px; max-height: 16rem; overflow-y: auto; padding: 4px; }
.search-results li button {
  width: 100%; text-align: left; background: none; border: none; border-radius: 12px;
  padding: 8px 12px; cursor: pointer; color: inherit; font: inherit;
}
.search-results li button:hover { background: rgba(255,255,255,.1); }
.result-label { display: block; font-size: 14px; font-weight: 500; }
.result-detail { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-banner { top: 64px; left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 14px; font-weight: 500; }
.right-rail { top: 50%; right: 16px; transform: translateY(-50%); display: none; flex-direction: column; gap: 8px; }
@media (min-width: 640px) { .right-rail { display: flex; } }

/* Below 640px the back button, search bar, and profile/pin controls all
   collide at top:16px since search-wrap is nearly full-viewport width and
   centered over them. Drop the search bar to its own row underneath. */
@media (max-width: 639px) {
  .search-wrap { top: 64px; left: 16px; right: 16px; width: auto; transform: none; }
  .pick-banner { top: 112px; }
  .top-right { max-width: calc(100vw - 68px); }
  .top-right #session-btn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
}
.rail-btn { display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-size: 14px; font-weight: 500; background: none; border: none; cursor: pointer; color: inherit; border-radius: 16px; }
.stats {
  bottom: 16px; left: 16px; padding: 12px 16px; position: fixed; overflow: hidden;
  width: 220px; min-height: 96px; display: flex; align-items: flex-end;
}
.stats-bg {
  position: absolute; inset: 0; z-index: 0;
  background-size: cover; background-position: center; background-repeat: no-repeat;
  opacity: 0;
  transition: opacity 900ms ease;
}
.stats-bg::after { content: ""; position: absolute; inset: 0; background: rgba(10,13,19,.82); }
.stats-bg.is-active { opacity: 1; }
.stats-content { position: relative; z-index: 1; }
.stats .count { font-family: 'DM Mono', ui-monospace, monospace; font-size: 18px; font-weight: 600; line-height: 1; }
.stats .label { margin-top: 4px; font-size: 12px; color: var(--muted); }
.stats .load-error { margin-top: 4px; font-size: 12px; color: #ff8098; }
.proj-toggle { bottom: 16px; right: 16px; display: flex; overflow: hidden; border-radius: 999px; padding: 4px; }
.proj-toggle button {
  border: none; background: none; cursor: pointer; color: var(--muted);
  border-radius: 999px; padding: 6px 16px; font: inherit; font-size: 14px; font-weight: 600;
}
.proj-toggle button[aria-pressed="true"] { background: #fff; color: #000; }

.side-panel {
  position: fixed; z-index: 30; left: 16px; top: 16px;
  max-height: calc(100dvh - 32px); width: min(23rem, calc(100vw - 2rem));
  overflow-y: auto; padding: 20px; display: none;
}
.side-panel.open { display: block; }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.panel-head h2 { font-size: 18px; font-weight: 600; }
.panel-head p { margin-top: 4px; font-size: 13px; color: var(--muted); }
.field-label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
.stack > * + * { margin-top: 16px; }
.stack-sm > * + * { margin-top: 8px; }
.visible-row {
  display: flex; align-items: flex-start; gap: 12px; border-radius: 12px;
  border: 1px solid var(--line); background: rgba(255,255,255,.05); padding: 12px;
}
.visible-row input { margin-top: 2px; width: 16px; height: 16px; accent-color: #30d158; }
.visible-row .title { display: block; font-size: 14px; font-weight: 500; }
.visible-row .sub { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
.error-text { font-size: 14px; color: #ff8098; }
.notice-text { font-size: 14px; color: #30d158; background: rgba(48,209,88,.12); border: 1px solid rgba(48,209,88,.35); border-radius: 12px; padding: 10px 12px; }
.x-signin-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #2a2a2e; background: #000; color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.x-signin-btn:hover { background: #1a1a1a; }
.x-signin-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.auth-or-sep { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.auth-or-sep::before, .auth-or-sep::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.row-btns { display: flex; gap: 8px; }
.row-btns .btn { flex: 1; }
.saved-pin { border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.05); padding: 12px; }
.saved-pin .name { font-size: 14px; font-weight: 600; }
.saved-pin .country { margin-top: 2px; font-size: 12px; color: var(--muted); }
.mode-tabs { display: flex; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.05); padding: 4px; }
.mode-tabs button { flex: 1; border: none; background: none; cursor: pointer; border-radius: 999px; padding: 6px 0; font: inherit; font-size: 14px; font-weight: 500; color: var(--muted); }
.mode-tabs button.active { background: var(--raised); color: var(--foreground); }
.top-row { display: flex; align-items: center; gap: 12px; width: 100%; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.05); padding: 8px 12px; text-align: left; }
.top-row:hover { background: rgba(255,255,255,.1); }
.top-row .rank { width: 20px; flex: none; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }
.top-row .info { min-width: 0; flex: 1; }
.top-row .name { display: block; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-row .country { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-row .count { flex: none; border-radius: 999px; background: rgba(48,209,88,.15); padding: 2px 8px; font-size: 12px; font-weight: 600; color: var(--brand); }
</style>
</head>
<body>

<div id="map"></div>

<!-- ============ OBSERVATORY ARRIVAL ============
     Reveal played when arriving via ?enter=scope from the Maps landmark's
     telescope zoom-in on world.html (see #scope-transition there). -->
<div id="scope-arrival" aria-hidden="true"><div class="scope-arrival-hole"></div><div class="scope-arrival-reticle"></div></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get('enter') !== 'scope') return;
  // Strip the marker so a refresh (or sharing the URL) doesn't replay it.
  params.delete('enter');
  const clean = location.pathname + (params.toString() ? '?' + params.toString() : '') + location.hash;
  history.replaceState(null, '', clean);
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  // Read by troll-map.js's own <script src>, further down the page, before
  // it constructs the map — that's the signal to start the globe zoomed
  // way out (see ARRIVAL_START_ZOOM there) instead of already at rest, and
  // to hold off auto-spin until playArrival() below tells it the reveal
  // has started. Set only on the motion-allowed path above, so a reduced-
  // motion visitor's map just inits normally at its resting zoom.
  window.__trollMapArrival = true;

  const mapEl = document.getElementById('map');
  const overlay = document.getElementById('scope-arrival');
  mapEl.classList.add('is-arriving');
  overlay.classList.add('is-showing');

  // Waiting for window 'load' (not just running inline here) matters: this
  // script runs the instant the parser reaches it, well before the
  // render-blocking Supabase/MapLibre <script src> tags further down have
  // even fetched — starting the reveal here would let the whole animation
  // play out (and the overlay remove itself) while those are still loading,
  // so a real visitor's first paint of the page would land on an already-
  // finished reveal instead of watching it happen.
  const startReveal = () => {
    // Two rAFs: the first lets the browser paint the dim/scaled starting
    // state (set with transition:none), the second then flips the classes
    // that add the transition and the resting values — otherwise the two
    // class changes would land in the same frame and just jump to the end
    // state with no visible animation.
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        overlay.classList.add('is-open');
        mapEl.classList.remove('is-arriving');
        mapEl.classList.add('is-revealing');
        // Longer than the .75s iris-open on purpose: the curtain finishes
        // opening while the globe is still visibly closing in, so the
        // camera's own arrival reads as the point of the reveal instead of
        // the globe just sitting there already at rest behind the iris.
        window.TrollMap?.playArrival(1400);
        setTimeout(() => overlay.classList.add('is-done'), 800);
        setTimeout(() => overlay.remove(), 1200);
      });
    });
  };
  if (document.readyState === 'complete') startReveal();
  else window.addEventListener('load', startReveal, { once: true });
})();
</script>

<div class="hud search-wrap">
  <input id="global-search" class="search-input" placeholder="Search Location" autocomplete="off" aria-label="Search for a place on the map">
  <ul id="global-search-results" class="panel search-results scroll-thin" style="display:none;"></ul>
</div>

<div id="pick-banner" class="hud panel pick-banner" style="display:none;">Click anywhere on the map to drop your pin there</div>

<div class="hud top-left">
  <a href="https://trollrunner.net/" id="back-island" class="panel back-island" aria-label="Back to trollrunner.net" title="Back to trollrunner.net">&larr;</a>
</div>

<div class="hud top-right">
  <div id="presence-mount"></div>
  <button type="button" id="session-btn" class="btn btn--ghost" style="display:none;padding:8px 14px;font-size:12px;"></button>
  <button type="button" id="drop-pin-btn" class="btn btn--primary" aria-label="Drop my pin">
    <span id="drop-pin-label" aria-hidden="true">📍</span>
  </button>
</div>

<div class="hud right-rail">
  <button type="button" id="top-cities-btn" class="panel rail-btn">🏆 Top Cities</button>
</div>

<div class="hud panel stats" id="stats-pill">
  <div class="stats-bg stats-bg--a"></div>
  <div class="stats-bg stats-bg--b"></div>
  <div class="stats-content">
    <p class="count" id="pin-count">0</p>
    <p class="label" id="pin-count-label">trolls on the map</p>
    <p class="load-error" id="load-error" style="display:none;"></p>
  </div>
</div>

<div class="hud panel proj-toggle" role="group" aria-label="Map projection">
  <button type="button" data-mode="2d" aria-pressed="false">2D</button>
  <button type="button" data-mode="3d" aria-pressed="true">3D</button>
</div>

<aside id="side-panel" class="side-panel panel scroll-thin"></aside>
