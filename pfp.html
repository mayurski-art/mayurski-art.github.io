<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://mayurski-art.github.io https://trollrunner.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://tjsyhfplxjtakdfkpdtg.supabase.co wss://tjsyhfplxjtakdfkpdtg.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PFP Studio — Troll Runner</title>
  <meta name="description" content="Build your own troll profile picture from Swish's trait set — background, base, outfit, headwear and accessories.">
  <!-- Matches world.html's standalone-mode meta exactly. Without these, iOS
       treats the hop from the home-screen app into this page as leaving the
       installed app and drops the visitor into a chromed Safari view (URL
       bar, Done button) instead of continuing the app-like navigation —
       that's the "browser popping up" flash between the two pages. -->
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TROLLRUNNER">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/images/icons/app/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Opts into the native cross-document view transition when arriving
       from/leaving to world.html — that page enables the matching rule
       unconditionally now that PFP Studio is a real navigation instead of
       an in-page sheet. Both documents need this rule for the crossfade to
       fire; unsupported browsers just navigate instantly. */
    @view-transition { navigation: auto; }

    :root {
      --pf-bg: #1c1c1e;
      --pf-panel: #f5f5f7;
      --pf-panel-2: #f2efe9;
      --pf-ink: #1c1c1e;
      --pf-muted: #6e6e73;
      --pf-line: rgba(0, 0, 0, 0.14);
      --pf-line-dark: rgba(255, 255, 255, 0.16);
      --pf-accent: #5856d6;
      --pf-green: #34c759;
      --pf-orange: #ff9500;
      --pf-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --pf-mono: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--pf-sans);
      color: #f5f5f7;
      background: #000000;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--pf-orange); outline-offset: 2px; }

    /* Same starfield as trollrunner.net's home page, behind the studio
       card so it reads as a panel over the main site. */
    .space { position: fixed; inset: 0; z-index: 0; background: #000; pointer-events: none; }
    .space canvas { display: block; width: 100%; height: 100%; }
    .wrap { position: relative; z-index: 1; max-width: min(97vw, 1760px); margin: 0 auto; padding: 16px 16px 28px; }

    /* Above the phone breakpoint the studio card is shorter than a
       maximized desktop window, so center it instead of pinning it to the
       top and leaving a dead void underneath. */
    @media (min-width: 861px) {
      body { display: flex; }
      .wrap { width: 100%; max-width: min(90vw, 1600px); margin: auto; }
    }

    /* ---------- header ---------- */
    .top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
    .brand p { margin: 2px 0 0; font-size: 13px; color: #9b9ba1; }
    /* Closes whatever trait drawer is open and returns to the plain room
       view, same as landing here fresh. Deliberately stays inside the
       studio rather than leaving the page: an off-site link here
       re-triggers the phone entrance's own boot/lock sequence, which reads
       as a broken reload rather than "going back". */
    button.btn-home {
      width: 36px; height: 36px; flex: none;
      display: flex; align-items: center; justify-content: center;
      border: 0.5px solid var(--pf-line-dark); border-radius: 10px;
      background: rgba(255, 255, 255, 0.05); color: #d9d9e0;
      font-size: 16px; line-height: 1;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    button.btn-home:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--pf-line-dark); }

    /* ---------- layout ---------- */
    .studio { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 18px; align-items: start; }

    /* ---------- stage ---------- */
    .stage {
      background: rgba(255, 255, 255, 0.05);
      border: 0.5px solid var(--pf-line-dark);
      border-radius: 18px; padding: 12px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.34);
      position: sticky; top: 16px;
    }
    .canvas-wrap {
      position: relative; width: 100%; aspect-ratio: 1 / 1;
      border-radius: 14px; overflow: hidden;
      border: 0.5px solid var(--pf-line-dark);
      /* checkerboard shows through when no background trait is picked */
      background-color: #e8e8ea;
      background-image:
        linear-gradient(45deg, #d3d3d8 25%, transparent 25%, transparent 75%, #d3d3d8 75%),
        linear-gradient(45deg, #d3d3d8 25%, transparent 25%, transparent 75%, #d3d3d8 75%);
      background-size: 22px 22px;
      background-position: 0 0, 11px 11px;
    }
    .canvas-wrap img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; display: none;
    }
    .canvas-wrap img.is-on { display: block; }

    /* The trait list grows to five names, so it wraps on its own line rather
       than colliding with the counter pinned on the right. */
    .stage-meta {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 14px; margin: 13px 2px 0; font-family: var(--pf-mono); font-size: 11.5px;
      color: #9b9ba1; line-height: 1.45;
    }
    .stage-meta #summary { min-width: 0; flex: 1; overflow-wrap: anywhere; }
    .stage-meta .meta-count { flex: none; white-space: nowrap; }
    .stage-meta b { color: #f5f5f7; font-weight: 500; }

    /* One icon-only toolbar row instead of a tall stack of labeled buttons
       — the labels were most of the vertical space this card spent on
       chrome instead of on the actual preview image. Tooltips (title/
       aria-label, already on every button) carry the meaning instead. */
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
    .btn {
      flex: 1 1 0; min-width: 40px;
      border: 0.5px solid var(--pf-line-dark); border-radius: 11px;
      background: rgba(255, 255, 255, 0.08); color: #f5f5f7;
      padding: 11px; font-size: 13.5px; font-weight: 500;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.14); }
    .btn:active { transform: translateY(1px); }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--pf-accent); border-color: transparent; }
    .btn-primary:hover { background: #6a68e0; }
    .btn-save { background: var(--pf-green); border-color: transparent; color: #06210f; }
    .btn-save:hover { background: #45d76a; }
    .btn-label { display: none; }

    .note {
      margin: 11px 2px 0; font-size: 12.5px; line-height: 1.45; color: #9b9ba1; min-height: 1.2em;
    }
    .note.is-ok { color: #6ee08a; }
    .note.is-err { color: #ff8f9a; }

    /* ---------- picker ---------- */
    .picker {
      background: var(--pf-panel); color: var(--pf-ink);
      border: 0.5px solid var(--pf-line); border-radius: 18px;
      overflow: hidden; box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
    }

    /* ---------- room hotspot picker ---------- */
    .room {
      position: relative; width: 100%; aspect-ratio: 2047 / 1180;
      overflow: hidden; background: #0a0a10;
    }
    .room-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .room-bg.room-bg-alt { opacity: 0; transition: opacity 0.35s ease; }
    .room-bg.room-bg-alt.is-visible { opacity: 1; }
    .hotspot {
      position: absolute; border: none; background: transparent;
      border-radius: 10px; padding: 0;
    }
    .hotspot.is-set::after {
      content: ''; position: absolute; top: 7px; right: 7px; width: 9px; height: 9px;
      border-radius: 50%; background: var(--pf-green); box-shadow: 0 0 0 2px rgba(10, 10, 16, 0.8);
    }
    .hotspot-label {
      position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -7px);
      background: rgba(18, 14, 10, 0.92); color: #fff; font-family: var(--pf-mono);
      font-size: 11px; padding: 4px 9px; border-radius: 7px; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.15s ease;
    }
    .hotspot:hover .hotspot-label, .hotspot:focus-visible .hotspot-label { opacity: 1; }

    .room-panel[hidden] { display: none; }
    .room-panel-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 13px 14px 0;
    }
    .room-panel-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
    .room-panel-close {
      border: none; background: transparent; color: var(--pf-muted);
      font-size: 15px; line-height: 1; padding: 6px 9px; border-radius: 8px;
    }
    .room-panel-close:hover { background: rgba(0, 0, 0, 0.06); color: var(--pf-ink); }

    /* The whole drawer sits on the room photo for that layer instead of a
       small cropped strip — background-size stays "contain" so the full
       shot is visible (nothing sliced off), except "base" which is allowed
       to crop via .is-cover. Individual trait cards keep their own solid
       white background (.cell), so items stay readable over a busy photo;
       only the canvas around them changes. */
    .room-panel-body {
      display: flex; min-height: 0; position: relative;
      background-color: #0a0a10; background-repeat: no-repeat; background-position: center;
      background-size: contain;
    }
    .room-panel-body.is-cover { background-size: cover; }
    .room-panel-main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }

    .picker-bar {
      display: flex; gap: 9px; padding: 12px 14px; align-items: center; border-bottom: 0.5px solid var(--pf-line);
      background: rgba(245, 245, 247, 0.86);
      backdrop-filter: blur(10px) saturate(160%); -webkit-backdrop-filter: blur(10px) saturate(160%);
    }
    .search {
      flex: 1; min-width: 0; border: 0.5px solid var(--pf-line); border-radius: 10px;
      padding: 9px 12px; background: #fff; color: var(--pf-ink); font-size: 13.5px;
    }
    .search::placeholder { color: #a1a1a8; }
    .count { font-family: var(--pf-mono); font-size: 11.5px; color: var(--pf-muted); white-space: nowrap; }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 8px; padding: 12px; max-height: 62vh; overflow: auto;
      scrollbar-width: thin; scrollbar-color: rgba(0, 0, 0, 0.22) transparent;
    }
    .grid::-webkit-scrollbar { width: 7px; }
    .grid::-webkit-scrollbar-track { background: transparent; }
    .grid::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.18); border-radius: 999px; }
    .grid::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.3); }
    .cell {
      border: 0.5px solid var(--pf-line); border-radius: 12px;
      background: #fff; padding: 7px; text-align: center;
      display: flex; flex-direction: column; gap: 6px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
    }
    .cell:hover { border-color: #b9b9c2; transform: translateY(-1px); }
    .cell[aria-pressed="true"] {
      border-color: var(--pf-accent); box-shadow: 0 0 0 2px rgba(88, 86, 214, 0.28);
    }
    .cell .thumb {
      width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; object-fit: contain;
      background:
        linear-gradient(45deg, #ececf0 25%, transparent 25%, transparent 75%, #ececf0 75%),
        linear-gradient(45deg, #ececf0 25%, transparent 25%, transparent 75%, #ececf0 75%),
        #f7f7f9;
      background-size: 14px 14px; background-position: 0 0, 7px 7px;
    }
    @media (min-width: 861px) {
      .cell { opacity: 0.5; transition: opacity 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease; }
      .cell:hover, .cell[aria-pressed="true"] { opacity: 1; }
    }
    .cell .label {
      font-size: 11.5px; line-height: 1.25; color: var(--pf-ink);
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.4em;
    }
    .cell[aria-pressed="true"] .label { font-weight: 700; }
    .cell .badge-solo {
      font-family: var(--pf-mono); font-size: 9.5px; color: #fff;
      background: var(--pf-accent); border-radius: 999px; padding: 2px 7px;
      align-self: center;
    }
    .locked {
      grid-column: 1 / -1; padding: 26px 18px; text-align: center;
      background: rgba(255, 255, 255, 0.9); border-radius: 12px;
    }
    .locked p { margin: 0 0 14px; color: var(--pf-muted); font-size: 13.5px; line-height: 1.5; }
    .btn-swap {
      border: 0.5px solid var(--pf-line); border-radius: 10px; background: #fff;
      color: var(--pf-ink); padding: 9px 15px; font-size: 13px; font-weight: 500;
    }
    .btn-swap:hover { border-color: var(--pf-accent); color: var(--pf-accent); }
    .cell-none .thumb {
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #b9b9c2;
    }
    .empty {
      padding: 30px 14px; text-align: center; color: var(--pf-muted); font-size: 13.5px;
      background: rgba(255, 255, 255, 0.9); border-radius: 12px; margin: 12px;
    }

    /* checkbox-ish toggle row under the grid */
    .picker-foot {
      padding: 11px 14px; border-top: 0.5px solid var(--pf-line);
      font-size: 12px; color: var(--pf-muted); background: var(--pf-panel-2);
    }

    @media (max-width: 860px) {
      .studio { grid-template-columns: 1fr; }
      .stage { position: static; max-width: 460px; margin: 0 auto; width: 100%; }
      .grid {
        max-height: none;
        grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
        gap: 8px; padding: 10px;
      }
    }

    /* ---------- mobile app-shell: no page scroll ----------
       Below 860px the four sections (preview, actions, room, drawer) used
       to just stack and the whole document scrolled. Instead the page is
       pinned to the viewport and only the trait grid inside the open
       drawer scrolls — everything else is sized to fit. The room image
       keeps its real aspect ratio (stretching it to fill the leftover flex
       height read as a badly cropped, too-tall photo and drifted the
       hotspots off their landmarks) and just sits at whatever height that
       ratio works out to, right below the header — any leftover space
       below it is inert until a drawer opens and takes it over. */
    @media (max-width: 860px) {
      html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
      body { display: flex; flex-direction: column; }
      .space { display: none; }
      .wrap {
        flex: 1; min-height: 0; width: 100%; margin: 0; max-width: none;
        display: flex; flex-direction: column;
        padding: 10px 10px calc(8px + env(safe-area-inset-bottom));
        overflow: hidden;
      }
      .top { flex: 0 0 auto; margin-bottom: 8px; }
      .brand h1 { font-size: 16px; }

      .studio { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: stretch; gap: 8px; }

      /* Top-down layout: the preview card grows to soak up whatever
         vertical space the room photo's fixed aspect ratio can't use
         (it used to sit as a tiny compact strip, leaving a dead gap below
         the room instead), then shrinks back out of the way once a trait
         drawer opens and the room needs the room back. See the
         .studio:has(.picker.drawer-open) override below. */
      .stage {
        flex: 1 1 auto; min-height: 0; max-width: none; margin: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 8px; padding: 10px;
        container-type: size; container-name: pfp-stage;
      }
      .studio:has(.picker.drawer-open) .stage { flex: 0 0 auto; }
      /* Square avatar, so it can grow by height as freely as by width —
         min() picks whichever of the two is tighter, same idea as
         object-fit: contain but sizing the box itself. */
      .canvas-wrap {
        flex: 0 0 auto; width: min(92%, calc(100cqh - 90px), 360px);
      }
      .stage-meta { display: none; }
      .actions {
        flex: 0 0 auto; width: 100%; display: flex; gap: 6px;
        margin-top: 0; overflow-x: auto; -webkit-overflow-scrolling: touch;
        scrollbar-width: none; padding-bottom: 2px;
      }
      .actions::-webkit-scrollbar { display: none; }
      .btn {
        flex: 1 1 0; padding: 9px 8px; white-space: nowrap;
      }
      .note {
        flex: 0 0 auto; width: 100%; margin: 0; min-height: 0; text-align: center;
      }
      .note:empty { display: none; }

      .picker { flex: 0 0 auto; min-height: 0; display: flex; flex-direction: column; }
      .picker.drawer-open { flex: 1 1 auto; }
      .room {
        flex: 0 0 auto; width: 100%; aspect-ratio: 2047 / 1180;
      }
      /* Hotspots are otherwise invisible rectangles — fine on desktop where
         a mouse hover reveals the label, useless on touch where nothing
         ever hovers. Pull the label out from under `:hover` so the tap
         targets are legible on first glance instead of only the "already
         set" dot floating with no explanation of what it's sitting on. */
      .hotspot-label {
        position: absolute; left: 6px; top: 6px; bottom: auto;
        transform: none; opacity: 1; font-size: 10px; padding: 3px 7px;
      }
      /* Label sits top-left; move the is-set dot to the opposite corner
         (bottom-right) so it never lands on top of the label text — some
         hotspots (accessory) are narrow enough that top-right collided. */
      .hotspot.is-set::after { top: auto; bottom: 7px; right: 7px; }
      .room-panel {
        flex: 0 0 auto; display: flex; flex-direction: column; min-height: 0;
        height: clamp(240px, 44dvh, 420px);
      }
      /* A drawer covers the room anyway once it's open, so the sliver of
         room art left above it (see JS: .picker gets .drawer-open) is dead
         weight — collapse it and let the drawer take the whole picker. */
      .picker.drawer-open .room { flex: 0 0 0; min-height: 0; }
      .picker.drawer-open .room-panel {
        flex: 1; height: auto;
      }
      .room-panel-head { flex: 0 0 auto; padding: 10px 12px 0; }
      .room-panel-body { flex: 1; min-height: 0; }
      .picker-bar { flex: 0 0 auto; padding: 9px 12px; }
      .grid {
        flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        gap: 8px; padding: 10px;
      }
      .picker-foot { display: none; }
    }

    /* Between ~600-860px (the desktop-sheet embed in world.html, which is
       up to 760px wide) there's enough room for the avatar/button column
       and the room to sit side by side instead of stacking into that
       compact header + full-width room arrangement above — same idea as
       the desktop grid, just narrower, and still inside the same dark
       app-shell theme as the rest of this breakpoint. */
    @media (min-width: 601px) and (max-width: 860px) {
      .studio { flex-direction: row; }
      .stage {
        flex: 0 0 230px; width: 230px; max-width: none;
        flex-direction: column; align-items: stretch; flex-wrap: nowrap;
        justify-content: center;
      }
      .canvas-wrap { width: 100%; }
      .actions { flex: 0 0 auto; flex-wrap: wrap; overflow-x: visible; }
      .btn { flex: 1 1 40%; }
      .picker { flex: 1; min-width: 0; }
    }
    /* Narrowest windows (the desktop-icon modal can go down to 300px) need
       tighter columns still — kept last so it always wins over the two
       broader mobile blocks above at these widths. */
    @media (max-width: 420px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); }
    }

    /* ---------- mobile: trollface.io/city font + color scheme ----------
       Scoped to the phone breakpoint only — desktop keeps the Apple/DM Sans
       look. Matches TROLLWORLD's palette: pure black chrome, mint-green
       accent, Space Grotesk body copy, Archivo Black display type, Rubik
       mono labels, translucent glass panels. */
    @media (max-width: 860px) {
      :root {
        --pf-bg: #000000;
        --pf-panel: #0a0a0b;
        --pf-panel-2: #000000;
        --pf-ink: #ffffffeb;
        --pf-muted: #ffffff8c;
        --pf-line: rgba(255, 255, 255, 0.14);
        --pf-line-dark: rgba(255, 255, 255, 0.14);
        --pf-accent: #8fe36a;
        --pf-sans: 'Space Grotesk', system-ui, Arial, sans-serif;
        --pf-mono: 'Rubik', system-ui, Arial, sans-serif;
      }
      body { background: #000; }
      .brand h1 {
        font-family: 'Archivo Black', 'Impact', 'Arial Black', sans-serif;
        font-weight: 400; text-transform: uppercase; letter-spacing: 0.02em;
      }
      .brand p, .stage-meta, .note, .count, .picker-foot { color: var(--pf-muted); }
      .stage {
        background: linear-gradient(165deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 38%, rgba(0,0,0,0.28) 100%), rgba(6,6,8,0.82);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
      }
      .picker {
        background: rgba(6,6,8,0.82);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
      }
      .picker-bar, .picker-foot { background: rgba(255,255,255,0.03); }
      .room-panel-close:hover { background: rgba(255,255,255,0.08); }
      .search { background: rgba(255,255,255,0.06); color: var(--pf-ink); }
      .search::placeholder { color: var(--pf-muted); }
      .cell { background: rgba(255,255,255,0.04); }
      .cell .label { color: var(--pf-ink); }
      .cell .thumb {
        background:
          linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%),
          linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%),

      .canvas-wrap {

          linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%);
        background-size: 22px 22px; background-position: 0 0, 11px 11px;

      body {

  </style>
</head>
<body>

  <div class="wrap">

          <button type="button" class="hotspot" data-layer="base" data-base-label="Base — bookshelf"
            style="left:3%; top:12%; width:21%; height:45%;">

            style="left:42%; top:2%; width:20%; height:10%;">

          </div>
          <div class="room-panel-body" id="roomPanelBody">
            <div class="room-panel-main">
              <div class="picker-bar">
                <input class="search" id="search" type="search" placeholder="Search traits…" aria-label="Search traits in this layer">
                <span class="count" id="count"></span>
              </div>
              <div class="grid" id="grid" role="region"></div>
              <div class="picker-foot">Your build is saved in this browser.</div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.3" integrity="sha384-uVefCux0Kf6w34gQVv8+jUPUwvwFUdnrcwI1kOJHs7sfPPXdDDucwcrPrppD6oUe" crossorigin="anonymous"></script>
  <script src="assets/js/troll-accounts.js?v=20260818c"></script>
  <script>
  (() => {
    'use strict';

    const MANIFEST_URL = 'assets/data/pfp-traits.json';
    const STORE_KEY = 'trollrunner_pfp_build_v1';
    // Layers that may legitimately be empty. Background and base are the
    // two that make a PFP read as a PFP, so they default to something.
    const OPTIONAL = new Set(['outfit', 'headwear', 'accessory']);
    // Hand-shot photo of each hotspot's furniture, filled in as the whole
    // drawer's background. Every layer shows the full shot uncropped
    // (background-size: contain) except "base", which is allowed to crop
    // in tight for a punchier canvas since the wide shot doesn't read well
    // shrunk to fit.
    const CLOSEUPS = {
      base: { src: 'assets/images/world/pfp-base.png', pos: '50% 20%', fit: 'cover' },
      headwear: { src: 'assets/images/world/pfp-headware.png', fit: 'contain' },
      outfit: { src: 'assets/images/world/pfp-outfit.png', fit: 'contain' },
      background: { src: 'assets/images/world/pfp-background.png', fit: 'contain' },
      accessory: { src: 'assets/images/world/pfp-accesories.png', fit: 'contain' },
    };

    const el = {
      stack: document.getElementById('stack'),
      grid: document.getElementById('grid'),
      search: document.getElementById('search'),
      count: document.getElementById('count'),
      note: document.getElementById('note'),
      summary: document.getElementById('summary'),
      total: document.getElementById('trait-total'),
      roomShots: Array.from(document.querySelectorAll('.room-bg-alt')),
      tvFrames: Array.from(document.querySelectorAll('.room-bg-alt[data-tv-frame]')),
      picker: document.querySelector('.picker'),
      roomPanel: document.getElementById('roomPanel'),
      roomPanelBody: document.getElementById('roomPanelBody'),
      roomPanelTitle: document.getElementById('roomPanelTitle'),
      roomPanelClose: document.getElementById('roomPanelClose'),
      hotspots: Array.from(document.querySelectorAll('.hotspot')),
    };

    let manifest = null;
    let activeLayer = null;
    /** @type {Record<string, string|null>} layer id -> trait id (null = none) */
    let build = {};
    /** layer id -> <img> in the preview stack, in z-order */
    const layerImg = new Map();
    /** Previous builds, oldest first. Randomize is one click away from losing
     *  a good troll forever, so every mutation is undoable. */
    const past = [];
    const HISTORY_LIMIT = 60;

    const fullSrc = (layer, trait) => `assets/pfp/${layer}/${trait}.webp`;
    const thumbSrc = (layer, trait) => `assets/pfp/${layer}/thumb/${trait}.webp`;
    const layerById = id => manifest.layers.find(l => l.id === id);
    const traitById = (layer, id) => layerById(layer)?.traits.find(t => t.id === id) || null;

    function note(msg, kind) {
      el.note.textContent = msg || '';
      el.note.className = 'note' + (kind ? ` is-${kind}` : '');
    }

    /* ---------- build state ---------- */

    function defaultBuild() {
      const next = {};
      for (const layer of manifest.layers) {
        next[layer.id] = OPTIONAL.has(layer.id) ? null : (layer.traits[0]?.id ?? null);
      }
      // A plain dressed troll beats whatever happens to sort first.
      const preferred = { background: 'holo', base: 'og', outfit: 'tee-black' };
      for (const [id, want] of Object.entries(preferred)) {
        if (traitById(id, want)) next[id] = want;
      }
      return next;
    }

    function randomBuild(all) {
      const next = {};
      for (const layer of manifest.layers) {
        const optional = OPTIONAL.has(layer.id);
        // Solo art wears nothing else, so rolling it would silently strip the
        // rest of the troll — leave it to be chosen deliberately.
        const pool = layer.traits.filter(t => !t.solo);
        // "Randomize" keeps a wearable silhouette; "full random" fills every slot.
        const skip = optional && !all && layer.id === 'accessory' && Math.random() < 0.5;
        if (skip || !pool.length) { next[layer.id] = null; continue; }
        next[layer.id] = pool[Math.floor(Math.random() * pool.length)].id;
      }
      return next;
    }

    /** Drop trait ids that aren't in the manifest (renamed/removed art), then
     *  apply the solo rule. Builds arriving from localStorage or a shared link
     *  never went through setBuild(), so without enforceSolo() here a saved
     *  Ninja-plus-outfit combo loads straight past the rule and renders the
     *  broken troll it exists to prevent. */
    function sanitize(raw) {
      const next = {};
      for (const layer of manifest.layers) {
        const want = raw?.[layer.id];
        next[layer.id] = want && traitById(layer.id, want) ? want : null;
      }
      // Anything required that got dropped falls back to the default.
      const base = defaultBuild();
      for (const layer of manifest.layers) {
        if (!next[layer.id] && !OPTIONAL.has(layer.id)) next[layer.id] = base[layer.id];
      }
      return enforceSolo(next);
    }

    function readUrlBuild() {
      const params = new URLSearchParams(location.search);
      if (![...params.keys()].some(k => manifest.layers.some(l => l.id === k))) return null;
      const raw = {};
      for (const layer of manifest.layers) {
        const v = params.get(layer.id);
        raw[layer.id] = v && v !== 'none' ? v : null;
      }
      return raw;
    }

    function persist() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(build)); } catch {}
    }

    /** Some art is a finished troll on its own (see `solo` in the manifest):
     *  a head at its own scale, or a character that already has an outfit.
     *  Layering clothes under those just looks broken, so while one is worn
     *  the optional layers are emptied and locked. */
    function soloTrait() {
      for (const layer of manifest.layers) {
        const t = build[layer.id] && traitById(layer.id, build[layer.id]);
        if (t?.solo) return { layer, trait: t };
      }
      return null;
    }

    function enforceSolo(next) {
      const solo = manifest.layers.some(l => {
        const t = next[l.id] && traitById(l.id, next[l.id]);
        return t?.solo;
      });
      if (!solo) return next;
      const clean = { ...next };
      for (const id of OPTIONAL) clean[id] = null;
      return clean;
    }

    /** The one way the build changes, so nothing can bypass the undo stack. */
    function setBuild(next, { record = true } = {}) {
      next = enforceSolo(next);
      if (record) {
        past.push({ ...build });
        if (past.length > HISTORY_LIMIT) past.shift();
      }
      build = next;
      persist();
      renderStack();
      renderGrid();
      syncHistory();
    }

    function stepBack() {
      const previous = past.pop();
      if (!previous) return;
      setBuild(previous, { record: false });
      note('');
    }

    function syncHistory() {
      const btn = document.getElementById('btn-back');
      if (!btn) return;
      btn.disabled = past.length === 0;
      const label = past.length
        ? `Go back to the previous look (${past.length} to step through)`
        : 'No previous look yet';
      btn.setAttribute('aria-label', label);
      btn.title = label;
    }

    function readStored() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch { return null; }
    }

    /* ---------- rendering ---------- */

    function renderStack() {
      for (const layer of manifest.layers) {
        const img = layerImg.get(layer.id);
        const trait = build[layer.id];
        if (!img) continue;
        if (trait) {
          const src = fullSrc(layer.id, trait);
          if (!img.src.endsWith(src)) img.src = src;
          img.classList.add('is-on');
          img.alt = `${layer.name}: ${traitById(layer.id, trait)?.name || trait}`;
        } else {
          img.classList.remove('is-on');
          img.alt = '';
        }
      }
      const worn = manifest.layers
        .filter(l => build[l.id])
        .map(l => traitById(l.id, build[l.id])?.name)
        .filter(Boolean);
      el.summary.textContent = worn.length ? worn.join(' · ') : 'Empty troll';
      renderHotspots();
    }

    /** Furniture hotspots stand in for the old tab strip: a lit outline on
     *  hover, a dot once something's equipped in that layer, and a highlight
     *  while its drawer is the one open. */
    function renderHotspots() {
      const panelOpen = !el.roomPanel.hidden;
      for (const btn of el.hotspots) {
        const id = btn.dataset.layer;
        const label = btn.dataset.baseLabel;
        btn.classList.toggle('is-set', !!build[id]);
        btn.classList.toggle('is-active', panelOpen && activeLayer === id);
        btn.setAttribute('aria-label', build[id]
          ? `${label} — ${traitById(id, build[id])?.name} selected`
          : label);
      }
    }

    function openRoomPanel(layerId) {
      if (activeLayer === layerId && !el.roomPanel.hidden) { closeRoomPanel(); return; }
      activeLayer = layerId;
      el.search.value = '';
      el.roomPanel.hidden = false;
      el.picker.classList.add('drawer-open');
      el.roomPanelTitle.textContent = layerById(layerId)?.name || layerId;
      const closeup = CLOSEUPS[layerId];
      if (closeup) {
        el.roomPanelBody.style.backgroundImage = `url(${closeup.src})`;
        el.roomPanelBody.style.backgroundPosition = closeup.pos || 'center';
        el.roomPanelBody.classList.toggle('is-cover', closeup.fit === 'cover');
      }
      renderGrid();
      renderHotspots();
      updateRoomArt();
    }

    function closeRoomPanel() {
      activeLayer = null;
      el.roomPanel.hidden = true;
      el.picker.classList.remove('drawer-open');
      renderHotspots();
      updateRoomArt();
    }

    /* ---- room art ----
       Only ever one shot is lit at a time. Which one is decided by three
       inputs in priority order: whatever the cursor is over right now,
       then whatever has keyboard focus, then whichever drawer is open.
       With none of them pointing anywhere the room falls back to the idle
       photo underneath, so moving off the furniture always lands you back
       on the same neutral shot. */
    let hoveredLayer = null;
    let focusedLayer = null;

    /** The shot the room should be showing, or null for the idle photo. */
    function currentShot() {
      return hoveredLayer ?? focusedLayer ?? activeLayer ?? null;
    }

    function updateRoomArt() {
      const shot = currentShot();
      // The TV is a loop rather than a still, so it runs its own timer and
      // owns the visibility of its three frames — leave them alone here.
      for (const img of el.roomShots) {
        if (img.hasAttribute('data-tv-frame')) continue;
        img.classList.toggle('is-visible', img.dataset.roomShot === shot);
      }
      if (shot === 'background') startTvLoop(); else stopTvLoop();
    }

    // The TV cycles through its lit-up color frames while the background
    // hotspot is the live one — same cross-fade as every other shot, just
    // stepping between three of them instead of holding on one.
    let tvLoopTimer = null;
    function startTvLoop() {
      if (tvLoopTimer) return;
      let i = 0;
      const step = () => {
        el.tvFrames.forEach((img, n) => img.classList.toggle('is-visible', n === i));
        i = (i + 1) % el.tvFrames.length;
      };
      step();
      tvLoopTimer = window.setInterval(step, 1100);
    }
    function stopTvLoop() {
      window.clearInterval(tvLoopTimer);
      tvLoopTimer = null;
      el.tvFrames.forEach(img => img.classList.remove('is-visible'));
    }

    function renderGrid() {
      const layer = layerById(activeLayer);
      if (!layer) return;
      const q = el.search.value.trim().toLowerCase();
      const traits = q ? layer.traits.filter(t => t.name.toLowerCase().includes(q)) : layer.traits;

      el.grid.innerHTML = '';
      el.grid.setAttribute('aria-label', `${layer.name} traits`);
      el.count.textContent = q
        ? `${traits.length} of ${layer.traits.length}`
        : `${layer.traits.length} traits`;

      // A solo base owns the whole picture — offer the way out instead of a
      // grid of traits that would silently do nothing.
      const solo = soloTrait();
      if (solo && OPTIONAL.has(layer.id)) {
        const box = document.createElement('div');
        box.className = 'locked';
        const p = document.createElement('p');
        p.textContent = `${solo.trait.name} is a complete troll — it comes with its own look, so ${layer.name.toLowerCase()} is switched off.`;
        const swap = document.createElement('button');
        swap.type = 'button';
        swap.className = 'btn-swap';
        swap.textContent = 'Switch to a layerable base';
        swap.addEventListener('click', () => {
          const plain = layerById('base').traits.find(t => t.id === 'og' && !t.solo)
            || layerById('base').traits.find(t => !t.solo);
          setBuild({ ...build, base: plain?.id ?? null });
          note('');
        });
        box.append(p, swap);
        el.grid.appendChild(box);
        el.count.textContent = 'locked';
        return;
      }

      if (OPTIONAL.has(layer.id) && !q) {
        el.grid.appendChild(cell(layer, null));
      }
      for (const trait of traits) el.grid.appendChild(cell(layer, trait));

      if (!traits.length) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = `No ${layer.name.toLowerCase()} matches “${el.search.value.trim()}”.`;
        el.grid.appendChild(p);
      }
    }

    function cell(layer, trait) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cell' + (trait ? '' : ' cell-none');
      const selected = trait ? build[layer.id] === trait.id : !build[layer.id];
      btn.setAttribute('aria-pressed', String(selected));

      if (trait) {
        const img = document.createElement('img');
        img.className = 'thumb';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = thumbSrc(layer.id, trait.id);
        img.alt = '';
        btn.appendChild(img);
      } else {
        const none = document.createElement('span');
        none.className = 'thumb';
        none.textContent = '∅';
        none.setAttribute('aria-hidden', 'true');
        btn.appendChild(none);
      }

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = trait ? trait.name : 'None';
      btn.appendChild(label);

      if (trait?.solo) {
        const solo = document.createElement('span');
        solo.className = 'badge-solo';
        solo.textContent = 'Complete';
        btn.appendChild(solo);
      }

      btn.setAttribute('aria-label',
        `${trait ? trait.name : `No ${layer.name.toLowerCase()}`}${selected ? ' (selected)' : ''}`);

      btn.addEventListener('click', () => {
        setBuild({ ...build, [layer.id]: trait ? trait.id : null });
        note('');
      });
      return btn;
    }

    /* ---------- export ---------- */

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Could not load ${src}`));
        img.src = src;
      });
    }

    // Composites at full manifest resolution rather than reusing the on-screen
    // stack, so the export is the same regardless of window size. Every layer
    // is same-origin, so the canvas stays untainted and toBlob() works.
    async function renderToBlob() {
      const size = manifest.size || 1024;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      for (const layer of manifest.layers) {
        const trait = build[layer.id];
        if (!trait) continue;
        const img = await loadImage(fullSrc(layer.id, trait));
        ctx.drawImage(img, 0, 0, size, size);
      }
      return new Promise((resolve, reject) => {
        canvas.toBlob(b => (b ? resolve(b) : reject(new Error('Export failed.'))), 'image/png');
      });
    }

    function filename() {
      const parts = manifest.layers.map(l => build[l.id]).filter(Boolean);
      return `troll-pfp-${parts.slice(0, 3).join('-') || 'blank'}.png`;
    }

    async function download() {
      note('Rendering…');
      try {
        const blob = await renderToBlob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename();
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        note('Downloaded. Go be insufferable.', 'ok');
      } catch (err) {
        note(err.message || 'Could not export that one.', 'err');
      }
    }

    async function saveToProfile() {
      const accounts = window.TrollrunnerAccounts;
      if (!accounts?.getCachedProfile?.()) {
        note('Log in on the desktop first — then this saves straight to your troll.', 'err');
        return;
      }
      const btn = document.getElementById('btn-save');
      btn.disabled = true;
      note('Uploading…');
      try {
        const blob = await renderToBlob();
        // uploadAvatar() sniffs type/name, resizes and points the profile at it.
        const file = new File([blob], filename(), { type: 'image/png' });
        await accounts.uploadAvatar(file);
        note('Saved. That grin is your profile picture now.', 'ok');
      } catch (err) {
        note(err?.message || 'Could not save that to your profile.', 'err');
      } finally {
        btn.disabled = false;
      }
    }

    /* ---------- boot ---------- */

    async function init() {
      try {
        const res = await fetch(MANIFEST_URL);
        if (!res.ok) throw new Error(`Trait manifest failed (${res.status}).`);
        manifest = await res.json();
      } catch (err) {
        note(err.message || 'Could not load the trait set.', 'err');
        el.summary.textContent = 'Traits unavailable';
        return;
      }

      // Preview stack: one <img> per layer, appended in manifest order so the
      // DOM order IS the z-order (background first, accessories last).
      for (const layer of manifest.layers) {
        const img = document.createElement('img');
        img.alt = '';
        img.decoding = 'async';
        el.stack.appendChild(img);
        layerImg.set(layer.id, img);
      }

      const total = manifest.layers.reduce((n, l) => n + l.traits.length, 0);
      el.total.textContent = String(total);

      build = sanitize(readUrlBuild() || readStored() || defaultBuild());
      // No drawer is open at boot — the room starts as just a room, with the
      // hint text inviting the click. If a shared link/saved build already
      // has picks, jump straight to the outfit drawer so it isn't a dead end.
      activeLayer = null;
      persist();
      renderStack();
      syncHistory();
      note('');

      for (const btn of el.hotspots) {
        const layer = btn.dataset.layer;
        btn.addEventListener('click', () => openRoomPanel(layer));
        // Every hotspot lights its own piece of furniture; leaving one
        // clears the claim so the room drops back to the idle shot unless
        // something else (focus, an open drawer) still wants a shot up.
        btn.addEventListener('mouseenter', () => { hoveredLayer = layer; updateRoomArt(); });
        btn.addEventListener('mouseleave', () => {
          if (hoveredLayer === layer) hoveredLayer = null;
          updateRoomArt();
        });
        btn.addEventListener('focus', () => { focusedLayer = layer; updateRoomArt(); });
        btn.addEventListener('blur', () => {
          if (focusedLayer === layer) focusedLayer = null;
          updateRoomArt();
        });
      }
      el.roomPanelClose.addEventListener('click', closeRoomPanel);
      // Iframed inside the index.html desktop icon, "/" would reload the
      // whole site's boot/lock sequence into that small window and look
      // broken — only navigate home when this is a real top-level page.
      document.getElementById('btn-home').addEventListener('click', () => {
        if (window.self === window.top) {
          // Read by index.html to skip world.html's lock-drag and boot
          // typing animation — we're coming back in, not landing fresh.
          try { sessionStorage.setItem('trollrunner_skip_entrance', '1'); } catch {}
          location.href = '/';
        } else {
          closeRoomPanel();
        }
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !el.roomPanel.hidden) closeRoomPanel();
      });

      el.search.addEventListener('input', renderGrid);
      document.getElementById('btn-back').addEventListener('click', stepBack);
      document.getElementById('btn-surprise').addEventListener('click', () => {
        setBuild(randomBuild(true)); note('');
      });
      document.getElementById('btn-reset').addEventListener('click', () => {
        setBuild(defaultBuild()); note('');
      });
      document.getElementById('btn-download').addEventListener('click', download);
      document.getElementById('btn-save').addEventListener('click', saveToProfile);
    }

    init();

    /* ================= STARFIELD =================
       Same treatment as world.html's home page — canvas rather than
       hundreds of DOM nodes, static single paint under reduced motion. */
    const calm = matchMedia('(prefers-reduced-motion: reduce)');
    const starsCanvas = document.getElementById('stars');
    const starsCtx = starsCanvas.getContext('2d');
    let stars = [], starsRaf = 0;
    function seedStars() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      starsCanvas.width = Math.floor(innerWidth * dpr);
      starsCanvas.height = Math.floor(innerHeight * dpr);
      starsCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.round((innerWidth * innerHeight) / 9000);
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * innerWidth, y: Math.random() * innerHeight,
        r: Math.random() * 1.25 + 0.25, a: Math.random() * 0.5 + 0.25,
        tw: Math.random() * 0.02 + 0.004, p: Math.random() * Math.PI * 2,
      }));
    }
    function drawStars(t) {
      starsCtx.clearRect(0, 0, innerWidth, innerHeight);
      for (const s of stars) {
        const alpha = calm.matches ? s.a : s.a + Math.sin(t * s.tw + s.p) * 0.22;
        starsCtx.globalAlpha = Math.max(0.05, Math.min(1, alpha));
        starsCtx.fillStyle = '#fff';
        starsCtx.beginPath(); starsCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2); starsCtx.fill();
      }
      starsCtx.globalAlpha = 1;
    }
    function loopStars(t) { drawStars(t); starsRaf = requestAnimationFrame(loopStars); }
    function startStars() {
      cancelAnimationFrame(starsRaf); seedStars();
      if (calm.matches) drawStars(0); else starsRaf = requestAnimationFrame(loopStars);
    }
    addEventListener('resize', startStars, { passive: true });
    calm.addEventListener?.('change', startStars);
    startStars();
  })();
  </script>
</body>
</html>
