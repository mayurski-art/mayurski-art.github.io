  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PFP Studio — Troll Runner</title>
  <script>
  // iOS Safari ignores user-scalable=no/maximum-scale in the viewport meta
  // (an accessibility override since iOS 10) — the only thing that actually
  // blocks pinch-zoom there is preventDefault on WebKit's proprietary gesture
  // events. touchmove covers the Chrome/Android two-finger case, and wheel+
  // ctrlKey covers trackpad pinch-zoom on desktop (macOS/Windows), which none
  // of the touch/gesture handlers see at all.
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
    document.addEventListener(type, e => e.preventDefault());
  });
  document.addEventListener('touchmove', e => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  document.addEventListener('wheel', e => {
    if (e.ctrlKey) e.preventDefault();
  }, { passive: false });
  </script>
  <meta name="description" content="Build your own troll profile picture from Swish's trait set — background, base, outfit, headwear and accessories.">
  <!-- Matches world.html's standalone-mode meta exactly. Without these, iOS
       treats the hop from the home-screen app into this page as leaving the
       installed app and drops the visitor into a chromed Safari view (URL
       bar, Done button) instead of continuing the app-like navigation —
       that's the "browser popping up" flash between the two pages. -->
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TROLLRUNNER">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/images/icons/app/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Opts into the native cross-document view transition when arriving
       from/leaving to world.html — that page enables the matching rule
       unconditionally now that PFP Studio is a real navigation instead of
       an in-page sheet. Both documents need this rule for the crossfade to
       fire; unsupported browsers just navigate instantly. */
    @view-transition { navigation: auto; }

    :root {
      --pf-bg: #1c1c1e;
      --pf-panel: #f5f5f7;
      --pf-panel-2: #f2efe9;
      --pf-ink: #1c1c1e;
      --pf-muted: #6e6e73;
      --pf-line: rgba(0, 0, 0, 0.14);
      --pf-line-dark: rgba(255, 255, 255, 0.16);
      --pf-accent: #5856d6;
      --pf-green: #34c759;
      --pf-orange: #ff9500;
      --pf-share: #00ba7c;
      --pf-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --pf-mono: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--pf-sans);
      color: #f5f5f7;
      background: #000000;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--pf-orange); outline-offset: 2px; }

    /* Same starfield as trollrunner.net's home page, behind the studio
       card so it reads as a panel over the main site. */
    .space { position: fixed; inset: 0; z-index: 0; background: #000; pointer-events: none; }
    .space canvas { display: block; width: 100%; height: 100%; }
    .wrap { position: relative; z-index: 1; max-width: min(97vw, 1760px); margin: 0 auto; padding: 16px 16px 28px; }

    /* Above the phone breakpoint the studio card is shorter than a
       maximized desktop window, so center it instead of pinning it to the
       top and leaving a dead void underneath. */
    @media (min-width: 861px) {
      body { display: flex; }
      .wrap { width: 100%; max-width: min(90vw, 1600px); margin: auto; }
    }

    /* ---------- header ---------- */
    .top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
    .brand p { margin: 2px 0 0; font-size: 13px; color: #9b9ba1; }
    /* Closes whatever trait drawer is open and returns to the plain room
       view, same as landing here fresh. Deliberately stays inside the
       studio rather than leaving the page: an off-site link here
       re-triggers the phone entrance's own boot/lock sequence, which reads
       as a broken reload rather than "going back". */
    button.btn-home {
      width: 36px; height: 36px; flex: none;
      display: flex; align-items: center; justify-content: center;
      border: 0.5px solid var(--pf-line-dark); border-radius: 10px;
      background: rgba(255, 255, 255, 0.05); color: #d9d9e0;
      font-size: 16px; line-height: 1;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    button.btn-home:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--pf-line-dark); }
    .top-actions { display: flex; align-items: center; gap: 10px; flex: none; }
    /* Hidden until updateAuthUI() sets it to "Log in" or the account pill —
       see JS. Save-as-profile silently no-ops for guests otherwise, with no
       hint why; the "Log in" state is the "you'll need an account" nudge. */
    .btn-signin {
      display: none; height: 36px; padding: 0 15px; border-radius: 10px;
      border: 0.5px solid transparent; background: var(--pf-accent); color: #fff;
      font-family: var(--pf-sans); font-size: 13px; font-weight: 600; white-space: nowrap;
      transition: background 0.15s ease;
    }
    .btn-signin.is-visible { display: inline-flex; align-items: center; justify-content: center; }
    .btn-signin:hover { background: #6a68e0; }
    /* Logged-in state: same button, swapped to an avatar + username pill
       that opens the real trollrunner.net profile modal (openProfile()). */
    .btn-signin.is-account {
      padding: 0 14px 0 4px; gap: 8px; background: rgba(255, 255, 255, 0.06);
      border-color: var(--pf-line-dark); color: #e7e7ec;
    }
    .btn-signin.is-account:hover { background: rgba(255, 255, 255, 0.1); }
    .btn-signin.is-account img {
      width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
      display: block; background: #000;
    }

    /* ---------- layout ---------- */
    .studio { display: grid; grid-template-columns: minmax(0, 456px) minmax(0, 1fr); gap: 18px; align-items: start; }

    /* ---------- stage ---------- */
    .stage {
      border-radius: 18px; padding: 0 12px 12px;
      position: sticky; top: 16px;
    }
    .canvas-wrap {
      position: relative; width: 100%; aspect-ratio: 1 / 1;
      border-radius: 14px; overflow: hidden;
      border: 0.5px solid var(--pf-line-dark);
      /* checkerboard shows through when no background trait is picked */
      background-color: #e8e8ea;
      background-image:
        linear-gradient(45deg, #d3d3d8 25%, transparent 25%, transparent 75%, #d3d3d8 75%),
        linear-gradient(45deg, #d3d3d8 25%, transparent 25%, transparent 75%, #d3d3d8 75%);
      background-size: 22px 22px;
      background-position: 0 0, 11px 11px;
    }
    .canvas-wrap img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; display: none;
    }
    .canvas-wrap img.is-on { display: block; }

    /* The trait list grows to five names, so it wraps on its own line rather
       than colliding with the counter pinned on the right. */
    .stage-meta {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 14px; margin: 13px 2px 0; font-family: var(--pf-mono); font-size: 11.5px;
      color: #9b9ba1; line-height: 1.45;
    }
    .stage-meta #summary { min-width: 0; flex: 1; overflow-wrap: anywhere; }
    .stage-meta .meta-count { flex: none; white-space: nowrap; }
    .stage-meta b { color: #f5f5f7; font-weight: 500; }

    /* One icon-only toolbar row instead of a tall stack of labeled buttons
       — the labels were most of the vertical space this card spent on
       chrome instead of on the actual preview image. Tooltips (title/
       aria-label, already on every button) carry the meaning instead. */
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
    .btn {
      flex: 1 1 0; min-width: 40px;
      border: 0.5px solid var(--pf-line-dark); border-radius: 11px;
      background: rgba(255, 255, 255, 0.08); color: #f5f5f7;
      padding: 11px; font-size: 13.5px; font-weight: 500;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.14); }
    .btn:active { transform: translateY(1px); }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
    /* Share/download is the button most visitors actually want — give it
       its own fixed brand color (not the shifting --pf-accent, which turns
       mint-green on mobile and would blend into btn-save) plus a glow so
       it reads as the obvious next step, not just another toolbar icon.
       Retweet-green + a repost-style icon, like X's retweet button. */
    .btn.btn-primary {
      background: var(--pf-share); border-color: transparent;
      box-shadow: 0 3px 14px rgba(0, 186, 124, 0.45);
    }
    .btn.btn-primary:hover { background: #00d68f; }
    .btn-save { background: var(--pf-green); border-color: transparent; color: #06210f; }
    .btn-save:hover { background: #45d76a; }
    .btn-label { display: none; }

    .note {
      margin: 11px 2px 0; font-size: 12.5px; line-height: 1.45; color: #9b9ba1; min-height: 1.2em;
    }
    .note.is-ok { color: #6ee08a; }
    .note.is-err { color: #ff8f9a; }

    /* ---------- share modal ----------
       Body background is always the dark shell (mobile just swaps the shade
       of black), so this card doesn't need a separate light variant the way
       .picker does. */
    .share-modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .share-modal[hidden] { display: none; }
    .share-modal-backdrop {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .share-modal-card {
      position: relative; z-index: 1; width: min(360px, 100%);
      background: linear-gradient(165deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 38%, rgba(0,0,0,0.3) 100%), #131316;
      border: 0.5px solid var(--pf-line-dark); border-radius: 20px;
      padding: 20px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column; gap: 14px;
    }
    .share-modal-close {
      position: absolute; top: 12px; right: 12px; border: none;
      background: rgba(255, 255, 255, 0.08); color: #f5f5f7;
      width: 30px; height: 30px; border-radius: 50%; font-size: 13px; line-height: 1;
    }
    .share-modal-close:hover { background: rgba(255, 255, 255, 0.16); }
    .share-modal-card h2 { margin: 0; padding-right: 30px; font-size: 16px; font-weight: 700; color: #f5f5f7; }
    .share-modal-preview {
      aspect-ratio: 1 / 1; border-radius: 14px; overflow: hidden;
      border: 0.5px solid var(--pf-line-dark); background-color: #0a0a0b;
      background-image:
        linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%),
        linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%);
      background-size: 22px 22px; background-position: 0 0, 11px 11px;
    }
    .share-modal-preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .share-modal-note { margin: 0; font-size: 12px; color: #9b9ba1; min-height: 1.2em; text-align: center; }
    .share-modal-note.is-ok { color: #6ee08a; }
    .share-modal-note.is-err { color: #ff8f9a; }
    .share-modal-actions { display: flex; gap: 10px; }
    .share-btn {
      flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px; border-radius: 12px; border: 0.5px solid var(--pf-line-dark);
      font-size: 13.5px; font-weight: 600; background: rgba(255, 255, 255, 0.08); color: #f5f5f7;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .share-btn:hover { background: rgba(255, 255, 255, 0.16); }
    .share-btn:active { transform: translateY(1px); }
    .share-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
    .share-btn-ic { font-size: 15px; }
    .share-btn-x { background: #fff; color: #000; border-color: transparent; }
    .share-btn-x:hover { background: #e6e6e6; }
    .share-btn-download { background: var(--pf-accent); border-color: transparent; }
    .share-btn-download:hover { background: #6a68e0; }

    /* ---------- auth modal ---------- */
    .auth-field { display: flex; flex-direction: column; gap: 5px; text-align: left; }
    .auth-field[hidden] { display: none; }
    .auth-field label { font-size: 12px; color: #9b9ba1; }
    .auth-field input {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 0.5px solid var(--pf-line-dark); background: rgba(255, 255, 255, 0.06);
      color: #f5f5f7; font-family: var(--pf-sans); font-size: 14px;
    }
    .auth-field input:focus { outline: 2px solid var(--pf-accent); outline-offset: 1px; }
    .auth-swap { background: transparent; border-color: transparent; color: #9b9ba1; }
    .auth-swap:hover { background: transparent; color: #f5f5f7; }
    .auth-or-sep { display: flex; align-items: center; gap: 10px; font-size: 11px; color: #9b9ba1; }
    .auth-or-sep::before, .auth-or-sep::after { content: ''; flex: 1; height: 1px; background: var(--pf-line-dark); }

    /* ---------- bug report ---------- */
    /* Deliberately a sibling of .studio, not a grid cell inside it — it's
       meta-feedback about the tool, not part of building a troll. */
    .bug-report { margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .btn-bug {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-radius: 11px; border: 0.5px solid transparent;
      background: #ff3b30; color: #fff; font-family: var(--pf-sans);
      font-size: 13.5px; font-weight: 600;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn-bug:hover { background: #ff6259; }
    .btn-bug:active { transform: translateY(1px); }
    .btn-bug[disabled] { opacity: 0.55; cursor: not-allowed; }
    .bug-report-box {
      width: min(420px, 100%); display: flex; flex-direction: column; gap: 8px;
      background: rgba(255, 255, 255, 0.04); border: 0.5px solid var(--pf-line-dark);
      border-radius: 14px; padding: 14px;
    }
    .bug-report-box[hidden] { display: none; }
    .bug-report-box textarea {
      width: 100%; min-height: 84px; resize: vertical;
      padding: 10px 12px; border-radius: 10px;
      border: 0.5px solid var(--pf-line-dark); background: rgba(255, 255, 255, 0.06);
      color: #f5f5f7; font-family: var(--pf-sans); font-size: 13.5px; line-height: 1.4;
    }
    .bug-report-box textarea:focus { outline: 2px solid #ff3b30; outline-offset: 1px; }
    .bug-report-box-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .bug-report-count { font-family: var(--pf-mono); font-size: 11px; color: #9b9ba1; }
    .bug-report-count.is-over { color: #ff8f9a; }
    .bug-report-box-actions { display: flex; gap: 8px; }
    .bug-report-note { margin: 0; font-size: 12.5px; line-height: 1.4; color: #9b9ba1; min-height: 1.2em; }
    .bug-report-note.is-ok { color: #6ee08a; }
    .bug-report-note.is-err { color: #ff8f9a; }

    /* ---------- admin bug queue ---------- */
    .btn-admin-bugs {
      display: none; height: 36px; padding: 0 13px; border-radius: 10px;
      border: 0.5px solid var(--pf-line-dark); background: rgba(255, 255, 255, 0.06);
      color: #e7e7ec; font-family: var(--pf-sans); font-size: 12.5px; font-weight: 600;
      align-items: center; gap: 6px; white-space: nowrap;
    }
    .btn-admin-bugs.is-visible { display: inline-flex; }
    .btn-admin-bugs:hover { background: rgba(255, 255, 255, 0.1); }
    .btn-admin-bugs .badge {
      background: #ff3b30; color: #fff; border-radius: 999px;
      min-width: 16px; height: 16px; padding: 0 5px;
      font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
    }
    .admin-bugs-modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .admin-bugs-modal[hidden] { display: none; }
    .admin-bugs-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .admin-bugs-card {
      position: relative; z-index: 1; width: min(520px, 100%); max-height: min(78vh, 640px);
      background: linear-gradient(165deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 38%, rgba(0,0,0,0.3) 100%), #131316;
      border: 0.5px solid var(--pf-line-dark); border-radius: 20px;
      padding: 20px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column; gap: 12px;
    }
    .admin-bugs-close {
      position: absolute; top: 12px; right: 12px; border: none;
      background: rgba(255, 255, 255, 0.08); color: #f5f5f7;
      width: 30px; height: 30px; border-radius: 50%; font-size: 13px; line-height: 1;
    }
    .admin-bugs-close:hover { background: rgba(255, 255, 255, 0.16); }
    .admin-bugs-card h2 { margin: 0; padding-right: 30px; font-size: 16px; font-weight: 700; color: #f5f5f7; }
    .admin-bugs-list { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .admin-bug-row {
      border: 0.5px solid var(--pf-line-dark); border-radius: 12px; padding: 11px 12px;
      display: flex; flex-direction: column; gap: 6px; font-size: 12.5px;
    }
    .admin-bug-row.is-resolved { opacity: 0.5; }
    .admin-bug-row .msg { color: #f5f5f7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .admin-bug-row .meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-family: var(--pf-mono); font-size: 10.5px; color: #9b9ba1; }
    .admin-bug-row .resolve-btn {
      align-self: flex-start; padding: 5px 11px; border-radius: 8px;
      border: 0.5px solid var(--pf-line-dark); background: rgba(255, 255, 255, 0.08); color: #f5f5f7;
      font-size: 11.5px; font-weight: 600;
    }
    .admin-bug-row .resolve-btn:hover { background: rgba(255, 255, 255, 0.14); }
    .admin-bug-row .resolve-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
    .admin-bugs-empty { text-align: center; color: #9b9ba1; font-size: 13px; padding: 20px 0; }

    /* ---------- picker ---------- */
    .picker {
      background: var(--pf-panel); color: var(--pf-ink);
      border: 0.5px solid var(--pf-line); border-radius: 18px;
      overflow: hidden; box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
    }

    /* ---------- room hotspot picker ---------- */
    .room {
      position: relative; width: 100%; aspect-ratio: 2047 / 1180;
      overflow: hidden; background: #0a0a10;
    }
    .room-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .room-bg.room-bg-alt { opacity: 0; transition: opacity 0.35s ease; }
    .room-bg.room-bg-alt.is-visible { opacity: 1; }
    .hotspot {
      position: absolute; border: none; background: transparent;
      border-radius: 10px; padding: 0;
    }
    /* All hotspots read as green + pulsing from the start, whether or not
       a layer has something equipped yet — no separate grey "empty" state.
       Every dot exists in the DOM from initial paint and none of them ever
       gets the animation re-triggered later (renderHotspots() used to add
       is-set at whatever moment a layer got its first item, restarting
       that one dot's clock and knocking it out of sync with the rest) —
       so with nothing left to trigger a restart, all dots share one
       timeline for free. */
    .hotspot::after {
      content: ''; position: absolute; top: 7px; right: 7px; width: 10px; height: 10px;
      border-radius: 50%; background: var(--pf-green);
      box-shadow: 0 0 0 2px rgba(10, 10, 16, 0.8), 0 0 0 0 rgba(52, 199, 89, 0.9);
      animation: pf-hotspot-pulse 1.3s ease-out infinite;
    }
    /* Ring spread is capped at 8px, not the more dramatic 12px it started
       at — the headwear and accessory dots sit close enough to the room's
       clipped edge (~11px, see .room's overflow: hidden) that a wider ring
       was getting cut off there and reading as "not pulsing" on the
       shorter mobile room. */
    @keyframes pf-hotspot-pulse {
      0% { box-shadow: 0 0 0 2px rgba(10, 10, 16, 0.8), 0 0 0 0 rgba(52, 199, 89, 0.9); transform: scale(1); }
      50% { box-shadow: 0 0 0 2px rgba(10, 10, 16, 0.8), 0 0 0 8px rgba(52, 199, 89, 0); transform: scale(1.15); }
      100% { box-shadow: 0 0 0 2px rgba(10, 10, 16, 0.8), 0 0 0 8px rgba(52, 199, 89, 0); transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hotspot::after { animation: none; }
    }
    .hotspot-label {
      position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -7px);
      background: rgba(18, 14, 10, 0.92); color: #fff; font-family: var(--pf-mono);
      font-size: 11px; padding: 4px 9px; border-radius: 7px; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.15s ease;
    }
    .hotspot:hover .hotspot-label, .hotspot:focus-visible .hotspot-label { opacity: 1; }
    /* Headwear sits right at the top edge of the room photo, so its label
       has no room to pop up above the button like the others do — the
       room's overflow:hidden was clipping it off-screen. Drop it below
       the button instead. */
    .hotspot[data-layer="headwear"] .hotspot-label { bottom: auto; top: 100%; transform: translate(-50%, 7px); }

    .room-caption {
      margin: 0; padding: 9px 14px; background: var(--pf-bg); color: #fff;
      font-family: var(--pf-sans); font-size: 12.5px; text-align: center; display: block;
    }

    .room-panel[hidden] { display: none; }
    .room-panel-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 13px 14px 0;
    }
    .room-panel-head h2 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; min-width: 0; }
    /* Live avatar thumbnail pinned in the drawer header — desktop already
       shows the full preview beside the drawer, so this only exists on the
       mobile breakpoint where the drawer covers it (see below). */
    .drawer-preview { display: none; }
    .room-panel-close {
      border: none; background: transparent; color: var(--pf-muted);
      font-size: 15px; line-height: 1; padding: 6px 9px; border-radius: 8px;
    }
    .room-panel-close:hover { background: rgba(0, 0, 0, 0.06); color: var(--pf-ink); }

    /* The whole drawer sits on the room photo for that layer instead of a
       small cropped strip — background-size stays "contain" so the full
       shot is visible (nothing sliced off), except "base" which is allowed
       to crop via .is-cover. Individual trait cards keep their own solid
       white background (.cell), so items stay readable over a busy photo;
       only the canvas around them changes. */
    .room-panel-body {
      display: flex; min-height: 0; position: relative;
      background-color: #0a0a10; background-repeat: no-repeat; background-position: center;
      background-size: contain;
    }
    .room-panel-body.is-cover { background-size: cover; }
    .room-panel-main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }

    .picker-bar {
      display: flex; gap: 9px; padding: 12px 14px; align-items: center; border-bottom: 0.5px solid var(--pf-line);
      background: rgba(245, 245, 247, 0.86);
      backdrop-filter: blur(10px) saturate(160%); -webkit-backdrop-filter: blur(10px) saturate(160%);
    }
    .search {
      flex: 1; min-width: 0; border: 0.5px solid var(--pf-line); border-radius: 10px;
      padding: 9px 12px; background: #fff; color: var(--pf-ink); font-size: 13.5px;
    }
    .search::placeholder { color: #a1a1a8; }
    .count { font-family: var(--pf-mono); font-size: 11.5px; color: var(--pf-muted); white-space: nowrap; }

    /* Shown only when a multi-select layer has 2 compatible picks worn —
       lets a rider flip which one paints in front, for pairs where both
       stacking orders look fine and the "right" one is just taste. */
    .order-bar {
      display: flex; gap: 8px; align-items: center; padding: 10px 14px;
      border-bottom: 0.5px solid var(--pf-line); background: var(--pf-panel-2);
      font-size: 12.5px; color: var(--pf-muted); flex-wrap: wrap;
    }
    .order-bar .order-label { white-space: nowrap; }
    .order-bar .order-btn {
      border: 0.5px solid var(--pf-line); border-radius: 999px; background: #fff;
      color: var(--pf-ink); padding: 6px 13px; font-size: 12.5px; font-weight: 500;
      cursor: pointer;
    }
    .order-bar .order-btn:hover { border-color: var(--pf-accent); color: var(--pf-accent); }
    .order-bar .order-btn.is-active { background: var(--pf-accent); border-color: transparent; color: #fff; }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 8px; padding: 12px; max-height: 62vh; overflow: auto;
      scrollbar-width: thin; scrollbar-color: rgba(0, 0, 0, 0.22) transparent;
    }
    .grid::-webkit-scrollbar { width: 7px; }
    .grid::-webkit-scrollbar-track { background: transparent; }
    .grid::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.18); border-radius: 999px; }
    .grid::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.3); }
    .cell {
      border: 0.5px solid var(--pf-line); border-radius: 12px;
      background: #fff; padding: 7px; text-align: center;
      display: flex; flex-direction: column; gap: 6px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
    }
    .cell:hover { border-color: #b9b9c2; transform: translateY(-1px); }
    .cell[aria-pressed="true"] {
      border-color: var(--pf-accent); box-shadow: 0 0 0 2px rgba(88, 86, 214, 0.28);
    }
    .cell .thumb {
      width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; object-fit: contain;
      background:
        linear-gradient(45deg, #ececf0 25%, transparent 25%, transparent 75%, #ececf0 75%),
        linear-gradient(45deg, #ececf0 25%, transparent 25%, transparent 75%, #ececf0 75%),
        #f7f7f9;
      background-size: 14px 14px; background-position: 0 0, 7px 7px;
    }
    @media (min-width: 861px) {
      .cell { opacity: 0.69; transition: opacity 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease; }
      .cell:hover, .cell[aria-pressed="true"] { opacity: 1; }
    }
    .cell .label {
      font-size: 11.5px; line-height: 1.25; color: var(--pf-ink); text-align: center;
      overflow: hidden; min-height: 2.4em; max-height: 2.4em;
      display: flex; align-items: center; justify-content: center;
    }
    .cell[aria-pressed="true"] .label { font-weight: 700; }
    .cell .badge-solo {
      font-family: var(--pf-mono); font-size: 9.5px; color: #fff;
      background: var(--pf-accent); border-radius: 999px; padding: 2px 7px;
      align-self: center;
    }
    .locked {
      grid-column: 1 / -1; padding: 26px 18px; text-align: center;
      background: rgba(255, 255, 255, 0.9); border-radius: 12px;
    }
    .locked p { margin: 0 0 14px; color: var(--pf-muted); font-size: 13.5px; line-height: 1.5; }
    .btn-swap {
      border: 0.5px solid var(--pf-line); border-radius: 10px; background: #fff;
      color: var(--pf-ink); padding: 9px 15px; font-size: 13px; font-weight: 500;
    }
    .btn-swap:hover { border-color: var(--pf-accent); color: var(--pf-accent); }
    .cell-none .thumb {
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #b9b9c2;
    }
    .empty {
      padding: 30px 14px; text-align: center; color: var(--pf-muted); font-size: 13.5px;
      background: rgba(255, 255, 255, 0.9); border-radius: 12px; margin: 12px;
    }

    /* checkbox-ish toggle row under the grid */
    .picker-foot {
      padding: 11px 14px; border-top: 0.5px solid var(--pf-line);
      font-size: 12px; color: var(--pf-muted); background: var(--pf-panel-2);
    }

    @media (max-width: 860px) {
      .studio { grid-template-columns: 1fr; }
      .stage { position: static; max-width: 460px; margin: 0 auto; width: 100%; }
      .grid {
        max-height: none;
        grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
        gap: 8px; padding: 10px;
      }
    }

    /* ---------- mobile app-shell: no page scroll ----------
       Below 860px the four sections (preview, actions, room, drawer) used
       to just stack and the whole document scrolled. Instead the page is
       pinned to the viewport and only the trait grid inside the open
       drawer scrolls — everything else is sized to fit. The room image
       keeps its real aspect ratio (stretching it to fill the leftover flex
       height read as a badly cropped, too-tall photo and drifted the
       hotspots off their landmarks) and just sits at whatever height that
       ratio works out to, right below the header — any leftover space
       below it is inert until a drawer opens and takes it over. */
    @media (max-width: 860px) {
      html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
      body { display: flex; flex-direction: column; }
      .space { display: none; }
      .wrap {
        flex: 1; min-height: 0; width: 100%; margin: 0; max-width: none;
        display: flex; flex-direction: column;
        padding: 10px 10px calc(8px + env(safe-area-inset-bottom));
        overflow: hidden;
      }
      .top { flex: 0 0 auto; margin-bottom: 8px; }
      .brand h1 { font-size: 16px; }

      .studio { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: stretch; gap: 8px; }

      /* Top-down layout: the preview card grows to soak up whatever
         vertical space the room photo's fixed aspect ratio can't use
         (it used to sit as a tiny compact strip, leaving a dead gap below
         the room instead), then shrinks back out of the way once a trait
         drawer opens and the room needs the room back. See the
         .studio:has(.picker.drawer-open) override below. */
      .stage {
        flex: 1 1 auto; min-height: 0; max-width: none; margin: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 8px; padding: 10px 0;
        container-type: size; container-name: pfp-stage;
        background: none; border: 0; box-shadow: none;
      }
      /* container-type: size (below) is only needed for the full-size
         canvas's cqh-based width formula — once the drawer is open the
         canvas switches to a plain % width and no longer needs it. Leaving
         containment on here collapsed .stage's own height to near-zero
         (it can no longer size from content) while the canvas still
         rendered at its real size, so it visually floated up over the
         header instead of sitting in flow. */
      .studio:has(.picker.drawer-open) .stage { flex: 0 0 auto; padding: 6px; gap: 6px; container-type: normal; }
      /* Square avatar, so it can grow by height as freely as by width —
         min() picks whichever of the two is tighter, same idea as
         object-fit: contain but sizing the box itself. */
      .canvas-wrap {
        flex: 0 0 auto; width: min(100vw, calc(100cqh - 70px), 450px);
        margin-left: -10px; margin-right: -10px;
      }
      /* Once a trait drawer is open, the preview's job shifts from "the
         main event" to "quick confirmation while browsing" — shrink it way
         down so the grid (what you're actually scrolling/tapping) gets the
         vertical space instead. Still live-updates on every tap. */
      .studio:has(.picker.drawer-open) .canvas-wrap {
        width: min(30%, 120px); margin-left: 0; margin-right: 0;
      }
      .studio:has(.picker.drawer-open) .actions { display: none; }
      .stage-meta { display: none; }
      .actions {
        flex: 0 0 auto; width: 100%; display: flex; gap: 6px;
        margin-top: 0; overflow-x: auto; -webkit-overflow-scrolling: touch;
        scrollbar-width: none; padding-bottom: 2px;
      }
      .actions::-webkit-scrollbar { display: none; }
      .btn {
        flex: 1 1 0; padding: 9px 8px; white-space: nowrap;
      }
      .note {
        flex: 0 0 auto; width: 100%; margin: 0; min-height: 0; text-align: center;
      }
      .note:empty { display: none; }

      .picker { flex: 0 0 auto; min-height: 0; display: flex; flex-direction: column; }
      .picker.drawer-open { flex: 1 1 auto; }
      .room {
        flex: 0 0 auto; width: 100%; aspect-ratio: 2047 / 1180;
      }
      .room-caption { flex: 0 0 auto; }
      .room-panel {
        flex: 0 0 auto; display: flex; flex-direction: column; min-height: 0;
        height: clamp(240px, 44dvh, 420px);
      }
      /* A drawer covers the room anyway once it's open, so the sliver of
         room art left above it (see JS: .picker gets .drawer-open) is dead
         weight — collapse it and let the drawer take the whole picker.
         (The preview above it shrinks instead, via .canvas-wrap below, so
         there's still more room for this without the drawer itself needing
         a hard cap — a capped drawer here just left dead black space.) */
      .picker.drawer-open .room { flex: 0 0 0; min-height: 0; }
      .picker.drawer-open .room-panel {
        flex: 1; height: auto;
      }
      .room-panel-head { flex: 0 0 auto; padding: 10px 12px 0; }
      /* JS moves the live #stack canvas in here while a drawer is open (see
         openRoomPanel/closeRoomPanel) — a real reflow-independent thumbnail
         beats fighting the .stage flex-shrink math to keep it visible under
         the drawer. */
      .drawer-preview {
        display: block; flex: 0 0 auto; width: 40px; height: 40px;
        border-radius: 10px; overflow: hidden; border: 0.5px solid var(--pf-line-dark);
      }
      #drawerPreview .canvas-wrap { width: 40px; border-radius: 10px; border: none; }
      .room-panel-body { flex: 1; min-height: 0; }
      .picker-bar { flex: 0 0 auto; padding: 9px 12px; }
      .grid {
        flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        gap: 8px; padding: 10px;
      }
      .picker-foot { display: none; }
    }

    /* Between ~600-860px (the desktop-sheet embed in world.html, which is
       up to 760px wide) there's enough room for the avatar/button column
       and the room to sit side by side instead of stacking into that
       compact header + full-width room arrangement above — same idea as
       the desktop grid, just narrower, and still inside the same dark
       app-shell theme as the rest of this breakpoint. */
    @media (min-width: 601px) and (max-width: 860px) {
      .studio { flex-direction: row; }
      .stage {
        flex: 0 0 230px; width: 230px; max-width: none;
        flex-direction: column; align-items: stretch; flex-wrap: nowrap;
        justify-content: center;
      }
      .canvas-wrap { width: 100%; }
      .actions { flex: 0 0 auto; flex-wrap: wrap; overflow-x: visible; }
      .btn { flex: 1 1 40%; }
      .picker { flex: 1; min-width: 0; }
    }
    /* Narrowest windows (the desktop-icon modal can go down to 300px) need
       tighter columns still — kept last so it always wins over the two
       broader mobile blocks above at these widths. */
    @media (max-width: 420px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); }
    }

    /* ---------- mobile: trollface.io/city font + color scheme ----------
       Scoped to the phone breakpoint only — desktop keeps the Apple/DM Sans
       look. Matches TROLLWORLD's palette: pure black chrome, mint-green
       accent, Space Grotesk body copy, Archivo Black display type, Rubik
       mono labels, translucent glass panels. */
    @media (max-width: 860px) {
      :root {
        --pf-bg: #000000;
        --pf-panel: #0a0a0b;
        --pf-panel-2: #000000;
        --pf-ink: #ffffffeb;
        --pf-muted: #ffffff8c;
        --pf-line: rgba(255, 255, 255, 0.14);
        --pf-line-dark: rgba(255, 255, 255, 0.14);
        --pf-accent: #8fe36a;
        --pf-sans: 'Space Grotesk', system-ui, Arial, sans-serif;
        --pf-mono: 'Rubik', system-ui, Arial, sans-serif;
      }
      body { background: #000; }
      .brand h1 {
        font-family: 'Archivo Black', 'Impact', 'Arial Black', sans-serif;
        font-weight: 400; text-transform: uppercase; letter-spacing: 0.02em;
      }
      .brand p, .stage-meta, .note, .count, .picker-foot { color: var(--pf-muted); }
      .picker {
        background: rgba(6,6,8,0.82);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
      }
      .picker-bar, .picker-foot, .order-bar { background: rgba(255,255,255,0.03); }
      .order-bar .order-btn { background: rgba(255,255,255,0.06); color: var(--pf-ink); }
      .order-bar .order-btn:hover { border-color: var(--pf-accent); color: var(--pf-accent); }
      .order-bar .order-btn.is-active { background: var(--pf-accent); color: #06210f; }
      .room-panel-close:hover { background: rgba(255,255,255,0.08); }
      .search { background: rgba(255,255,255,0.06); color: var(--pf-ink); }
      .search::placeholder { color: var(--pf-muted); }
      .cell { background: rgba(255,255,255,0.04); }
      .cell .label { color: var(--pf-ink); }
      .cell .thumb {
        background:
          linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%),
          linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%),
          #0a0a0b;
        background-size: 14px 14px; background-position: 0 0, 7px 7px;
      }
      .btn-swap { background: rgba(255,255,255,0.06); color: var(--pf-ink); }
      .btn-swap:hover { border-color: var(--pf-accent); color: var(--pf-accent); }
      .btn-save { color: #06210f; }
      .btn-signin { color: #06210f; }
      .canvas-wrap { background-color: #0a0a0b; }
      .canvas-wrap {
        background-image:
          linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%),
          linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%);
        background-size: 22px 22px; background-position: 0 0, 11px 11px;
      }
      .cell[aria-pressed="true"] { box-shadow: 0 0 0 2px rgba(143, 227, 106, 0.32); }
      body {
        background:
          radial-gradient(circle at 12% -10%, rgba(143, 227, 106, 0.16), transparent 42%),
          radial-gradient(circle at 88% 4%, rgba(143, 227, 106, 0.08), transparent 38%),
          #000;
      }
    }
  </style>
</head>
<body>
  <div class="space" aria-hidden="true"><canvas id="stars"></canvas></div>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div>
          <h1>PFP Studio</h1>
        </div>
      </div>
      <div class="top-actions">
        <div id="presence-mount"></div>
        <button class="btn-admin-bugs" id="btn-admin-bugs" type="button" aria-label="Bug reports (admin)" title="Bug reports (admin)">
          🐛 Bug reports<span class="badge" id="adminBugsBadge" hidden>0</span>
        </button>
        <button class="btn-signin" id="btn-signin" type="button">Log in</button>
        <button class="btn-home" id="btn-home" type="button" aria-label="Home" title="Home">🏠</button>
      </div>
    </header>

    <main class="studio">
      <section class="stage" aria-label="Preview">
        <div class="canvas-wrap" id="stack"></div>

        <div class="stage-meta">
          <span id="summary">Loading traits…</span>
          <span class="meta-count"><b id="trait-total">—</b> traits</span>
        </div>

        <div class="actions">
          <button class="btn" id="btn-back" type="button" disabled aria-label="No previous look yet" title="No previous look yet"><span class="btn-ic" aria-hidden="true">←</span><span class="btn-label">Previous</span></button>
          <button class="btn" id="btn-surprise" type="button" aria-label="Randomize" title="Randomize"><span class="btn-ic" aria-hidden="true">🎲</span><span class="btn-label">Randomize</span></button>
          <button class="btn" id="btn-reset" type="button" aria-label="Reset" title="Reset"><span class="btn-ic" aria-hidden="true">↺</span><span class="btn-label">Reset</span></button>
          <button class="btn btn-primary" id="btn-download" type="button" aria-label="Share or download" title="Share or download"><span class="btn-ic" aria-hidden="true">🔁</span><span class="btn-label">Share or download</span></button>
          <button class="btn btn-save" id="btn-save" type="button" aria-label="Save as my profile picture" title="Save as my profile picture"><span class="btn-ic" aria-hidden="true">💾</span><span class="btn-label">Save as my profile picture</span></button>
        </div>

        <p class="note" id="note" role="status" aria-live="polite"></p>
      </section>

      <section class="picker" aria-label="Trait picker">
        <div class="room" id="room">
          <!-- Idle shot: the whole room dark and quiet. Every alternate below
               is the same camera with one piece of furniture lit up, stacked
               on top at opacity 0 and cross-faded in while its hotspot is
               hovered/focused (or its drawer is open), so the room reads as
               a single photo reacting to the cursor rather than a slideshow. -->
          <img class="room-bg" id="roomBgIdle" src="assets/images/world/trollpfproom.jpeg" alt="A messy gamer bedroom at night: bookshelf, closed wardrobe, TV and a backpack on the floor.">
          <img class="room-bg room-bg-alt" fetchpriority="low" decoding="async" data-room-shot="base" src="assets/images/world/trollpfproombooks.png" alt="" aria-hidden="true">
          <img class="room-bg room-bg-alt" fetchpriority="low" decoding="async" data-room-shot="headwear" src="assets/images/world/trollpfproomboxes.png" alt="" aria-hidden="true">
          <img class="room-bg room-bg-alt" fetchpriority="low" decoding="async" data-room-shot="outfit" src="assets/images/world/trollpfproomopen.png" alt="" aria-hidden="true">
          <img class="room-bg room-bg-alt" fetchpriority="low" decoding="async" data-room-shot="accessory" src="assets/images/world/trollpfproombackpack.png" alt="" aria-hidden="true">
          <!-- Background/TV is the one hotspot with more than one lit frame:
               these three cycle on a timer to fake a screen flickering. -->
          <img class="room-bg room-bg-alt" fetchpriority="low" decoding="async" data-room-shot="background" data-tv-frame src="assets/images/world/trollpfproomtvblue.png" alt="" aria-hidden="true">
          <img class="room-bg room-bg-alt" fetchpriority="low" decoding="async" data-room-shot="background" data-tv-frame src="assets/images/world/trollpfproomtvred.png" alt="" aria-hidden="true">
          <img class="room-bg room-bg-alt" fetchpriority="low" decoding="async" data-room-shot="background" data-tv-frame src="assets/images/world/trollpfptvgreen.png" alt="" aria-hidden="true">

          <button type="button" class="hotspot" data-layer="base" data-base-label="Base — bookshelf"
            style="left:3%; top:12%; width:21%; height:45%;">
            <span class="hotspot-label">Base</span>
          </button>
          <button type="button" class="hotspot" data-layer="headwear" data-base-label="Headwear — pile on the wardrobe"
            style="left:42%; top:2%; width:20%; height:10%;">
            <span class="hotspot-label">Headwear</span>
          </button>
          <button type="button" class="hotspot" data-layer="outfit" data-base-label="Outfit — wardrobe"
            style="left:40%; top:13%; width:23%; height:42%;">
            <span class="hotspot-label">Outfit</span>
          </button>
          <button type="button" class="hotspot" data-layer="background" data-base-label="Background — TV"
            style="left:7%; top:53%; width:43%; height:43%;">
            <span class="hotspot-label">Background</span>
          </button>
          <button type="button" class="hotspot" data-layer="accessory" data-base-label="Accessory — backpack"
            style="left:81%; top:80%; width:14%; height:14%;">
            <span class="hotspot-label">Accessory</span>
          </button>
        </div>

        <p class="room-caption">Customize your troll intentionally above here</p>

        <div class="room-panel" id="roomPanel" hidden>
          <div class="room-panel-head">
            <div class="drawer-preview" id="drawerPreview" aria-hidden="true"></div>
            <h2 id="roomPanelTitle"></h2>
            <button type="button" class="room-panel-close" id="roomPanelClose" aria-label="Close this drawer">✕</button>
          </div>
          <div class="room-panel-body" id="roomPanelBody">
            <div class="room-panel-main">
              <div class="picker-bar">
                <input class="search" id="search" type="search" placeholder="Search traits…" aria-label="Search traits in this layer">
                <span class="count" id="count"></span>
              </div>
              <div class="order-bar" id="orderBar" hidden></div>
              <div class="grid" id="grid" role="region"></div>
            </div>
          </div>
        </div>
      </section>
