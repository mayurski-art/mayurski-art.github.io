<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://mayurski-art.github.io https://trollrunner.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://tjsyhfplxjtakdfkpdtg.supabase.co wss://tjsyhfplxjtakdfkpdtg.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PFP Studio — Troll Runner</title>
  <meta name="description" content="Build your own troll profile picture from Swish's trait set — background, base, outfit, headwear and accessories.">
  <!-- Matches world.html's standalone-mode meta exactly. Without these, iOS
       treats the hop from the home-screen app into this page as leaving the
       installed app and drops the visitor into a chromed Safari view (URL
       bar, Done button) instead of continuing the app-like navigation —
       that's the "browser popping up" flash between the two pages. -->
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TROLLRUNNER">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/images/icons/app/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Opts into the native cross-document view transition when arriving
       from/leaving to world.html — that page enables the matching rule
       unconditionally now that PFP Studio is a real navigation instead of
       an in-page sheet. Both documents need this rule for the crossfade to
       fire; unsupported browsers just navigate instantly. */
    @view-transition { navigation: auto; }

    :root {
      --pf-bg: #1c1c1e;
      --pf-panel: #f5f5f7;
      --pf-panel-2: #f2efe9;
      --pf-ink: #1c1c1e;
      --pf-muted: #6e6e73;
      --pf-line: rgba(0, 0, 0, 0.14);
      --pf-line-dark: rgba(255, 255, 255, 0.16);
      --pf-accent: #5856d6;
      --pf-green: #34c759;
      --pf-orange: #ff9500;
      --pf-share: #00ba7c;
      --pf-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --pf-mono: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--pf-sans);
      color: #f5f5f7;
      background: #000000;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--pf-orange); outline-offset: 2px; }

    /* Same starfield as trollrunner.net's home page, behind the studio
       card so it reads as a panel over the main site. */
    .space { position: fixed; inset: 0; z-index: 0; background: #000; pointer-events: none; }
    .space canvas { display: block; width: 100%; height: 100%; }
    .wrap { position: relative; z-index: 1; max-width: min(97vw, 1760px); margin: 0 auto; padding: 16px 16px 28px; }

    /* Above the phone breakpoint the studio card is shorter than a
       maximized desktop window, so center it instead of pinning it to the
       top and leaving a dead void underneath. */
    @media (min-width: 861px) {
      body { display: flex; }
      .wrap { width: 100%; max-width: min(90vw, 1600px); margin: auto; }
    }

    /* ---------- header ---------- */
    .top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
    .brand p { margin: 2px 0 0; font-size: 13px; color: #9b9ba1; }
    /* Closes whatever trait drawer is open and returns to the plain room
       view, same as landing here fresh. Deliberately stays inside the
       studio rather than leaving the page: an off-site link here
       re-triggers the phone entrance's own boot/lock sequence, which reads
       as a broken reload rather than "going back". */
    button.btn-home {
      width: 36px; height: 36px; flex: none;
      display: flex; align-items: center; justify-content: center;
      border: 0.5px solid var(--pf-line-dark); border-radius: 10px;
      background: rgba(255, 255, 255, 0.05); color: #d9d9e0;
      font-size: 16px; line-height: 1;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    button.btn-home:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--pf-line-dark); }
    .top-actions { display: flex; align-items: center; gap: 10px; flex: none; }
    /* Hidden until updateAuthUI() sets it to "Log in" or the account pill —
       see JS. Save-as-profile silently no-ops for guests otherwise, with no
       hint why; the "Log in" state is the "you'll need an account" nudge. */
    .btn-signin {
      display: none; height: 36px; padding: 0 15px; border-radius: 10px;
      border: 0.5px solid transparent; background: var(--pf-accent); color: #fff;
      font-family: var(--pf-sans); font-size: 13px; font-weight: 600; white-space: nowrap;
      transition: background 0.15s ease;
    }
    .btn-signin.is-visible { display: inline-flex; align-items: center; justify-content: center; }
    .btn-signin:hover { background: #6a68e0; }
    /* Logged-in state: same button, swapped to an avatar + username pill
       that opens the real trollrunner.net profile modal (openProfile()). */
    .btn-signin.is-account {
      padding: 0 14px 0 4px; gap: 8px; background: rgba(255, 255, 255, 0.06);
      border-color: var(--pf-line-dark); color: #e7e7ec;
    }
    .btn-signin.is-account:hover { background: rgba(255, 255, 255, 0.1); }
    .btn-signin.is-account img {
      width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
      display: block; background: #000;
    }

    /* ---------- layout ---------- */
    .studio { display: grid; grid-template-columns: minmax(0, 456px) minmax(0, 1fr); gap: 18px; align-items: start; }

    /* ---------- stage ---------- */
    .stage {
      border-radius: 18px; padding: 0 12px 12px;
      position: sticky; top: 16px;
    }
    .canvas-wrap {
      position: relative; width: 100%; aspect-ratio: 1 / 1;
      border-radius: 14px; overflow: hidden;
      border: 0.5px solid var(--pf-line-dark);
      /* checkerboard shows through when no background trait is picked */
      background-color: #e8e8ea;
      background-image:
        linear-gradient(45deg, #d3d3d8 25%, transparent 25%, transparent 75%, #d3d3d8 75%),
        linear-gradient(45deg, #d3d3d8 25%, transparent 25%, transparent 75%, #d3d3d8 75%);
      background-size: 22px 22px;
      background-position: 0 0, 11px 11px;
    }
    .canvas-wrap img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; display: none;
    }
    .canvas-wrap img.is-on { display: block; }

    /* The trait list grows to five names, so it wraps on its own line rather
       than colliding with the counter pinned on the right. */
    .stage-meta {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 14px; margin: 13px 2px 0; font-family: var(--pf-mono); font-size: 11.5px;
      color: #9b9ba1; line-height: 1.45;
    }
    .stage-meta #summary { min-width: 0; flex: 1; overflow-wrap: anywhere; }
    .stage-meta .meta-count { flex: none; white-space: nowrap; }
    .stage-meta b { color: #f5f5f7; font-weight: 500; }

    /* One icon-only toolbar row instead of a tall stack of labeled buttons
       — the labels were most of the vertical space this card spent on
       chrome instead of on the actual preview image. Tooltips (title/
       aria-label, already on every button) carry the meaning instead. */
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
    .btn {
      flex: 1 1 0; min-width: 40px;
      border: 0.5px solid var(--pf-line-dark); border-radius: 11px;
      background: rgba(255, 255, 255, 0.08); color: #f5f5f7;
      padding: 11px; font-size: 13.5px; font-weight: 500;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.14); }
    .btn:active { transform: translateY(1px); }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
    /* Share/download is the button most visitors actually want — give it
       its own fixed brand color (not the shifting --pf-accent, which turns
       mint-green on mobile and would blend into btn-save) plus a glow so
       it reads as the obvious next step, not just another toolbar icon.
       Retweet-green + a repost-style icon, like X's retweet button. */
    .btn.btn-primary {
      background: var(--pf-share); border-color: transparent;
      box-shadow: 0 3px 14px rgba(0, 186, 124, 0.45);
    }
    .btn.btn-primary:hover { background: #00d68f; }
    .btn-save { background: var(--pf-green); border-color: transparent; color: #06210f; }
    .btn-save:hover { background: #45d76a; }
    .btn-label { display: none; }

    .note {
      margin: 11px 2px 0; font-size: 12.5px; line-height: 1.45; color: #9b9ba1; min-height: 1.2em;
    }
    .note.is-ok { color: #6ee08a; }
    .note.is-err { color: #ff8f9a; }

    /* ---------- share modal ----------
       Body background is always the dark shell (mobile just swaps the shade
       of black), so this card doesn't need a separate light variant the way
       .picker does. */
    .share-modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .share-modal[hidden] { display: none; }
    .share-modal-backdrop {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .share-modal-card {
      position: relative; z-index: 1; width: min(360px, 100%);
      background: linear-gradient(165deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 38%, rgba(0,0,0,0.3) 100%), #131316;
      border: 0.5px solid var(--pf-line-dark); border-radius: 20px;
      padding: 20px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column; gap: 14px;
    }
    .share-modal-close {
      position: absolute; top: 12px; right: 12px; border: none;
      background: rgba(255, 255, 255, 0.08); color: #f5f5f7;
      width: 30px; height: 30px; border-radius: 50%; font-size: 13px; line-height: 1;
    }
    .share-modal-close:hover { background: rgba(255, 255, 255, 0.16); }
    .share-modal-card h2 { margin: 0; padding-right: 30px; font-size: 16px; font-weight: 700; color: #f5f5f7; }
    .share-modal-preview {
      aspect-ratio: 1 / 1; border-radius: 14px; overflow: hidden;
      border: 0.5px solid var(--pf-line-dark); background-color: #0a0a0b;
      background-image:
        linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%),
        linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%);
      background-size: 22px 22px; background-position: 0 0, 11px 11px;
    }
    .share-modal-preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .share-modal-note { margin: 0; font-size: 12px; color: #9b9ba1; min-height: 1.2em; text-align: center; }
    .share-modal-note.is-ok { color: #6ee08a; }
    .share-modal-note.is-err { color: #ff8f9a; }
    .share-modal-actions { display: flex; gap: 10px; }
    .share-btn {
      flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px; border-radius: 12px; border: 0.5px solid var(--pf-line-dark);
      font-size: 13.5px; font-weight: 600; background: rgba(255, 255, 255, 0.08); color: #f5f5f7;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .share-btn:hover { background: rgba(255, 255, 255, 0.16); }
    .share-btn:active { transform: translateY(1px); }
    .share-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
    .share-btn-ic { font-size: 15px; }
    .share-btn-x { background: #fff; color: #000; border-color: transparent; }
    .share-btn-x:hover { background: #e6e6e6; }
    .share-btn-download { background: var(--pf-accent); border-color: transparent; }
    .share-btn-download:hover { background: #6a68e0; }

    /* ---------- auth modal ---------- */
    .auth-field { display: flex; flex-direction: column; gap: 5px; text-align: left; }
    .auth-field[hidden] { display: none; }
    .auth-field label { font-size: 12px; color: #9b9ba1; }
    .auth-field input {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 0.5px solid var(--pf-line-dark); background: rgba(255, 255, 255, 0.06);
      color: #f5f5f7; font-family: var(--pf-sans); font-size: 14px;
    }
    .auth-field input:focus { outline: 2px solid var(--pf-accent); outline-offset: 1px; }
    .auth-swap { background: transparent; border-color: transparent; color: #9b9ba1; }
    .auth-swap:hover { background: transparent; color: #f5f5f7; }

    /* ---------- picker ---------- */
    .picker {
      background: var(--pf-panel); color: var(--pf-ink);
      border: 0.5px solid var(--pf-line); border-radius: 18px;
      overflow: hidden; box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
    }

    /* ---------- room hotspot picker ---------- */
    .room {
      position: relative; width: 100%; aspect-ratio: 2047 / 1180;
      overflow: hidden; background: #0a0a10;
    }
    .room-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .room-bg.room-bg-alt { opacity: 0; transition: opacity 0.35s ease; }
    .room-bg.room-bg-alt.is-visible { opacity: 1; }
    .hotspot {
      position: absolute; border: none; background: transparent;
      border-radius: 10px; padding: 0;
    }
    .hotspot.is-set::after {
      content: ''; position: absolute; top: 7px; right: 7px; width: 10px; height: 10px;
      border-radius: 50%; background: var(--pf-green);
      box-shadow: 0 0 0 2px rgba(10, 10, 16, 0.8), 0 0 0 0 rgba(52, 199, 89, 0.9);
      animation: pf-hotspot-pulse 1.3s ease-out infinite;
    }
    /* Ring spread is capped at 8px, not the more dramatic 12px it started
       at — the headwear and accessory dots sit close enough to the room's
       clipped edge (~11px, see .room's overflow: hidden) that a wider ring
       was getting cut off there and reading as "not pulsing" on the
       shorter mobile room. */
    @keyframes pf-hotspot-pulse {
      0% { box-shadow: 0 0 0 2px rgba(10, 10, 16, 0.8), 0 0 0 0 rgba(52, 199, 89, 0.9); transform: scale(1); }
      50% { box-shadow: 0 0 0 2px rgba(10, 10, 16, 0.8), 0 0 0 8px rgba(52, 199, 89, 0); transform: scale(1.15); }
      100% { box-shadow: 0 0 0 2px rgba(10, 10, 16, 0.8), 0 0 0 8px rgba(52, 199, 89, 0); transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hotspot.is-set::after { animation: none; }
    }
    .hotspot-label {
      position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -7px);
      background: rgba(18, 14, 10, 0.92); color: #fff; font-family: var(--pf-mono);
      font-size: 11px; padding: 4px 9px; border-radius: 7px; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.15s ease;
    }
    .hotspot:hover .hotspot-label, .hotspot:focus-visible .hotspot-label { opacity: 1; }
    /* Headwear sits right at the top edge of the room photo, so its label
       has no room to pop up above the button like the others do — the
       room's overflow:hidden was clipping it off-screen. Drop it below
       the button instead. */
    .hotspot[data-layer="headwear"] .hotspot-label { bottom: auto; top: 100%; transform: translate(-50%, 7px); }

    .room-caption {
      margin: 0; padding: 9px 14px; background: var(--pf-bg); color: #fff;
      font-family: var(--pf-sans); font-size: 12.5px; text-align: center; display: block;
    }

    .room-panel[hidden] { display: none; }
    .room-panel-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 13px 14px 0;
    }
    .room-panel-head h2 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; min-width: 0; }
    /* Live avatar thumbnail pinned in the drawer header — desktop already
       shows the full preview beside the drawer, so this only exists on the
       mobile breakpoint where the drawer covers it (see below). */
    .drawer-preview { display: none; }
    .room-panel-close {
      border: none; background: transparent; color: var(--pf-muted);
      font-size: 15px; line-height: 1; padding: 6px 9px; border-radius: 8px;
    }
    .room-panel-close:hover { background: rgba(0, 0, 0, 0.06); color: var(--pf-ink); }

    /* The whole drawer sits on the room photo for that layer instead of a
       small cropped strip — background-size stays "contain" so the full
       shot is visible (nothing sliced off), except "base" which is allowed
       to crop via .is-cover. Individual trait cards keep their own solid
       white background (.cell), so items stay readable over a busy photo;
       only the canvas around them changes. */
    .room-panel-body {
      display: flex; min-height: 0; position: relative;
      background-color: #0a0a10; background-repeat: no-repeat; background-position: center;
      background-size: contain;
    }
    .room-panel-body.is-cover { background-size: cover; }
    .room-panel-main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }

    .picker-bar {
      display: flex; gap: 9px; padding: 12px 14px; align-items: center; border-bottom: 0.5px solid var(--pf-line);
      background: rgba(245, 245, 247, 0.86);
      backdrop-filter: blur(10px) saturate(160%); -webkit-backdrop-filter: blur(10px) saturate(160%);
    }
    .search {
      flex: 1; min-width: 0; border: 0.5px solid var(--pf-line); border-radius: 10px;
      padding: 9px 12px; background: #fff; color: var(--pf-ink); font-size: 13.5px;
    }
    .search::placeholder { color: #a1a1a8; }
    .count { font-family: var(--pf-mono); font-size: 11.5px; color: var(--pf-muted); white-space: nowrap; }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 8px; padding: 12px; max-height: 62vh; overflow: auto;
      scrollbar-width: thin; scrollbar-color: rgba(0, 0, 0, 0.22) transparent;
    }
    .grid::-webkit-scrollbar { width: 7px; }
    .grid::-webkit-scrollbar-track { background: transparent; }
    .grid::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.18); border-radius: 999px; }
    .grid::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.3); }
    .cell {
      border: 0.5px solid var(--pf-line); border-radius: 12px;
      background: #fff; padding: 7px; text-align: center;
      display: flex; flex-direction: column; gap: 6px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
    }
    .cell:hover { border-color: #b9b9c2; transform: translateY(-1px); }
    .cell[aria-pressed="true"] {
      border-color: var(--pf-accent); box-shadow: 0 0 0 2px rgba(88, 86, 214, 0.28);
    }
    .cell .thumb {
      width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; object-fit: contain;
      background:
        linear-gradient(45deg, #ececf0 25%, transparent 25%, transparent 75%, #ececf0 75%),
        linear-gradient(45deg, #ececf0 25%, transparent 25%, transparent 75%, #ececf0 75%),
        #f7f7f9;
      background-size: 14px 14px; background-position: 0 0, 7px 7px;
    }
    @media (min-width: 861px) {
      .cell { opacity: 0.69; transition: opacity 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease; }
      .cell:hover, .cell[aria-pressed="true"] { opacity: 1; }
    }
    .cell .label {
      font-size: 11.5px; line-height: 1.25; color: var(--pf-ink); text-align: center;
      overflow: hidden; min-height: 2.4em; max-height: 2.4em;
      display: flex; align-items: center; justify-content: center;
    }
    .cell[aria-pressed="true"] .label { font-weight: 700; }
    .cell .badge-solo {
      font-family: var(--pf-mono); font-size: 9.5px; color: #fff;
      background: var(--pf-accent); border-radius: 999px; padding: 2px 7px;
      align-self: center;
    }
    .locked {
      grid-column: 1 / -1; padding: 26px 18px; text-align: center;
      background: rgba(255, 255, 255, 0.9); border-radius: 12px;
    }
    .locked p { margin: 0 0 14px; color: var(--pf-muted); font-size: 13.5px; line-height: 1.5; }
    .btn-swap {
      border: 0.5px solid var(--pf-line); border-radius: 10px; background: #fff;
      color: var(--pf-ink); padding: 9px 15px; font-size: 13px; font-weight: 500;
    }
    .btn-swap:hover { border-color: var(--pf-accent); color: var(--pf-accent); }
    .cell-none .thumb {
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #b9b9c2;
    }
    .empty {
      padding: 30px 14px; text-align: center; color: var(--pf-muted); font-size: 13.5px;
      background: rgba(255, 255, 255, 0.9); border-radius: 12px; margin: 12px;
    }

    /* checkbox-ish toggle row under the grid */
    .picker-foot {
      padding: 11px 14px; border-top: 0.5px solid var(--pf-line);
      font-size: 12px; color: var(--pf-muted); background: var(--pf-panel-2);
    }

    @media (max-width: 860px) {
      .studio { grid-template-columns: 1fr; }
      .stage { position: static; max-width: 460px; margin: 0 auto; width: 100%; }
      .grid {
        max-height: none;
        grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
        gap: 8px; padding: 10px;
      }
    }

    /* ---------- mobile app-shell: no page scroll ----------
       Below 860px the four sections (preview, actions, room, drawer) used
       to just stack and the whole document scrolled. Instead the page is
       pinned to the viewport and only the trait grid inside the open
       drawer scrolls — everything else is sized to fit. The room image
       keeps its real aspect ratio (stretching it to fill the leftover flex
       height read as a badly cropped, too-tall photo and drifted the
       hotspots off their landmarks) and just sits at whatever height that
       ratio works out to, right below the header — any leftover space
       below it is inert until a drawer opens and takes it over. */
    @media (max-width: 860px) {
      html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
      body { display: flex; flex-direction: column; }
      .space { display: none; }
      .wrap {
        flex: 1; min-height: 0; width: 100%; margin: 0; max-width: none;
        display: flex; flex-direction: column;
        padding: 10px 10px calc(8px + env(safe-area-inset-bottom));
        overflow: hidden;
      }
      .top { flex: 0 0 auto; margin-bottom: 8px; }
      .brand h1 { font-size: 16px; }

      .studio { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: stretch; gap: 8px; }

      /* Top-down layout: the preview card grows to soak up whatever
         vertical space the room photo's fixed aspect ratio can't use
         (it used to sit as a tiny compact strip, leaving a dead gap below
         the room instead), then shrinks back out of the way once a trait
         drawer opens and the room needs the room back. See the
         .studio:has(.picker.drawer-open) override below. */
      .stage {
        flex: 1 1 auto; min-height: 0; max-width: none; margin: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 8px; padding: 10px 0;
        container-type: size; container-name: pfp-stage;
        background: none; border: 0; box-shadow: none;
      }
      /* container-type: size (below) is only needed for the full-size
         canvas's cqh-based width formula — once the drawer is open the
         canvas switches to a plain % width and no longer needs it. Leaving
         containment on here collapsed .stage's own height to near-zero
         (it can no longer size from content) while the canvas still
         rendered at its real size, so it visually floated up over the
         header instead of sitting in flow. */
      .studio:has(.picker.drawer-open) .stage { flex: 0 0 auto; padding: 6px; gap: 6px; container-type: normal; }
      /* Square avatar, so it can grow by height as freely as by width —
         min() picks whichever of the two is tighter, same idea as
         object-fit: contain but sizing the box itself. */
      .canvas-wrap {
        flex: 0 0 auto; width: min(100vw, calc(100cqh - 70px), 450px);
        margin-left: -10px; margin-right: -10px;
      }
      /* Once a trait drawer is open, the preview's job shifts from "the
         main event" to "quick confirmation while browsing" — shrink it way
         down so the grid (what you're actually scrolling/tapping) gets the
         vertical space instead. Still live-updates on every tap. */
      .studio:has(.picker.drawer-open) .canvas-wrap {
        width: min(30%, 120px); margin-left: 0; margin-right: 0;
      }
      .studio:has(.picker.drawer-open) .actions { display: none; }
      .stage-meta { display: none; }
      .actions {
        flex: 0 0 auto; width: 100%; display: flex; gap: 6px;
        margin-top: 0; overflow-x: auto; -webkit-overflow-scrolling: touch;
        scrollbar-width: none; padding-bottom: 2px;
      }
      .actions::-webkit-scrollbar { display: none; }
      .btn {
        flex: 1 1 0; padding: 9px 8px; white-space: nowrap;
      }
      .note {
        flex: 0 0 auto; width: 100%; margin: 0; min-height: 0; text-align: center;
      }
      .note:empty { display: none; }

      .picker { flex: 0 0 auto; min-height: 0; display: flex; flex-direction: column; }
      .picker.drawer-open { flex: 1 1 auto; }
      .room {
        flex: 0 0 auto; width: 100%; aspect-ratio: 2047 / 1180;
      }
      .room-caption { flex: 0 0 auto; }
      .room-panel {
        flex: 0 0 auto; display: flex; flex-direction: column; min-height: 0;
        height: clamp(240px, 44dvh, 420px);
      }
      /* A drawer covers the room anyway once it's open, so the sliver of
         room art left above it (see JS: .picker gets .drawer-open) is dead
         weight — collapse it and let the drawer take the whole picker.
         (The preview above it shrinks instead, via .canvas-wrap below, so
         there's still more room for this without the drawer itself needing
         a hard cap — a capped drawer here just left dead black space.) */
      .picker.drawer-open .room { flex: 0 0 0; min-height: 0; }
      .picker.drawer-open .room-panel {
        flex: 1; height: auto;
      }
      .room-panel-head { flex: 0 0 auto; padding: 10px 12px 0; }
      /* JS moves the live #stack canvas in here while a drawer is open (see
         openRoomPanel/closeRoomPanel) — a real reflow-independent thumbnail
         beats fighting the .stage flex-shrink math to keep it visible under
         the drawer. */
      .drawer-preview {
        display: block; flex: 0 0 auto; width: 40px; height: 40px;
        border-radius: 10px; overflow: hidden; border: 0.5px solid var(--pf-line-dark);
      }
      #drawerPreview .canvas-wrap { width: 40px; border-radius: 10px; border: none; }
      .room-panel-body { flex: 1; min-height: 0; }
      .picker-bar { flex: 0 0 auto; padding: 9px 12px; }
      .grid {
        flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        gap: 8px; padding: 10px;
      }
      .picker-foot { display: none; }
    }

    /* Between ~600-860px (the desktop-sheet embed in world.html, which is
       up to 760px wide) there's enough room for the avatar/button column
       and the room to sit side by side instead of stacking into that
       compact header + full-width room arrangement above — same idea as
       the desktop grid, just narrower, and still inside the same dark
       app-shell theme as the rest of this breakpoint. */
    @media (min-width: 601px) and (max-width: 860px) {
      .studio { flex-direction: row; }
      .stage {
        flex: 0 0 230px; width: 230px; max-width: none;
        flex-direction: column; align-items: stretch; flex-wrap: nowrap;
        justify-content: center;
      }
      .canvas-wrap { width: 100%; }
      .actions { flex: 0 0 auto; flex-wrap: wrap; overflow-x: visible; }
      .btn { flex: 1 1 40%; }
      .picker { flex: 1; min-width: 0; }
    }
    /* Narrowest windows (the desktop-icon modal can go down to 300px) need
       tighter columns still — kept last so it always wins over the two
       broader mobile blocks above at these widths. */
    @media (max-width: 420px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); }
    }

    /* ---------- mobile: trollface.io/city font + color scheme ----------
       Scoped to the phone breakpoint only — desktop keeps the Apple/DM Sans
       look. Matches TROLLWORLD's palette: pure black chrome, mint-green
       accent, Space Grotesk body copy, Archivo Black display type, Rubik
       mono labels, translucent glass panels. */
    @media (max-width: 860px) {
      :root {
        --pf-bg: #000000;
        --pf-panel: #0a0a0b;
        --pf-panel-2: #000000;
        --pf-ink: #ffffffeb;
        --pf-muted: #ffffff8c;
        --pf-line: rgba(255, 255, 255, 0.14);
        --pf-line-dark: rgba(255, 255, 255, 0.14);
        --pf-accent: #8fe36a;
        --pf-sans: 'Space Grotesk', system-ui, Arial, sans-serif;
        --pf-mono: 'Rubik', system-ui, Arial, sans-serif;
      }
      body { background: #000; }
      .brand h1 {
        font-family: 'Archivo Black', 'Impact', 'Arial Black', sans-serif;
        font-weight: 400; text-transform: uppercase; letter-spacing: 0.02em;
      }
      .brand p, .stage-meta, .note, .count, .picker-foot { color: var(--pf-muted); }
      .picker {
        background: rgba(6,6,8,0.82);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
      }
      .picker-bar, .picker-foot { background: rgba(255,255,255,0.03); }
      .room-panel-close:hover { background: rgba(255,255,255,0.08); }
      .search { background: rgba(255,255,255,0.06); color: var(--pf-ink); }
      .search::placeholder { color: var(--pf-muted); }
      .cell { background: rgba(255,255,255,0.04); }
      .cell .label { color: var(--pf-ink); }
      .cell .thumb {
        background:
          linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%),
          linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%),
          #0a0a0b;
        background-size: 14px 14px; background-position: 0 0, 7px 7px;
      }
      .btn-swap { background: rgba(255,255,255,0.06); color: var(--pf-ink); }
      .btn-swap:hover { border-color: var(--pf-accent); color: var(--pf-accent); }
      .btn-save { color: #06210f; }
      .btn-signin { color: #06210f; }
      .canvas-wrap { background-color: #0a0a0b; }
      .canvas-wrap {
        background-image:
          linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%),
          linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%);
        background-size: 22px 22px; background-position: 0 0, 11px 11px;
      }
      .cell[aria-pressed="true"] { box-shadow: 0 0 0 2px rgba(143, 227, 106, 0.32); }
      body {
        background:
          radial-gradient(circle at 12% -10%, rgba(143, 227, 106, 0.16), transparent 42%),
          radial-gradient(circle at 88% 4%, rgba(143, 227, 106, 0.08), transparent 38%),
          #000;
      }
    }
  </style>
</head>
<body>
  <div class="space" aria-hidden="true"><canvas id="stars"></canvas></div>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div>
          <h1>PFP Studio</h1>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn-signin" id="btn-signin" type="button">Log in</button>
        <button class="btn-home" id="btn-home" type="button" aria-label="Home" title="Home">🏠</button>
      </div>
    </header>

    <main class="studio">
      <section class="stage" aria-label="Preview">
        <div class="canvas-wrap" id="stack"></div>

        <div class="stage-meta">
          <span id="summary">Loading traits…</span>
          <span class="meta-count"><b id="trait-total">—</b> traits</span>
        </div>

        <div class="actions">
          <button class="btn" id="btn-back" type="button" disabled aria-label="No previous look yet" title="No previous look yet"><span class="btn-ic" aria-hidden="true">←</span><span class="btn-label">Previous</span></button>
          <button class="btn" id="btn-surprise" type="button" aria-label="Randomize" title="Randomize"><span class="btn-ic" aria-hidden="true">🎲</span><span class="btn-label">Randomize</span></button>
          <button class="btn" id="btn-reset" type="button" aria-label="Reset" title="Reset"><span class="btn-ic" aria-hidden="true">↺</span><span class="btn-label">Reset</span></button>
          <button class="btn btn-primary" id="btn-download" type="button" aria-label="Share or download" title="Share or download"><span class="btn-ic" aria-hidden="true">🔁</span><span class="btn-label">Share or download</span></button>
          <button class="btn btn-save" id="btn-save" type="button" aria-label="Save as my profile picture" title="Save as my profile picture"><span class="btn-ic" aria-hidden="true">💾</span><span class="btn-label">Save as my profile picture</span></button>
        </div>

        <p class="note" id="note" role="status" aria-live="polite"></p>
      </section>

      <section class="picker" aria-label="Trait picker">
        <div class="room" id="room">
          <!-- Idle shot: the whole room dark and quiet. Every alternate below
               is the same camera with one piece of furniture lit up, stacked
               on top at opacity 0 and cross-faded in while its hotspot is
               hovered/focused (or its drawer is open), so the room reads as
               a single photo reacting to the cursor rather than a slideshow. -->
          <img class="room-bg" id="roomBgIdle" src="assets/images/world/trollpfproom.jpeg" alt="A messy gamer bedroom at night: bookshelf, closed wardrobe, TV and a backpack on the floor.">
          <img class="room-bg room-bg-alt" fetchpriority="low" decoding="async" data-room-shot="base" src="assets/images/world/trollpfproombooks.png" alt="" aria-hidden="true">
          <img class="room-bg room-bg-alt" fetchpriority="low" decoding="async" data-room-shot="headwear" src="assets/images/world/trollpfproomboxes.png" alt="" aria-hidden="true">
          <img class="room-bg room-bg-alt" fetchpriority="low" decoding="async" data-room-shot="outfit" src="assets/images/world/trollpfproomopen.png" alt="" aria-hidden="true">
          <img class="room-bg room-bg-alt" fetchpriority="low" decoding="async" data-room-shot="accessory" src="assets/images/world/trollpfproombackpack.png" alt="" aria-hidden="true">
          <!-- Background/TV is the one hotspot with more than one lit frame:
               these three cycle on a timer to fake a screen flickering. -->
          <img class="room-bg room-bg-alt" fetchpriority="low" decoding="async" data-room-shot="background" data-tv-frame src="assets/images/world/trollpfproomtvblue.png" alt="" aria-hidden="true">
          <img class="room-bg room-bg-alt" fetchpriority="low" decoding="async" data-room-shot="background" data-tv-frame src="assets/images/world/trollpfproomtvred.png" alt="" aria-hidden="true">
          <img class="room-bg room-bg-alt" fetchpriority="low" decoding="async" data-room-shot="background" data-tv-frame src="assets/images/world/trollpfptvgreen.png" alt="" aria-hidden="true">

          <button type="button" class="hotspot" data-layer="base" data-base-label="Base — bookshelf"
            style="left:3%; top:12%; width:21%; height:45%;">
            <span class="hotspot-label">Base</span>
          </button>
          <button type="button" class="hotspot" data-layer="headwear" data-base-label="Headwear — pile on the wardrobe"
            style="left:42%; top:2%; width:20%; height:10%;">
            <span class="hotspot-label">Headwear</span>
          </button>
          <button type="button" class="hotspot" data-layer="outfit" data-base-label="Outfit — wardrobe"
            style="left:40%; top:13%; width:23%; height:42%;">
            <span class="hotspot-label">Outfit</span>
          </button>
          <button type="button" class="hotspot" data-layer="background" data-base-label="Background — TV"
            style="left:7%; top:53%; width:43%; height:43%;">
            <span class="hotspot-label">Background</span>
          </button>
          <button type="button" class="hotspot" data-layer="accessory" data-base-label="Accessory — backpack"
            style="left:81%; top:80%; width:14%; height:14%;">
            <span class="hotspot-label">Accessory</span>
          </button>
        </div>

        <p class="room-caption">Customize your troll intentionally above here</p>

        <div class="room-panel" id="roomPanel" hidden>
          <div class="room-panel-head">
            <div class="drawer-preview" id="drawerPreview" aria-hidden="true"></div>
            <h2 id="roomPanelTitle"></h2>
            <button type="button" class="room-panel-close" id="roomPanelClose" aria-label="Close this drawer">✕</button>
          </div>
          <div class="room-panel-body" id="roomPanelBody">
            <div class="room-panel-main">
              <div class="picker-bar">
                <input class="search" id="search" type="search" placeholder="Search traits…" aria-label="Search traits in this layer">
                <span class="count" id="count"></span>
              </div>
              <div class="grid" id="grid" role="region"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="share-modal" id="shareModal" hidden>
    <div class="share-modal-backdrop" id="shareModalBackdrop"></div>
    <div class="share-modal-card" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
      <button type="button" class="share-modal-close" id="shareModalClose" aria-label="Close">✕</button>
      <h2 id="shareModalTitle">Your troll is ready</h2>
      <div class="share-modal-preview">
        <img id="shareModalImg" alt="Your customized troll PFP">
      </div>
      <p class="share-modal-note" id="shareModalNote" role="status" aria-live="polite"></p>
      <div class="share-modal-actions">
        <button type="button" class="share-btn share-btn-x" id="btnShareX">
          <span class="share-btn-ic" aria-hidden="true">𝕏</span> Share on X
        </button>
        <button type="button" class="share-btn share-btn-download" id="btnShareDownload">
          <span class="share-btn-ic" aria-hidden="true">⬇</span> Download
        </button>
      </div>
    </div>
  </div>

  <div class="share-modal" id="authModal" hidden>
    <div class="share-modal-backdrop" id="authModalBackdrop"></div>
    <div class="share-modal-card" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
      <button type="button" class="share-modal-close" id="authModalClose" aria-label="Close">✕</button>
      <h2 id="authModalTitle">Sign in</h2>
      <p class="share-modal-note" id="authModalSub">Log in to save this as your trollrunner.net profile picture.</p>
      <form id="authForm" style="display: flex; flex-direction: column; gap: 12px;">
        <div class="auth-field">
          <label for="authId" id="authIdLabel">Username or email</label>
          <input id="authId" type="text" required autocomplete="username">
        </div>
        <div class="auth-field" id="authEmailField" hidden>
          <label for="authEmail">Email</label>
          <input id="authEmail" type="email" autocomplete="email">
        </div>
        <div class="auth-field">
          <label for="authPw">Password</label>
          <input id="authPw" type="password" required autocomplete="current-password">
        </div>
        <p class="share-modal-note" id="authMsg" role="status" aria-live="polite"></p>
        <button type="submit" class="share-btn share-btn-download" id="authSubmit">Sign in</button>
        <button type="button" class="share-btn auth-swap" id="authSwap">New here? Create an account</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.3" integrity="sha384-uVefCux0Kf6w34gQVv8+jUPUwvwFUdnrcwI1kOJHs7sfPPXdDDucwcrPrppD6oUe" crossorigin="anonymous"></script>
  <script src="assets/js/troll-accounts.js?v=20260821a"></script>
  <script>
  (() => {
    'use strict';

    const MANIFEST_URL = 'assets/data/pfp-traits.json';
    const STORE_KEY = 'trollrunner_pfp_build_v1';
    const SOLO_STASH_KEY = 'trollrunner_pfp_solo_stash_v1';
    // Layers that may legitimately be empty. Background and base are the
    // two that make a PFP read as a PFP, so they default to something.
    const OPTIONAL = new Set(['outfit', 'headwear', 'accessory']);
    // Every other layer is one trait at a time — a troll only wears one
    // outfit. Accessory and headwear are the exceptions: a handful of props
    // and hats/faces were drawn to sit together (a cigar in one hand,
    // chains around the neck; a cap over glasses), so up to two can be worn
    // at once per layer, but only pairs that were actually hand-checked to
    // not overlap or read as visual nonsense (two full pairs of glasses,
    // etc). MULTI_LAYERS is the set that gets that pairing behavior instead
    // of plain swap-on-click.
    const MULTI_LAYERS = new Set(['accessory', 'headwear']);
    const MULTI_LIMIT = 2;
    // A few traits are re-skins of another with the exact same fit — they
    // inherit that trait's whole compatibility list instead of duplicating
    // every pair below.
    const MULTI_ALIASES = {
      accessory: { spliff: 'cigar', 'super-soaker': 'palm-leaf', 'troll-sign': 'princess-bat' },
      headwear: {},
    };
    const canonicalTrait = (layerId, id) => MULTI_ALIASES[layerId]?.[id] || id;
    function pairSet(layerId, pairs) {
      return new Set(pairs.map(pair => pair.map(id => canonicalTrait(layerId, id)).sort().join('|')));
    }
    const CAP_IDS = ['cap-black', 'cap-blue', 'cap-green', 'cap-pink', 'cap-white', 'cap-yellow'];
    // Hand-approved trait pairs, per multi-select layer. Anything not
    // listed here is assumed to clash (two pairs of glasses, a hand full of
    // props) and is left as a straight swap rather than guessed at.
    const MULTI_PAIRS = {
      accessory: pairSet('accessory', [
        ['cigar', 'deal-w-it-shades'], ['cigar', 'demon-pack'], ['deal-w-it-shades', 'demon-pack'],
        ['cigar', 'diamond-hand'], ['deal-w-it-shades', 'diamond-hand'],
        ['candle', 'gold-chains'], ['candle', 'demon-pack'], ['candle', 'diamond-hand'], ['candle', 'middle-fingers'],
        ['cigar', 'gold-chains'], ['gold-chains', 'deal-w-it-shades'],
        ['gold-chains', 'diamond-hand'], ['demon-pack', 'gold-chains'], ['gold-chains', 'middle-fingers'],
        ['gold-chains', 'hotdog'], ['middle-fingers', 'demon-pack'], ['middle-fingers', 'deal-w-it-shades'],
        ['middle-fingers', 'cigar'], ['deal-w-it-shades', 'monster-can'], ['cigar', 'monster-can'],
        ['newspaper', 'gold-chains'], ['paintbrush', 'deal-w-it-shades'], ['paintbrush', 'cigar'],
        ['paintbrush', 'boxing-gloves'], ['boxing-gloves', 'gold-chains'], ['paintbrush', 'hotdog'],
        ['paintbrush', 'middle-fingers'], ['paintbrush', 'diamond-hand'], ['palm-leaf', 'cigar'],
        ['palm-leaf', 'gold-chains'], ['palm-leaf', 'deal-w-it-shades'], ['princess-bat', 'paintbrush'],
        ['princess-bat', 'gold-chains'], ['princess-bat', 'deal-w-it-shades'], ['princess-bat', 'cigar'],
        ['shovel', 'cigar'], ['shovel', 'gold-chains'], ['shovel', 'diamond-hand'], ['shovel', 'deal-w-it-shades'],
      ]),
      headwear: pairSet('headwear', [
        ['diamond-teeth', 'bushes'], ['headset', 'diamond-teeth'],
        ['1-golden-tooth', 'black-tooth'],
        ...CAP_IDS.map(cap => [cap, 'glasses']),
      ]),
    };
    function traitsCompatible(layerId, a, b) {
      if (a === b) return false;
      const key = [canonicalTrait(layerId, a), canonicalTrait(layerId, b)].sort().join('|');
      return MULTI_PAIRS[layerId]?.has(key) ?? false;
    }
    // Candle was only ever drawn at one angle, so pairings that need it
    // pointed a different way get that for free via a CSS/canvas transform
    // rather than new art: flipped for the two "in the other hand" pairs,
    // rotated upright for the vertical one.
    const CANDLE_FLIP_WITH = new Set(['demon-pack', 'diamond-hand']);
    const CANDLE_UPRIGHT_WITH = new Set(['middle-fingers']);
    function candleTransform(otherIds) {
      if (otherIds.some(id => CANDLE_UPRIGHT_WITH.has(id))) return 'rotate(90deg)';
      if (otherIds.some(id => CANDLE_FLIP_WITH.has(id))) return 'scaleX(-1)';
      return '';
    }
    // Paint order is normally just manifest layer order (background at the
    // back, accessory at the front), but a couple of specific traits need
    // to break that rule: the troll gang chain (an outfit trait) sits in
    // front of gold chains (an accessory trait) but both still sit behind
    // headwear, so a chain never clips through a hat/hair/bushes. Anything
    // not listed here just uses its layer's normal rank.
    const LAYER_RANK = { background: 0, base: 10, outfit: 20, headwear: 30, accessory: 40 };
    const RANK_OVERRIDES = { 'gold-chains': 25, 'troll-gang-chain': 26 };
    const rankFor = (layerId, id) => (id && RANK_OVERRIDES[id] != null) ? RANK_OVERRIDES[id] : LAYER_RANK[layerId];
    // Hand-shot photo of each hotspot's furniture, filled in as the whole
    // drawer's background. Every layer shows the full shot uncropped
    // (background-size: contain) except "base", which is allowed to crop
    // in tight for a punchier canvas since the wide shot doesn't read well
    // shrunk to fit.
    const CLOSEUPS = {
      base: { src: 'assets/images/world/pfp-base.png', pos: '50% 20%', fit: 'cover' },
      // Desktop shot is a wide panoramic shelf strip that reads fine in the
      // wide desktop drawer; that same aspect ratio letterboxes badly in the
      // narrow, roughly-square mobile drawer, so mobile gets its own tighter
      // square crop of the same wardrobe instead.
      headwear: { src: 'assets/images/world/pfp-headware.png', mobileSrc: 'assets/images/world/trollpfpheadware-mobile.jpg', fit: 'contain' },
      outfit: { src: 'assets/images/world/pfp-outfit.png', mobileSrc: 'assets/images/world/trollpfpoutfit-mobile.jpg', fit: 'contain' },
      background: { src: 'assets/images/world/pfp-background.png', mobileSrc: 'assets/images/world/trollpfpbackground-mobile.jpg', fit: 'contain' },
      accessory: { src: 'assets/images/world/trollpfp-accessoriesbigger.jpg', mobileSrc: 'assets/images/world/trollpfpaccesory-mobile.jpg', fit: 'contain' },
    };

    const el = {
      stack: document.getElementById('stack'),
      grid: document.getElementById('grid'),
      search: document.getElementById('search'),
      count: document.getElementById('count'),
      note: document.getElementById('note'),
      summary: document.getElementById('summary'),
      total: document.getElementById('trait-total'),
      roomShots: Array.from(document.querySelectorAll('.room-bg-alt')),
      tvFrames: Array.from(document.querySelectorAll('.room-bg-alt[data-tv-frame]')),
      picker: document.querySelector('.picker'),
      stage: document.querySelector('.stage'),
      studio: document.querySelector('.studio'),
      actions: document.querySelector('.actions'),
      drawerPreview: document.getElementById('drawerPreview'),
      roomPanel: document.getElementById('roomPanel'),
      roomPanelBody: document.getElementById('roomPanelBody'),
      roomPanelTitle: document.getElementById('roomPanelTitle'),
      roomPanelClose: document.getElementById('roomPanelClose'),
      hotspots: Array.from(document.querySelectorAll('.hotspot')),
      shareModal: document.getElementById('shareModal'),
      shareModalBackdrop: document.getElementById('shareModalBackdrop'),
      shareModalClose: document.getElementById('shareModalClose'),
      shareModalImg: document.getElementById('shareModalImg'),
      shareModalNote: document.getElementById('shareModalNote'),
      btnShareX: document.getElementById('btnShareX'),
      btnShareDownload: document.getElementById('btnShareDownload'),
      btnSignin: document.getElementById('btn-signin'),
      authModal: document.getElementById('authModal'),
      authModalTitle: document.getElementById('authModalTitle'),
      authModalBackdrop: document.getElementById('authModalBackdrop'),
      authModalClose: document.getElementById('authModalClose'),
      authForm: document.getElementById('authForm'),
      authIdLabel: document.getElementById('authIdLabel'),
      authId: document.getElementById('authId'),
      authEmailField: document.getElementById('authEmailField'),
      authEmail: document.getElementById('authEmail'),
      authPw: document.getElementById('authPw'),
      authMsg: document.getElementById('authMsg'),
      authSubmit: document.getElementById('authSubmit'),
      authSwap: document.getElementById('authSwap'),
    };

    let manifest = null;
    let activeLayer = null;
    /** @type {Record<string, string|string[]|null>} layer id -> trait id
     *  (null = none), except MULTI_LAYERS which hold a string[] instead. */
    let build = {};
    /** layer id -> <img>[] in the preview stack, in z-order. One entry for
     *  ordinary layers, MULTI_LIMIT entries (extras hidden when unused) for
     *  a multi layer. */
    const layerImg = new Map();
    /** Previous builds, oldest first. Randomize is one click away from losing
     *  a good troll forever, so every mutation is undoable. */
    const past = [];
    const HISTORY_LIMIT = 60;

    const fullSrc = (layer, trait) => `assets/pfp/${layer}/${trait}.webp`;
    const thumbSrc = (layer, trait) => `assets/pfp/${layer}/thumb/${trait}.webp`;
    const layerById = id => manifest.layers.find(l => l.id === id);
    const traitById = (layer, id) => layerById(layer)?.traits.find(t => t.id === id) || null;
    /** True if a layer's slot in `build` currently holds anything, whether
     *  that slot is a single id or (for MULTI_LAYERS) an array of them. */
    const hasValue = v => Array.isArray(v) ? v.length > 0 : !!v;
    /** Layer id -> array of trait ids, regardless of whether that layer is
     *  single- or multi-select. Lets rendering/export loops treat every
     *  layer the same way. */
    const idsFor = (layerId, v) => MULTI_LAYERS.has(layerId) ? (v || []) : (v ? [v] : []);

    /** Trims a multi-select layer's selection down to a valid one: known
     *  ids only, deduped, capped at MULTI_LIMIT, and every id compatible
     *  with every other id kept before it (so an incoming array is
     *  filtered in order — first pick always survives, later picks only
     *  survive if they pair with everything already kept). */
    function sanitizeMultiSet(layerId, ids) {
      const kept = [];
      for (const id of (ids || [])) {
        if (!traitById(layerId, id) || kept.includes(id)) continue;
        if (kept.length && !kept.every(k => traitsCompatible(layerId, k, id))) continue;
        kept.push(id);
        if (kept.length >= MULTI_LIMIT) break;
      }
      return kept;
    }

    function note(msg, kind) {
      el.note.textContent = msg || '';
      el.note.className = 'note' + (kind ? ` is-${kind}` : '');
    }

    /* ---------- build state ---------- */

    function defaultBuild() {
      const next = {};
      for (const layer of manifest.layers) {
        next[layer.id] = MULTI_LAYERS.has(layer.id) ? [] : (OPTIONAL.has(layer.id) ? null : (layer.traits[0]?.id ?? null));
      }
      // A plain dressed troll beats whatever happens to sort first — and a
      // fresh visitor should see all five hotspots already lit, not just
      // the three that happen to be required.
      const preferred = { background: 'holo', base: 'og', outfit: 'tee-black', headwear: 'cap-black', accessory: 'gold-chains' };
      for (const [id, want] of Object.entries(preferred)) {
        if (!traitById(id, want)) continue;
        next[id] = MULTI_LAYERS.has(id) ? [want] : want;
      }
      return next;
    }

    function randomBuild(all) {
      const next = {};
      for (const layer of manifest.layers) {
        const optional = OPTIONAL.has(layer.id);
        const multi = MULTI_LAYERS.has(layer.id);
        // Solo art wears nothing else, so rolling it would silently strip the
        // rest of the troll — leave it to be chosen deliberately.
        const pool = layer.traits.filter(t => !t.solo);
        // "Randomize" keeps a wearable silhouette; "full random" fills every slot.
        const skip = optional && !all && layer.id === 'accessory' && Math.random() < 0.5;
        if (skip || !pool.length) { next[layer.id] = multi ? [] : null; continue; }
        const pick = pool[Math.floor(Math.random() * pool.length)].id;
        next[layer.id] = multi ? [pick] : pick;
      }
      return next;
    }

    /** Drop trait ids that aren't in the manifest (renamed/removed art), then
     *  apply the solo rule. Builds arriving from localStorage or a shared link
     *  never went through setBuild(), so without enforceSolo() here a saved
     *  Ninja-plus-outfit combo loads straight past the rule and renders the
     *  broken troll it exists to prevent. */
    function sanitize(raw) {
      const next = {};
      for (const layer of manifest.layers) {
        if (MULTI_LAYERS.has(layer.id)) {
          const want = raw?.[layer.id];
          // Older saved builds (pre-multi-select) stored accessory as a
          // plain string — accept that shape too.
          const list = Array.isArray(want) ? want : (want ? [want] : []);
          next[layer.id] = sanitizeMultiSet(layer.id, list);
          continue;
        }
        const want = raw?.[layer.id];
        next[layer.id] = want && traitById(layer.id, want) ? want : null;
      }
      // Anything required that got dropped falls back to the default.
      const base = defaultBuild();
      for (const layer of manifest.layers) {
        if (MULTI_LAYERS.has(layer.id)) continue;
        if (!next[layer.id] && !OPTIONAL.has(layer.id)) next[layer.id] = base[layer.id];
      }
      return enforceSolo(next);
    }

    function readUrlBuild() {
      const params = new URLSearchParams(location.search);
      if (![...params.keys()].some(k => manifest.layers.some(l => l.id === k))) return null;
      const raw = {};
      for (const layer of manifest.layers) {
        const v = params.get(layer.id);
        if (MULTI_LAYERS.has(layer.id)) {
          raw[layer.id] = v && v !== 'none' ? v.split(',').filter(Boolean) : [];
          continue;
        }
        raw[layer.id] = v && v !== 'none' ? v : null;
      }
      return raw;
    }

    function persist() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(build)); } catch {}
    }

    /** Some art is a finished troll on its own (see `solo` in the manifest):
     *  a head at its own scale, or a character that already has an outfit.
     *  Layering clothes under those just looks broken, so while one is worn
     *  the optional layers are emptied and locked. */
    function soloTrait() {
      for (const layer of manifest.layers) {
        if (MULTI_LAYERS.has(layer.id)) continue; // multi-select layers never hold a solo trait
        const t = build[layer.id] && traitById(layer.id, build[layer.id]);
        if (t?.solo) return { layer, trait: t };
      }
      return null;
    }

    // Remembers the outfit/headwear/accessory a solo base wiped, so switching
    // back to a layerable base later restores them instead of leaving the
    // troll bare — see enforceSolo() below. Persisted so a reload mid-solo
    // doesn't drop it either.
    let soloStash = (() => {
      try { return JSON.parse(localStorage.getItem(SOLO_STASH_KEY) || 'null'); } catch { return null; }
    })();
    function persistSoloStash() {
      try {
        if (soloStash) localStorage.setItem(SOLO_STASH_KEY, JSON.stringify(soloStash));
        else localStorage.removeItem(SOLO_STASH_KEY);
      } catch {}
    }

    function enforceSolo(next) {
      const solo = manifest.layers.some(l => {
        const t = next[l.id] && traitById(l.id, next[l.id]);
        return t?.solo;
      });
      if (!solo) {
        if (!soloStash) return next;
        // Only fill slots the caller left empty — a trait picked in the same
        // action that turned solo off wins over whatever was stashed.
        const restored = { ...next };
        for (const id of OPTIONAL) {
          if (hasValue(restored[id])) continue;
          const stashed = soloStash[id];
          if (!hasValue(stashed)) continue;
          if (MULTI_LAYERS.has(id)) restored[id] = sanitizeMultiSet(id, stashed);
          else if (traitById(id, stashed)) restored[id] = stashed;
        }
        soloStash = null;
        persistSoloStash();
        return restored;
      }
      if (!soloStash) {
        soloStash = {};
        for (const id of OPTIONAL) if (hasValue(next[id])) soloStash[id] = next[id];
        persistSoloStash();
      }
      const clean = { ...next };
      for (const id of OPTIONAL) clean[id] = MULTI_LAYERS.has(id) ? [] : null;
      return clean;
    }

    /** The one way the build changes, so nothing can bypass the undo stack. */
    function setBuild(next, { record = true } = {}) {
      next = enforceSolo(next);
      if (record) {
        past.push({ ...build });
        if (past.length > HISTORY_LIMIT) past.shift();
      }
      build = next;
      persist();
      renderStack();
      renderGrid();
      syncHistory();
    }

    function stepBack() {
      const previous = past.pop();
      if (!previous) return;
      setBuild(previous, { record: false });
      note('');
    }

    function syncHistory() {
      const btn = document.getElementById('btn-back');
      if (!btn) return;
      btn.disabled = past.length === 0;
      const label = past.length
        ? `Go back to the previous look (${past.length} to step through)`
        : 'No previous look yet';
      btn.setAttribute('aria-label', label);
      btn.title = label;
    }

    function readStored() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch { return null; }
    }

    /* ---------- rendering ---------- */

    function renderStack() {
      const stackOrder = [];
      for (const layer of manifest.layers) {
        const imgs = layerImg.get(layer.id);
        if (!imgs) continue;
        const ids = idsFor(layer.id, build[layer.id]);
        imgs.forEach((img, i) => {
          const id = ids[i];
          stackOrder.push({ img, rank: rankFor(layer.id, id) });
          if (!id) { img.classList.remove('is-on'); img.alt = ''; img.style.transform = ''; return; }
          const src = fullSrc(layer.id, id);
          if (!img.src.endsWith(src)) img.src = src;
          img.classList.add('is-on');
          img.alt = `${layer.name}: ${traitById(layer.id, id)?.name || id}`;
          // Candle's the only trait that needs a geometry tweak depending on
          // what it's paired with — see candleTransform().
          img.style.transform = id === 'candle' ? candleTransform(ids.filter(x => x !== id)) : '';
        });
      }
      // Paint order is DOM order for these absolutely-positioned layers —
      // appendChild on an existing node moves it, so replaying every slot
      // in rank order (see RANK_OVERRIDES) keeps the stack in sync even
      // when a trait's visual front/back position differs from its layer's
      // normal spot.
      stackOrder.sort((a, b) => a.rank - b.rank);
      for (const { img } of stackOrder) el.stack.appendChild(img);

      const worn = manifest.layers
        .flatMap(l => idsFor(l.id, build[l.id]).map(id => traitById(l.id, id)?.name))
        .filter(Boolean);
      el.summary.textContent = worn.length ? worn.join(' · ') : 'Empty troll';
      renderHotspots();
    }

    /** Furniture hotspots stand in for the old tab strip: a lit outline on
     *  hover, a dot once something's equipped in that layer, and a highlight
     *  while its drawer is the one open. */
    function renderHotspots() {
      const panelOpen = !el.roomPanel.hidden;
      for (const btn of el.hotspots) {
        const id = btn.dataset.layer;
        const label = btn.dataset.baseLabel;
        const names = idsFor(id, build[id]).map(t => traitById(id, t)?.name).filter(Boolean);
        btn.classList.toggle('is-set', names.length > 0);
        btn.classList.toggle('is-active', panelOpen && activeLayer === id);
        btn.setAttribute('aria-label', names.length ? `${label} — ${names.join(' + ')} selected` : label);
      }
    }

    const isMobileLayout = () => window.matchMedia('(max-width: 860px)').matches;

    /** Mobile-only: room card on top, preview card below, with the action
     *  row lifted out from under the preview to sit between the two cards.
     *  Desktop keeps the original nesting (actions inside .stage, right
     *  before .note) — this just moves the same nodes back and forth. */
    function layoutForViewport() {
      if (isMobileLayout()) {
        if (el.actions.parentElement !== el.studio) {
          el.studio.insertBefore(el.picker, el.stage);
          el.studio.insertBefore(el.actions, el.stage);
        }
      } else if (el.actions.parentElement === el.studio) {
        el.stage.insertBefore(el.actions, el.note);
        el.studio.insertBefore(el.stage, el.picker);
      }
    }
    layoutForViewport();
    addEventListener('resize', layoutForViewport, { passive: true });

    function openRoomPanel(layerId) {
      if (activeLayer === layerId && !el.roomPanel.hidden) { closeRoomPanel(); return; }
      activeLayer = layerId;
      el.search.value = '';
      el.roomPanel.hidden = false;
      el.picker.classList.add('drawer-open');
      // On mobile the drawer covers the stage, so the live avatar moves into
      // the drawer header instead — same #stack element, so it keeps
      // updating live as traits are tapped without any extra sync code.
      if (isMobileLayout() && !el.drawerPreview.contains(el.stack)) {
        el.drawerPreview.appendChild(el.stack);
      }
      el.roomPanelTitle.textContent = layerById(layerId)?.name || layerId;
      const closeup = CLOSEUPS[layerId];
      if (closeup) {
        const src = (isMobileLayout() && closeup.mobileSrc) ? closeup.mobileSrc : closeup.src;
        el.roomPanelBody.style.backgroundImage = `url(${src})`;
        el.roomPanelBody.style.backgroundPosition = closeup.pos || 'center';
        el.roomPanelBody.classList.toggle('is-cover', closeup.fit === 'cover');
      }
      renderGrid();
      renderHotspots();
      updateRoomArt();
    }

    function closeRoomPanel() {
      activeLayer = null;
      el.roomPanel.hidden = true;
      el.picker.classList.remove('drawer-open');
      if (el.drawerPreview.contains(el.stack)) {
        el.stage.insertBefore(el.stack, el.stage.firstChild);
      }
      renderHotspots();
      updateRoomArt();
    }

    /* ---- room art ----
       Only ever one shot is lit at a time. Whichever drawer is open wins
       outright — hovering other furniture behind an open drawer shouldn't
       swap the shot out from under it. With no drawer open, hover (then
       keyboard focus) picks the shot instead. With none of them pointing
       anywhere the room falls back to the idle photo underneath, so moving
       off the furniture always lands you back on the same neutral shot. */
    let hoveredLayer = null;
    let focusedLayer = null;

    /** The shot the room should be showing, or null for the idle photo.
     *  While a drawer is open, that layer's furniture owns the room shot —
     *  hovering a different hotspot behind the drawer shouldn't steal it;
     *  only closing the drawer (or picking another one) lets go of it. */
    function currentShot() {
      if (activeLayer) return activeLayer;
      return hoveredLayer ?? focusedLayer ?? null;
    }

    function updateRoomArt() {
      const shot = currentShot();
      // The TV is a loop rather than a still, so it runs its own timer and
      // owns the visibility of its three frames — leave them alone here.
      for (const img of el.roomShots) {
        if (img.hasAttribute('data-tv-frame')) continue;
        img.classList.toggle('is-visible', img.dataset.roomShot === shot);
      }
      if (shot === 'background') startTvLoop(); else stopTvLoop();
    }

    // The TV cycles through its lit-up color frames while the background
    // hotspot is the live one — same cross-fade as every other shot, just
    // stepping between three of them instead of holding on one.
    let tvLoopTimer = null;
    function startTvLoop() {
      if (tvLoopTimer) return;
      let i = 0;
      const step = () => {
        el.tvFrames.forEach((img, n) => img.classList.toggle('is-visible', n === i));
        i = (i + 1) % el.tvFrames.length;
      };
      step();
      tvLoopTimer = window.setInterval(step, 1100);
    }
    function stopTvLoop() {
      window.clearInterval(tvLoopTimer);
      tvLoopTimer = null;
      el.tvFrames.forEach(img => img.classList.remove('is-visible'));
    }

    function renderGrid() {
      const layer = layerById(activeLayer);
      if (!layer) return;
      const q = el.search.value.trim().toLowerCase();
      const traits = q ? layer.traits.filter(t => t.name.toLowerCase().includes(q)) : layer.traits;

      el.grid.innerHTML = '';
      el.grid.setAttribute('aria-label', `${layer.name} traits`);
      el.count.textContent = q
        ? `${traits.length} of ${layer.traits.length}`
        : `${layer.traits.length} traits`;

      // A solo base owns the whole picture — offer the way out instead of a
      // grid of traits that would silently do nothing.
      const solo = soloTrait();
      if (solo && OPTIONAL.has(layer.id)) {
        const box = document.createElement('div');
        box.className = 'locked';
        const p = document.createElement('p');
        p.textContent = `${solo.trait.name} is a complete troll — it comes with its own look, so ${layer.name.toLowerCase()} is switched off.`;
        const swap = document.createElement('button');
        swap.type = 'button';
        swap.className = 'btn-swap';
        swap.textContent = 'Switch to a layerable base';
        swap.addEventListener('click', () => {
          const plain = layerById('base').traits.find(t => t.id === 'og' && !t.solo)
            || layerById('base').traits.find(t => !t.solo);
          setBuild({ ...build, base: plain?.id ?? null });
          note('');
        });
        box.append(p, swap);
        el.grid.appendChild(box);
        el.count.textContent = 'locked';
        return;
      }

      if (OPTIONAL.has(layer.id) && !q) {
        el.grid.appendChild(cell(layer, null));
      }
      for (const trait of traits) el.grid.appendChild(cell(layer, trait));

      if (!traits.length) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = `No ${layer.name.toLowerCase()} matches “${el.search.value.trim()}”.`;
        el.grid.appendChild(p);
      }
    }

    /** Click handler for a MULTI_LAYERS cell: toggle off if already worn,
     *  otherwise add it — replacing the current set instead of stacking if
     *  it doesn't pair with what's already worn (whitelist in
     *  MULTI_PAIRS), so a click never silently no-ops. */
    function toggleMulti(layerId, id) {
      const current = idsFor(layerId, build[layerId]);
      if (current.includes(id)) {
        setBuild({ ...build, [layerId]: current.filter(x => x !== id) });
        note('');
        return;
      }
      if (!current.length) {
        setBuild({ ...build, [layerId]: [id] });
        note('');
        return;
      }
      if (current.length < MULTI_LIMIT && current.every(k => traitsCompatible(layerId, k, id))) {
        setBuild({ ...build, [layerId]: [...current, id] });
        note('');
        return;
      }
      // Doesn't pair with the current set — swap it in on its own rather
      // than silently doing nothing or stacking a clashing combo.
      const dropped = traitById(layerId, current[0])?.name || 'that';
      setBuild({ ...build, [layerId]: [id] });
      note(`${dropped} and ${traitById(layerId, id)?.name} clash, so it swapped in on its own.`);
    }

    function cell(layer, trait) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cell' + (trait ? '' : ' cell-none');
      const multi = MULTI_LAYERS.has(layer.id);
      const selected = trait
        ? (multi ? idsFor(layer.id, build[layer.id]).includes(trait.id) : build[layer.id] === trait.id)
        : !hasValue(build[layer.id]);
      btn.setAttribute('aria-pressed', String(selected));

      if (trait) {
        const img = document.createElement('img');
        img.className = 'thumb';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = thumbSrc(layer.id, trait.id);
        img.alt = '';
        btn.appendChild(img);
      } else {
        const none = document.createElement('span');
        none.className = 'thumb';
        none.textContent = '∅';
        none.setAttribute('aria-hidden', 'true');
        btn.appendChild(none);
      }

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = trait ? trait.name : 'None';
      btn.appendChild(label);

      if (trait?.solo) {
        const solo = document.createElement('span');
        solo.className = 'badge-solo';
        solo.textContent = 'Complete';
        btn.appendChild(solo);
      }

      btn.setAttribute('aria-label',
        `${trait ? trait.name : `No ${layer.name.toLowerCase()}`}${selected ? ' (selected)' : ''}`);

      btn.addEventListener('click', () => {
        if (multi) {
          if (trait) toggleMulti(layer.id, trait.id);
          else { setBuild({ ...build, [layer.id]: [] }); note(''); }
          return;
        }
        setBuild({ ...build, [layer.id]: trait ? trait.id : null });
        note('');
      });
      return btn;
    }

    /* ---------- export ---------- */

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Could not load ${src}`));
        img.src = src;
      });
    }

    // Composites at full manifest resolution rather than reusing the on-screen
    // stack, so the export is the same regardless of window size. Every layer
    // is same-origin, so the canvas stays untainted and toBlob() works.
    async function renderToBlob() {
      const size = manifest.size || 1024;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      // Same rank order as the live preview (see renderStack) — otherwise
      // a saved PNG could disagree with what was actually on screen.
      const entries = [];
      for (const layer of manifest.layers) {
        const ids = idsFor(layer.id, build[layer.id]);
        for (const id of ids) {
          const transform = id === 'candle' ? candleTransform(ids.filter(x => x !== id)) : '';
          entries.push({ layerId: layer.id, id, transform, rank: rankFor(layer.id, id) });
        }
      }
      entries.sort((a, b) => a.rank - b.rank);
      for (const { layerId, id, transform } of entries) {
        const img = await loadImage(fullSrc(layerId, id));
        if (!transform) { ctx.drawImage(img, 0, 0, size, size); continue; }
        ctx.save();
        ctx.translate(size / 2, size / 2);
        if (transform === 'scaleX(-1)') ctx.scale(-1, 1);
        else if (transform === 'rotate(90deg)') ctx.rotate(Math.PI / 2);
        ctx.drawImage(img, -size / 2, -size / 2, size, size);
        ctx.restore();
      }
      return new Promise((resolve, reject) => {
        canvas.toBlob(b => (b ? resolve(b) : reject(new Error('Export failed.'))), 'image/png');
      });
    }

    function filename() {
      const parts = manifest.layers.flatMap(l => idsFor(l.id, build[l.id]));
      return `troll-pfp-${parts.slice(0, 3).join('-') || 'blank'}.png`;
    }

    function triggerBlobDownload(blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename();
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    /* ---------- share modal ----------
       Renders once when the sheet opens, then Download and Share on X both
       reuse that same blob instead of re-compositing per button. */
    let shareBlob = null;
    let shareObjectUrl = null;

    function setShareNote(msg, kind) {
      el.shareModalNote.textContent = msg || '';
      el.shareModalNote.className = 'share-modal-note' + (kind ? ` is-${kind}` : '');
    }

    async function openShareModal() {
      el.shareModal.hidden = false;
      el.btnShareX.disabled = true;
      el.btnShareDownload.disabled = true;
      el.shareModalImg.removeAttribute('src');
      setShareNote('Rendering…');
      try {
        shareBlob = await renderToBlob();
        shareObjectUrl = URL.createObjectURL(shareBlob);
        el.shareModalImg.src = shareObjectUrl;
        setShareNote('');
      } catch (err) {
        setShareNote(err.message || 'Could not render that one.', 'err');
      } finally {
        el.btnShareX.disabled = false;
        el.btnShareDownload.disabled = false;
      }
    }

    function closeShareModal() {
      el.shareModal.hidden = true;
      if (shareObjectUrl) { URL.revokeObjectURL(shareObjectUrl); shareObjectUrl = null; }
      shareBlob = null;
      el.shareModalImg.removeAttribute('src');
      setShareNote('');
    }

    async function downloadFromModal() {
      if (!shareBlob) return;
      // iOS Safari's <a download> on a blob URL doesn't save — it just opens
      // Quick Look, whose share sheet has no direct "Save Image" option. Use
      // the native file share sheet there instead; it knows it's an image.
      const file = new File([shareBlob], filename(), { type: 'image/png' });
      if (navigator.canShare?.({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'My Troll PFP' });
          setShareNote('Shared. Go be insufferable.', 'ok');
          return;
        } catch (err) {
          if (err?.name === 'AbortError') return;
        }
      }
      triggerBlobDownload(shareBlob);
      setShareNote('Downloaded. Go be insufferable.', 'ok');
    }

    /** Real image attach where the browser supports it (mobile Web Share);
     *  X's tweet-intent URL can't take an image by link, so everywhere else
     *  this falls back to downloading the PNG and opening the composer for
     *  the user to attach it themselves. */
    async function shareOnX() {
      if (!shareBlob) return;
      const text = 'Made my Troll PFP at trollrunner.net — build yours:';
      const file = new File([shareBlob], filename(), { type: 'image/png' });
      if (navigator.canShare?.({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'My Troll PFP', text });
          setShareNote('Shared.', 'ok');
          return;
        } catch (err) {
          if (err?.name === 'AbortError') return;
        }
      }
      triggerBlobDownload(shareBlob);
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
      setShareNote('Downloaded — attach the image to your post.', 'ok');
    }

    /* ---------- sign in / create account ----------
       Save-as-profile is a dead click for a logged-out visitor otherwise —
       nothing on the page explains why, so the button just looks broken.
       This nudges them straight into a real login form instead of bouncing
       them off the page and losing whatever look they'd already built. */
    let authMode = 'login';
    let authBusy = false;
    let pendingSaveAfterAuth = false;

    function updateAuthUI() {
      const session = window.TrollrunnerAccounts?.getCachedProfile?.() || null;
      el.btnSignin.classList.add('is-visible');
      el.btnSignin.classList.toggle('is-account', !!session);
      el.btnSignin.innerHTML = '';
      if (session) {
        const icon = document.createElement('img');
        icon.src = session.avatarUrl ? String(session.avatarUrl) : 'assets/animations/troll-grin.gif';
        icon.alt = '';
        el.btnSignin.appendChild(icon);
        el.btnSignin.appendChild(document.createTextNode(session.username));
      } else {
        el.btnSignin.textContent = 'Log in';
      }
    }

    function authApplyMode() {
      const creating = authMode === 'create';
      el.authModalTitle.textContent = creating ? 'Create account' : 'Sign in';
      el.authIdLabel.textContent = creating ? 'Username' : 'Username or email';
      el.authEmailField.hidden = !creating;
      el.authPw.autocomplete = creating ? 'new-password' : 'current-password';
      el.authSubmit.textContent = creating ? 'Create account' : 'Sign in';
      el.authSwap.textContent = creating ? 'Already have one? Sign in' : 'New here? Create an account';
      el.authMsg.textContent = '';
      el.authMsg.className = 'share-modal-note';
    }

    function openAuthModal(afterSave) {
      pendingSaveAfterAuth = !!afterSave;
      authMode = 'login';
      authApplyMode();
      el.authModal.hidden = false;
      el.authId.focus();
    }
    function closeAuthModal() {
      el.authModal.hidden = true;
      el.authForm.reset();
      pendingSaveAfterAuth = false;
    }

    el.authSwap.addEventListener('click', () => {
      authMode = authMode === 'create' ? 'login' : 'create';
      authApplyMode();
    });
    el.authModalClose.addEventListener('click', closeAuthModal);
    el.authModalBackdrop.addEventListener('click', closeAuthModal);
    el.authForm.addEventListener('submit', async e => {
      e.preventDefault();
      if (authBusy) return;
      const accounts = window.TrollrunnerAccounts;
      if (!accounts) { el.authMsg.textContent = 'Account service is still loading. Try again in a moment.'; return; }
      const id = el.authId.value.trim();
