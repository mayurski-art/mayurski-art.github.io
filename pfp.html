     *  layer; this settles two picks that live in *different* layers, where
     *  the plain rank (see RANK_OVERRIDES) gives the wrong answer for one
     *  specific combination. Keyed by the sorted pair of trait ids, value is
     *  the id that paints in front. The rider can still flip it live via the
     *  order-bar (crossOrderOverride), same as a same-layer pair.
     *
     *  gold-chains normally rides at rank 25, i.e. over every outfit, which
     *  is right for a tee or a hoodie. A big collared coat is the exception:
     *  a chain draped over the fur reads as pasted on, so it tucks behind.
     *
     *  Scope, same as MULTI_PAIRS above: every entry applies globally — to
     *  every base except logo-face/ninja (solo bases that force outfit and
     *  accessory off entirely, not a compatibility exception) and every
     *  background (pure backdrop, never checked here). Paint order is a
     *  property of the two pieces of art alone, and both of those layers
     *  render strictly behind the pair, so neither can change the answer.
     *  This table is never base- or background-gated; don't add either as
     *  a condition. */
    const CROSS_PAIR_ORDER = {
      // Gold chain vs outfit, reviewed in full 2026-09-23 via
      // tools/pfp-chain-outfit-review.html. Only the "behind" answers need an
      // entry; the other 70 outfits either read better with the chain in
      // front or work either way, which is what the plain rank already does.
      // The common thread below is a raised collar or something already worn
      // at the neck — the chain has to sit under it, not on top of it.
      'gold-chains|white-fur-coat': 'white-fur-coat',
      'cape-black|gold-chains': 'cape-black',
      'cape-green|gold-chains': 'cape-green',
      'cape-red|gold-chains': 'cape-red',
      'floral-necklace|gold-chains': 'floral-necklace',
      'fur-coat|gold-chains': 'fur-coat',
      'gold-chains|hike-vest': 'hike-vest',
      'gold-chains|leather-vest': 'leather-vest',
      'gold-chains|scarf': 'scarf',
    };
    const crossPairKey = (a, b) => [a, b].sort().join('|');
    /** Comparator for same-layer stack entries: a rider's own swap-order
     *  choice (orderOverride, set via the drawer's order-bar) wins first,
     *  then the hardcoded PAIR_ORDER, otherwise falls back to each entry's
     *  plain rank (ties keep their original — i.e. click/array — order,
     *  since Array.prototype.sort is stable). */
    function compareStackEntries(a, b) {
      if (a.layerId === b.layerId && a.id && b.id) {
        const overridden = orderOverride[a.layerId];
        if (overridden === a.id || overridden === b.id) return a.id === overridden ? 1 : -1;
        const front = PAIR_ORDER[[a.id, b.id].sort().join('|')];
        if (front) return a.id === front ? 1 : -1;
      } else if (a.id && b.id) {
        // Different layers: a hand-set cross-layer answer (and the rider's
        // own flip of it) beats the layers' plain rank difference.
        const key = crossPairKey(a.id, b.id);
        const front = crossOrderOverride[key] || CROSS_PAIR_ORDER[key];
        if (front) return a.id === front ? 1 : -1;
      }
      return a.rank - b.rank;
    }
    // Hand-shot photo of each hotspot's furniture, filled in as the whole
    // drawer's background. Every layer shows the full shot uncropped
    // (background-size: contain) except "base", which is allowed to crop
    // in tight for a punchier canvas since the wide shot doesn't read well
    // shrunk to fit.
    const CLOSEUPS = {
      base: { src: 'assets/images/world/pfp-base.png', pos: '50% 20%', fit: 'cover' },
      // Desktop shot is a wide panoramic shelf strip that reads fine in the
      // wide desktop drawer; that same aspect ratio letterboxes badly in the
      // narrow, roughly-square mobile drawer, so mobile gets its own tighter
      // square crop of the same wardrobe instead.
      headwear: { src: 'assets/images/world/trollpfproomheadwaredesktop.jpg', mobileSrc: 'assets/images/world/trollpfproomheadwaremobile.jpg', fit: 'cover' },
      outfit: { src: 'assets/images/world/pfp-outfit.png', mobileSrc: 'assets/images/world/trollpfpoutfit-mobile.jpg', fit: 'contain' },
      background: { src: 'assets/images/world/pfp-background.png', mobileSrc: 'assets/images/world/trollpfpbackground-mobile.jpg', fit: 'contain' },
      accessory: { src: 'assets/images/world/trollpfp-accessoriesbigger.jpg', mobileSrc: 'assets/images/world/trollpfpaccesory-mobile.jpg', fit: 'contain' },
    };

    const el = {
      stack: document.getElementById('stack'),
      grid: document.getElementById('grid'),
      orderBar: document.getElementById('orderBar'),
      search: document.getElementById('search'),
      count: document.getElementById('count'),
      note: document.getElementById('note'),
      summary: document.getElementById('summary'),
      total: document.getElementById('trait-total'),
      roomShots: Array.from(document.querySelectorAll('.room-bg-alt')),
      tvFrames: Array.from(document.querySelectorAll('.room-bg-alt[data-tv-frame]')),
      picker: document.querySelector('.picker'),
      stage: document.querySelector('.stage'),
      studio: document.querySelector('.studio'),
      actions: document.querySelector('.actions'),
      drawerPreview: document.getElementById('drawerPreview'),
      roomPanel: document.getElementById('roomPanel'),
      roomPanelBody: document.getElementById('roomPanelBody'),
      roomPanelTitle: document.getElementById('roomPanelTitle'),
      roomPanelClose: document.getElementById('roomPanelClose'),
      hotspots: Array.from(document.querySelectorAll('.hotspot')),
      shareModal: document.getElementById('shareModal'),
      shareModalBackdrop: document.getElementById('shareModalBackdrop'),
      shareModalClose: document.getElementById('shareModalClose'),
      shareModalImg: document.getElementById('shareModalImg'),
      shareModalNote: document.getElementById('shareModalNote'),
      btnShareX: document.getElementById('btnShareX'),
      btnShareDownload: document.getElementById('btnShareDownload'),
      btnSignin: document.getElementById('btn-signin'),
      authModal: document.getElementById('authModal'),
      authModalTitle: document.getElementById('authModalTitle'),
      authModalBackdrop: document.getElementById('authModalBackdrop'),
      authModalClose: document.getElementById('authModalClose'),
      authXSignin: document.getElementById('authXSignin'),
      authForm: document.getElementById('authForm'),
      authIdLabel: document.getElementById('authIdLabel'),
      authId: document.getElementById('authId'),
      authEmailField: document.getElementById('authEmailField'),
      authEmail: document.getElementById('authEmail'),
      authPw: document.getElementById('authPw'),
      authMsg: document.getElementById('authMsg'),
      authSubmit: document.getElementById('authSubmit'),
      authSwap: document.getElementById('authSwap'),
      authForgot: document.getElementById('authForgot'),
      btnReportBug: document.getElementById('btnReportBug'),
      bugReportBox: document.getElementById('bugReportBox'),
      bugReportText: document.getElementById('bugReportText'),
      bugReportCount: document.getElementById('bugReportCount'),
      bugReportCancel: document.getElementById('bugReportCancel'),
      bugReportSend: document.getElementById('bugReportSend'),
      bugReportNote: document.getElementById('bugReportNote'),
      btnAdminBugs: document.getElementById('btn-admin-bugs'),
      adminBugsBadge: document.getElementById('adminBugsBadge'),
      adminBugsModal: document.getElementById('adminBugsModal'),
      adminBugsBackdrop: document.getElementById('adminBugsBackdrop'),
      adminBugsClose: document.getElementById('adminBugsClose'),
      adminBugsList: document.getElementById('adminBugsList'),
    };

    let manifest = null;
    let activeLayer = null;
    /** @type {Record<string, string|string[]|null>} layer id -> trait id
     *  (null = none), except MULTI_LAYERS which hold a string[] instead. */
    let build = {};
    /** Session-only paint-order flips: layer id -> trait id that should
     *  paint in front, for pairs where the rider wants to override
     *  PAIR_ORDER (or the default click order) for this session. Not
     *  persisted — it resets with a fresh visit like a preview toggle,
     *  same spirit as hoveredLayer/focusedLayer below. Cleared whenever
     *  that layer's picks change so a stale flip never survives a swap. */
    const orderOverride = {};
    /** Session-only flips of a CROSS_PAIR_ORDER default, keyed the same way
     *  (sorted pair of ids). Kept separate from orderOverride because that
     *  one is keyed by layer, which can't address a pair spanning two. */
    const crossOrderOverride = {};
    /** layer id -> <img>[] in the preview stack, in z-order. One entry for
     *  ordinary layers, MULTI_LIMIT entries (extras hidden when unused) for
     *  a multi layer. */
    const layerImg = new Map();
    /** Previous builds, oldest first. Randomize is one click away from losing
     *  a good troll forever, so every mutation is undoable. */
    const past = [];
    const HISTORY_LIMIT = 60;

    const fullSrc = (layer, trait) => `assets/pfp/${layer}/${trait}.webp`;
    const thumbSrc = (layer, trait) => `assets/pfp/${layer}/thumb/${trait}.webp`;
    const layerById = id => manifest.layers.find(l => l.id === id);
    const traitById = (layer, id) => layerById(layer)?.traits.find(t => t.id === id) || null;
    /** True if a layer's slot in `build` currently holds anything, whether
     *  that slot is a single id or (for MULTI_LAYERS) an array of them. */
    const hasValue = v => Array.isArray(v) ? v.length > 0 : !!v;
    /** Layer id -> array of trait ids, regardless of whether that layer is
     *  single- or multi-select. Lets rendering/export loops treat every
     *  layer the same way. */
    const idsFor = (layerId, v) => MULTI_LAYERS.has(layerId) ? (v || []) : (v ? [v] : []);

    /** Trims a multi-select layer's selection down to a valid one: known
     *  ids only, deduped, capped at MULTI_LIMIT, and every id compatible
     *  with every other id kept before it (so an incoming array is
     *  filtered in order — first pick always survives, later picks only
     *  survive if they pair with everything already kept). */
    function sanitizeMultiSet(layerId, ids) {
      const kept = [];
      for (const id of (ids || [])) {
        if (!traitById(layerId, id) || kept.includes(id)) continue;
        if (kept.length && !kept.every(k => traitsCompatible(layerId, k, id))) continue;
        kept.push(id);
        if (kept.length >= MULTI_LIMIT) break;
      }
      return kept;
    }

    function note(msg, kind) {
      el.note.textContent = msg || '';
      el.note.className = 'note' + (kind ? ` is-${kind}` : '');
    }

    /* ---------- build state ---------- */

    function defaultBuild() {
      const next = {};
      for (const layer of manifest.layers) {
        next[layer.id] = MULTI_LAYERS.has(layer.id) ? [] : (OPTIONAL.has(layer.id) ? null : (layer.traits[0]?.id ?? null));
      }
      // The default troll is just White background + OG base — bare, no
      // outfit/headwear/accessory — so those three fall through to the
      // null/[] already set above rather than being overridden here.
      const preferred = { background: 'white', base: 'og' };
      for (const [id, want] of Object.entries(preferred)) {
        if (!traitById(id, want)) continue;
        next[id] = MULTI_LAYERS.has(id) ? [want] : want;
      }
      return next;
    }

    // Every single trait and every valid pair for this pool are one flat
    // list of candidates, drawn from uniformly — no weighting toward
    // singles or pairs, so Randomize actually exercises MULTI_PAIRS instead
    // of only ever landing on one trait per layer.
    function randomMultiPick(layerId, pool) {
      const poolIds = new Set(pool.map(t => t.id));
      const validPairs = [...(MULTI_PAIRS[layerId] || [])]
        .map(key => key.split('|'))
        .filter(([a, b]) => poolIds.has(a) && poolIds.has(b));
      const candidates = [...pool.map(t => [t.id]), ...validPairs];
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    function randomBuild(all) {
      const next = {};
      for (const layer of manifest.layers) {
        const optional = OPTIONAL.has(layer.id);
        const multi = MULTI_LAYERS.has(layer.id);
        // Solo art wears nothing else, so rolling it would silently strip the
        // rest of the troll — leave it to be chosen deliberately.
        const pool = layer.traits.filter(t => !t.solo);
        // "Randomize" keeps a wearable silhouette; "full random" fills every slot.
        const skip = optional && !all && layer.id === 'accessory' && Math.random() < 0.5;
        if (skip || !pool.length) { next[layer.id] = multi ? [] : null; continue; }
        if (multi) { next[layer.id] = randomMultiPick(layer.id, pool); continue; }
        next[layer.id] = pool[Math.floor(Math.random() * pool.length)].id;
      }
      return next;
    }

    /** Drop trait ids that aren't in the manifest (renamed/removed art), then
     *  apply the solo rule. Builds arriving from localStorage or a shared link
     *  never went through setBuild(), so without enforceSolo() here a saved
     *  Ninja-plus-outfit combo loads straight past the rule and renders the
     *  broken troll it exists to prevent. */
    function sanitize(raw) {
      const next = {};
      for (const layer of manifest.layers) {
        if (MULTI_LAYERS.has(layer.id)) {
          const want = raw?.[layer.id];
          // Older saved builds (pre-multi-select) stored accessory as a
          // plain string — accept that shape too.
          const list = Array.isArray(want) ? want : (want ? [want] : []);
          next[layer.id] = sanitizeMultiSet(layer.id, list);
          continue;
        }
        const want = raw?.[layer.id];
        next[layer.id] = want && traitById(layer.id, want) ? want : null;
      }
      // Anything required that got dropped falls back to the default.
      const base = defaultBuild();
      for (const layer of manifest.layers) {
        if (MULTI_LAYERS.has(layer.id)) continue;
        if (!next[layer.id] && !OPTIONAL.has(layer.id)) next[layer.id] = base[layer.id];
      }
      return enforceCrossLayerExclusions(enforceSolo(next));
    }

    function readUrlBuild() {
      const params = new URLSearchParams(location.search);
      if (![...params.keys()].some(k => manifest.layers.some(l => l.id === k))) return null;
      const raw = {};
      for (const layer of manifest.layers) {
        const v = params.get(layer.id);
        if (MULTI_LAYERS.has(layer.id)) {
          raw[layer.id] = v && v !== 'none' ? v.split(',').filter(Boolean) : [];
          continue;
        }
        raw[layer.id] = v && v !== 'none' ? v : null;
      }
      return raw;
    }

    function persist() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(build)); } catch {}
    }

    /** Some art is a finished troll on its own (see `solo` in the manifest):
     *  a head at its own scale, or a character that already has an outfit.
     *  Layering clothes under those just looks broken, so while one is worn
     *  the optional layers are emptied and locked. */
    function soloTrait() {
      for (const layer of manifest.layers) {
        if (MULTI_LAYERS.has(layer.id)) continue; // multi-select layers never hold a solo trait
        const t = build[layer.id] && traitById(layer.id, build[layer.id]);
        if (t?.solo) return { layer, trait: t };
      }
      return null;
    }

    // Remembers the outfit/headwear/accessory a solo base wiped, so switching
    // back to a layerable base later restores them instead of leaving the
    // troll bare — see enforceSolo() below. Persisted so a reload mid-solo
    // doesn't drop it either.
    let soloStash = (() => {
      try { return JSON.parse(localStorage.getItem(SOLO_STASH_KEY) || 'null'); } catch { return null; }
    })();
    function persistSoloStash() {
      try {
        if (soloStash) localStorage.setItem(SOLO_STASH_KEY, JSON.stringify(soloStash));
        else localStorage.removeItem(SOLO_STASH_KEY);
      } catch {}
    }

    function enforceSolo(next) {
      const solo = manifest.layers.some(l => {
        const t = next[l.id] && traitById(l.id, next[l.id]);
        return t?.solo;
      });
      if (!solo) {
        if (!soloStash) return next;
        // Only fill slots the caller left empty — a trait picked in the same
        // action that turned solo off wins over whatever was stashed.
        const restored = { ...next };
        for (const id of OPTIONAL) {
          if (hasValue(restored[id])) continue;
          const stashed = soloStash[id];
          if (!hasValue(stashed)) continue;
          if (MULTI_LAYERS.has(id)) restored[id] = sanitizeMultiSet(id, stashed);
          else if (traitById(id, stashed)) restored[id] = stashed;
        }
        soloStash = null;
        persistSoloStash();
        return restored;
      }
      if (!soloStash) {
        soloStash = {};
        for (const id of OPTIONAL) if (hasValue(next[id])) soloStash[id] = next[id];
        persistSoloStash();
      }
      const clean = { ...next };
      for (const id of OPTIONAL) clean[id] = MULTI_LAYERS.has(id) ? [] : null;
      return clean;
    }

    /** The one way the build changes, so nothing can bypass the undo stack. */
    function setBuild(next, { record = true, keepLayer = null } = {}) {
      next = enforceSolo(next);
      next = enforceCrossLayerExclusions(next, keepLayer);
      if (record) {
        past.push({ ...build });
        if (past.length > HISTORY_LIMIT) past.shift();
      }
      build = next;
      persist();
      renderStack();
      renderGrid();
      syncHistory();
    }

    function stepBack() {
      const previous = past.pop();
      if (!previous) return;
      setBuild(previous, { record: false });
      note('');
    }

    function syncHistory() {
      const btn = document.getElementById('btn-back');
      if (!btn) return;
      btn.disabled = past.length === 0;
      const label = past.length
        ? `Go back to the previous look (${past.length} to step through)`
        : 'No previous look yet';
      btn.setAttribute('aria-label', label);
      btn.title = label;
    }

    function readStored() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch { return null; }
    }

    /* ---------- rendering ---------- */

    function renderStack() {
      const stackOrder = [];
      for (const layer of manifest.layers) {
        const imgs = layerImg.get(layer.id);
        if (!imgs) continue;
        const ids = idsFor(layer.id, build[layer.id]);
        imgs.forEach((img, i) => {
          const id = ids[i];
          stackOrder.push({ img, layerId: layer.id, id, rank: rankFor(layer.id, id) });
          if (!id) { img.classList.remove('is-on'); img.alt = ''; img.style.transform = ''; return; }
          const src = fullSrc(layer.id, id);
          if (!img.src.endsWith(src)) img.src = src;
          img.classList.add('is-on');
          img.alt = `${layer.name}: ${traitById(layer.id, id)?.name || id}`;
          img.style.transform = '';
        });
      }
      // Paint order is DOM order for these absolutely-positioned layers —
      // appendChild on an existing node moves it, so replaying every slot
      // in rank order (see RANK_OVERRIDES) keeps the stack in sync even
      // when a trait's visual front/back position differs from its layer's
      // normal spot.
      stackOrder.sort(compareStackEntries);
      for (const { img } of stackOrder) el.stack.appendChild(img);

      const worn = manifest.layers
        .flatMap(l => idsFor(l.id, build[l.id]).map(id => traitById(l.id, id)?.name))
        .filter(Boolean);
      el.summary.textContent = worn.length ? worn.join(' · ') : 'Empty troll';
      renderHotspots();
    }

    /** Furniture hotspots stand in for the old tab strip: a lit outline on
     *  hover, an always-on pulsing green dot, and a highlight while its
     *  drawer is the one open. */
    function renderHotspots() {
      const panelOpen = !el.roomPanel.hidden;
      for (const btn of el.hotspots) {
        const id = btn.dataset.layer;
        const label = btn.dataset.baseLabel;
        const names = idsFor(id, build[id]).map(t => traitById(id, t)?.name).filter(Boolean);
        btn.classList.toggle('is-active', panelOpen && activeLayer === id);
        btn.setAttribute('aria-label', names.length ? `${label} — ${names.join(' + ')} selected` : label);
      }
    }

    const isMobileLayout = () => window.matchMedia('(max-width: 860px)').matches;

    /** Mobile-only: room card on top, preview card below, with the action
     *  row lifted out from under the preview to sit between the two cards.
     *  Desktop keeps the original nesting (actions inside .stage, right
     *  before .note) — this just moves the same nodes back and forth. */
    function layoutForViewport() {
      if (isMobileLayout()) {
        if (el.actions.parentElement !== el.studio) {
          el.studio.insertBefore(el.picker, el.stage);
          el.studio.insertBefore(el.actions, el.stage);
        }
      } else if (el.actions.parentElement === el.studio) {
        el.stage.insertBefore(el.actions, el.note);
        el.studio.insertBefore(el.stage, el.picker);
      }
    }
    layoutForViewport();
    addEventListener('resize', layoutForViewport, { passive: true });

    function openRoomPanel(layerId) {
      if (activeLayer === layerId && !el.roomPanel.hidden) { closeRoomPanel(); return; }
      activeLayer = layerId;
      el.search.value = '';
      el.roomPanel.hidden = false;
      el.picker.classList.add('drawer-open');
      // On mobile the drawer covers the stage, so the live avatar moves into
      // the drawer header instead — same #stack element, so it keeps
      // updating live as traits are tapped without any extra sync code.
      if (isMobileLayout() && !el.drawerPreview.contains(el.stack)) {
        el.drawerPreview.appendChild(el.stack);
      }
      el.roomPanelTitle.textContent = layerById(layerId)?.name || layerId;
      const closeup = CLOSEUPS[layerId];
      if (closeup) {
        const src = (isMobileLayout() && closeup.mobileSrc) ? closeup.mobileSrc : closeup.src;
        el.roomPanelBody.style.backgroundImage = `url(${src})`;
        el.roomPanelBody.style.backgroundPosition = closeup.pos || 'center';
        el.roomPanelBody.classList.toggle('is-cover', closeup.fit === 'cover');
      }
      renderGrid();
      renderHotspots();
      updateRoomArt();
    }

    function closeRoomPanel() {
      activeLayer = null;
      el.roomPanel.hidden = true;
      el.picker.classList.remove('drawer-open');
      if (el.drawerPreview.contains(el.stack)) {
        el.stage.insertBefore(el.stack, el.stage.firstChild);
      }
      renderHotspots();
      updateRoomArt();
    }

    /* ---- room art ----
       Only ever one shot is lit at a time. Whichever drawer is open wins
       outright — hovering other furniture behind an open drawer shouldn't
       swap the shot out from under it. With no drawer open, hover (then
       keyboard focus) picks the shot instead. With none of them pointing
       anywhere the room falls back to the idle photo underneath, so moving
       off the furniture always lands you back on the same neutral shot. */
    let hoveredLayer = null;
    let focusedLayer = null;

    /** The shot the room should be showing, or null for the idle photo.
     *  While a drawer is open, that layer's furniture owns the room shot —
     *  hovering a different hotspot behind the drawer shouldn't steal it;
     *  only closing the drawer (or picking another one) lets go of it. */
    function currentShot() {
      if (activeLayer) return activeLayer;
      return hoveredLayer ?? focusedLayer ?? null;
    }

    function updateRoomArt() {
      const shot = currentShot();
      // The TV is a loop rather than a still, so it runs its own timer and
      // owns the visibility of its three frames — leave them alone here.
      for (const img of el.roomShots) {
        if (img.hasAttribute('data-tv-frame')) continue;
        img.classList.toggle('is-visible', img.dataset.roomShot === shot);
      }
      if (shot === 'background') startTvLoop(); else stopTvLoop();
    }

    // The TV cycles through its lit-up color frames while the background
    // hotspot is the live one — same cross-fade as every other shot, just
    // stepping between three of them instead of holding on one.
    let tvLoopTimer = null;
    function startTvLoop() {
      if (tvLoopTimer) return;
      let i = 0;
      const step = () => {
        el.tvFrames.forEach((img, n) => img.classList.toggle('is-visible', n === i));
        i = (i + 1) % el.tvFrames.length;
      };
      step();
      tvLoopTimer = window.setInterval(step, 1100);
    }
    function stopTvLoop() {
      window.clearInterval(tvLoopTimer);
      tvLoopTimer = null;
      el.tvFrames.forEach(img => img.classList.remove('is-visible'));
    }

    function renderGrid() {
      const layer = layerById(activeLayer);
      if (!layer) return;
      const q = el.search.value.trim().toLowerCase();
      const traits = q ? layer.traits.filter(t => t.name.toLowerCase().includes(q)) : layer.traits;

      el.grid.innerHTML = '';
      el.grid.setAttribute('aria-label', `${layer.name} traits`);
      el.count.textContent = q
        ? `${traits.length} of ${layer.traits.length}`
        : `${layer.traits.length} traits`;

      // A solo base owns the whole picture — offer the way out instead of a
      // grid of traits that would silently do nothing.
      const solo = soloTrait();
      if (solo && OPTIONAL.has(layer.id)) {
        const box = document.createElement('div');
        box.className = 'locked';
        const p = document.createElement('p');
        p.textContent = `${solo.trait.name} is a complete troll — it comes with its own look, so ${layer.name.toLowerCase()} is switched off.`;
        const swap = document.createElement('button');
        swap.type = 'button';
        swap.className = 'btn-swap';
        swap.textContent = 'Switch to a layerable base';
        swap.addEventListener('click', () => {
          const plain = layerById('base').traits.find(t => t.id === 'og' && !t.solo)
            || layerById('base').traits.find(t => !t.solo);
          setBuild({ ...build, base: plain?.id ?? null });
          note('');
        });
        box.append(p, swap);
        el.grid.appendChild(box);
        el.count.textContent = 'locked';
        return;
      }

      if (OPTIONAL.has(layer.id) && !q) {
        el.grid.appendChild(cell(layer, null));
      }
      for (const trait of traits) el.grid.appendChild(cell(layer, trait));

      if (!traits.length) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = `No ${layer.name.toLowerCase()} matches “${el.search.value.trim()}”.`;
        el.grid.appendChild(p);
      }
      renderOrderBar(layer);
    }

    /** Two-pick swap-order control. Covers two cases:
     *   - a multi-select layer wearing 2 compatible traits (flip stored per
     *     layer in orderOverride), and
     *   - a CROSS_PAIR_ORDER pair spanning two layers, e.g. gold chains over
     *     vs under the white fur coat (flip stored per pair in
     *     crossOrderOverride). That bar shows in EITHER of the two layers'
     *     drawers, since the rider may be standing in either one.
     *  A hardcoded default is a starting point, not a lock — both kinds stay
     *  overridable for the session. */
    function renderOrderBar(layer) {
      el.orderBar.innerHTML = '';
      const pair = orderBarPair(layer);
      if (!pair) { el.orderBar.hidden = true; return; }
      el.orderBar.hidden = false;

      const label = document.createElement('span');
      label.className = 'order-label';
      label.textContent = 'Order:';
      el.orderBar.appendChild(label);

      for (const opt of pair.options) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'order-btn' + (pair.current === opt.id ? ' is-active' : '');
        btn.textContent = opt.label;
        btn.addEventListener('click', () => {
          pair.apply(opt.id);
          renderStack();
          renderOrderBar(layer);
        });
        el.orderBar.appendChild(btn);
      }
    }

    /** Works out which pair, if any, the order bar should offer while
     *  `layer`'s drawer is open — the layer's own two picks first, then any
     *  cross-layer pair this layer takes part in. Returns the two buttons to
     *  draw, which id is currently in front, and how to record a flip. */
    function orderBarPair(layer) {
      if (MULTI_LAYERS.has(layer.id)) {
        const [a, b] = idsFor(layer.id, build[layer.id]);
        if (a && b) {
          const current = orderOverride[layer.id] || PAIR_ORDER[[a, b].sort().join('|')] || null;
          return {
            current,
            options: [
              { id: b, label: `${traitById(layer.id, b)?.name || b} in front` },
              { id: a, label: `${traitById(layer.id, a)?.name || a} in front` },
            ],
            apply: (id) => { orderOverride[layer.id] = id; },
          };
        }
      }
      return crossOrderBarPair(layer);
    }

    /** The cross-layer half of orderBarPair: scans CROSS_PAIR_ORDER for a
     *  pair where this layer holds one side and the other side is currently
     *  worn on its own layer. */
    function crossOrderBarPair(layer) {
      const mine = idsFor(layer.id, build[layer.id]);
      if (!mine.length) return null;
      for (const key of Object.keys(CROSS_PAIR_ORDER)) {
        const ids = key.split('|');
        const myId = ids.find(id => mine.includes(id));
        if (!myId) continue;
        const otherId = ids.find(id => id !== myId);
        const otherLayer = manifest.layers.find(l =>
          l.id !== layer.id && idsFor(l.id, build[l.id]).includes(otherId));
        if (!otherLayer) continue;
        const nameFor = (lid, id) => traitById(lid, id)?.name || id;
        return {
          current: crossOrderOverride[key] || CROSS_PAIR_ORDER[key],
          options: [
            { id: otherId, label: `${nameFor(otherLayer.id, otherId)} in front` },
            { id: myId, label: `${nameFor(layer.id, myId)} in front` },
          ],
          apply: (id) => { crossOrderOverride[key] = id; },
        };
      }
      return null;
    }

    /** True if picking `id` in `layerId` would trip a CROSS_LAYER_EXCLUSIONS
     *  rule against what's currently worn elsewhere, and if so, the
     *  {layerId, id} of the other layer's pick that would get dropped. */
    function crossLayerClash(layerId, id) {
      for (const pair of CROSS_LAYER_EXCLUSIONS) {
        const mine = pair.find(([l, i]) => l === layerId && i === id);
        if (!mine) continue;
        const [otherLayer, otherId] = pair.find(([l]) => l !== layerId);
        if (idsFor(otherLayer, build[otherLayer]).includes(otherId)) return { layerId: otherLayer, id: otherId };
      }
      return null;
    }

    /** Click handler for a MULTI_LAYERS cell: toggle off if already worn,
     *  otherwise add it — replacing the current set instead of stacking if
     *  it doesn't pair with what's already worn (whitelist in
     *  MULTI_PAIRS), so a click never silently no-ops. Also checks
     *  CROSS_LAYER_EXCLUSIONS, since those clashes live in a different
     *  layer's selection and setBuild() would otherwise drop the other
     *  layer's pick silently. */
    function toggleMulti(layerId, id) {
      const current = idsFor(layerId, build[layerId]);
      if (current.includes(id)) {
        delete orderOverride[layerId];
        setBuild({ ...build, [layerId]: current.filter(x => x !== id) });
        note('');
        return;
      }
      const clash = crossLayerClash(layerId, id);
      if (clash) {
        delete orderOverride[layerId];
        setBuild({ ...build, [layerId]: [...current, id] }, { keepLayer: layerId });
        note(`${traitById(clash.layerId, clash.id)?.name} and ${traitById(layerId, id)?.name} clash, so it swapped in on its own.`);
        return;
      }
      if (!current.length) {
        delete orderOverride[layerId];
        setBuild({ ...build, [layerId]: [id] });
        note('');
        return;
      }
      if (current.length < MULTI_LIMIT && current.every(k => traitsCompatible(layerId, k, id))) {
        delete orderOverride[layerId];
        setBuild({ ...build, [layerId]: [...current, id] });
        note('');
        return;
      }
      // Doesn't pair with the current set — swap it in on its own rather
      // than silently doing nothing or stacking a clashing combo.
      const dropped = traitById(layerId, current[0])?.name || 'that';
      delete orderOverride[layerId];
      setBuild({ ...build, [layerId]: [id] });
      note(`${dropped} and ${traitById(layerId, id)?.name} clash, so it swapped in on its own.`);
    }

    function cell(layer, trait) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cell' + (trait ? '' : ' cell-none');
      const multi = MULTI_LAYERS.has(layer.id);
      const selected = trait
        ? (multi ? idsFor(layer.id, build[layer.id]).includes(trait.id) : build[layer.id] === trait.id)
        : !hasValue(build[layer.id]);
      btn.setAttribute('aria-pressed', String(selected));

      if (trait) {
        const img = document.createElement('img');
        img.className = 'thumb';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = thumbSrc(layer.id, trait.id);
        img.alt = '';
        btn.appendChild(img);
      } else {
        const none = document.createElement('span');
        none.className = 'thumb';
        none.textContent = '∅';
        none.setAttribute('aria-hidden', 'true');
        btn.appendChild(none);
      }

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = trait ? trait.name : 'None';
      btn.appendChild(label);

      if (trait?.solo) {
        const solo = document.createElement('span');
        solo.className = 'badge-solo';
        solo.textContent = 'Complete';
        btn.appendChild(solo);
      }

      btn.setAttribute('aria-label',
        `${trait ? trait.name : `No ${layer.name.toLowerCase()}`}${selected ? ' (selected)' : ''}`);

      btn.addEventListener('click', () => {
        if (multi) {
          if (trait) toggleMulti(layer.id, trait.id);
          else { setBuild({ ...build, [layer.id]: [] }); note(''); }
          return;
        }
        // A single-select pick can knock out another layer's trait via
        // CROSS_LAYER_EXCLUSIONS (e.g. a hooded outfit and the gold chain).
        // setBuild enforces that either way, but say so rather than letting
        // the other layer's pick vanish with no explanation.
        const clash = trait ? crossLayerClash(layer.id, trait.id) : null;
        setBuild({ ...build, [layer.id]: trait ? trait.id : null }, { keepLayer: layer.id });
        note(clash
          ? `${traitById(clash.layerId, clash.id)?.name} and ${trait.name} clash, so it came off.`
          : '');
      });
      return btn;
    }

    /* ---------- export ---------- */

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Could not load ${src}`));
        img.src = src;
      });
    }

    // Composites at full manifest resolution rather than reusing the on-screen
    // stack, so the export is the same regardless of window size. Every layer
    // is same-origin, so the canvas stays untainted and toBlob() works.
    async function renderToBlob() {
      const size = manifest.size || 1024;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      // Same rank order as the live preview (see renderStack) — otherwise
      // a saved PNG could disagree with what was actually on screen.
      const entries = [];
      for (const layer of manifest.layers) {
        const ids = idsFor(layer.id, build[layer.id]);
        for (const id of ids) entries.push({ layerId: layer.id, id, rank: rankFor(layer.id, id) });
      }
      entries.sort(compareStackEntries);
      for (const { layerId, id } of entries) {
        const img = await loadImage(fullSrc(layerId, id));
        ctx.drawImage(img, 0, 0, size, size);
      }
      return new Promise((resolve, reject) => {
        canvas.toBlob(b => (b ? resolve(b) : reject(new Error('Export failed.'))), 'image/png');
      });
    }

    function filename() {
      const parts = manifest.layers.flatMap(l => idsFor(l.id, build[l.id]));
      return `troll-pfp-${parts.slice(0, 3).join('-') || 'blank'}.png`;
    }

    function triggerBlobDownload(blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename();
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    /* ---------- share modal ----------
       Renders once when the sheet opens, then Download and Share on X both
       reuse that same blob instead of re-compositing per button. */
    let shareBlob = null;
    let shareObjectUrl = null;

    function setShareNote(msg, kind) {
      el.shareModalNote.textContent = msg || '';
      el.shareModalNote.className = 'share-modal-note' + (kind ? ` is-${kind}` : '');
    }

    async function openShareModal() {
      el.shareModal.hidden = false;
      el.btnShareX.disabled = true;
      el.btnShareDownload.disabled = true;
      el.shareModalImg.removeAttribute('src');
      setShareNote('Rendering…');
      try {
        shareBlob = await renderToBlob();
        shareObjectUrl = URL.createObjectURL(shareBlob);
        el.shareModalImg.src = shareObjectUrl;
        setShareNote('');
      } catch (err) {
        setShareNote(err.message || 'Could not render that one.', 'err');
      } finally {
        el.btnShareX.disabled = false;
        el.btnShareDownload.disabled = false;
      }
    }

    function closeShareModal() {
      el.shareModal.hidden = true;
      if (shareObjectUrl) { URL.revokeObjectURL(shareObjectUrl); shareObjectUrl = null; }
      shareBlob = null;
      el.shareModalImg.removeAttribute('src');
      setShareNote('');
    }

    async function downloadFromModal() {
      if (!shareBlob) return;
      // iOS Safari's <a download> on a blob URL doesn't save — it just opens
      // Quick Look, whose share sheet has no direct "Save Image" option. Use
      // the native file share sheet there instead; it knows it's an image.
      const file = new File([shareBlob], filename(), { type: 'image/png' });
      if (navigator.canShare?.({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'My Troll PFP' });
          setShareNote('Shared. Go be insufferable.', 'ok');
          return;
        } catch (err) {
          if (err?.name === 'AbortError') return;
        }
      }
      triggerBlobDownload(shareBlob);
      setShareNote('Downloaded. Go be insufferable.', 'ok');
    }

    /** Real image attach where the browser supports it (mobile Web Share);
     *  X's tweet-intent URL can't take an image by link, so everywhere else
     *  this falls back to downloading the PNG and opening the composer for
     *  the user to attach it themselves. */
    async function shareOnX() {
      if (!shareBlob) return;
      const text = 'Made my Troll PFP at trollrunner.net — build yours:';
      const file = new File([shareBlob], filename(), { type: 'image/png' });
      if (navigator.canShare?.({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'My Troll PFP', text });
          setShareNote('Shared.', 'ok');
          return;
        } catch (err) {
          if (err?.name === 'AbortError') return;
        }
      }
      triggerBlobDownload(shareBlob);
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
      setShareNote('Downloaded — attach the image to your post.', 'ok');
    }

    /* ---------- sign in / create account ----------
       Save-as-profile is a dead click for a logged-out visitor otherwise —
       nothing on the page explains why, so the button just looks broken.
       This nudges them straight into a real login form instead of bouncing
       them off the page and losing whatever look they'd already built. */
    let authMode = 'login';
    let authBusy = false;
    let pendingSaveAfterAuth = false;

    function updateAuthUI() {
      const session = window.TrollrunnerAccounts?.getCachedProfile?.() || null;
      el.btnSignin.classList.add('is-visible');
      el.btnSignin.classList.toggle('is-account', !!session);
      el.btnSignin.innerHTML = '';
      if (session) {
        const icon = document.createElement('img');
        icon.src = session.avatarUrl ? String(session.avatarUrl) : 'assets/animations/troll-grin.gif';
        icon.alt = '';
        el.btnSignin.appendChild(icon);
        el.btnSignin.appendChild(document.createTextNode(session.username));
      } else {
        el.btnSignin.textContent = 'Log in';
      }
      // Client-side visibility only — the actual boundary is the RLS policy
      // in troll_pfp_bug_reports.sql (only troll_runner can SELECT), so
      // showing this button to the wrong account would just get them an
      // empty list, not real data.
      const isAdmin = session?.username === 'troll_runner';
      el.btnAdminBugs.classList.toggle('is-visible', isAdmin);
      if (isAdmin) refreshAdminBugsBadge();
    }

    function authApplyMode() {
      const creating = authMode === 'create';
      el.authModalTitle.textContent = creating ? 'Create account' : 'Sign in';
      el.authIdLabel.textContent = creating ? 'Username' : 'Username or email';
      el.authEmailField.hidden = !creating;
      el.authPw.autocomplete = creating ? 'new-password' : 'current-password';
      el.authSubmit.textContent = creating ? 'Create account' : 'Sign in';
      el.authSwap.textContent = creating ? 'Already have one? Sign in' : 'New here? Create an account';
      el.authForgot.hidden = creating;
      el.authMsg.textContent = '';
      el.authMsg.className = 'share-modal-note';
    }

    function openAuthModal(afterSave) {
      pendingSaveAfterAuth = !!afterSave;
      authMode = 'login';
      authApplyMode();
      el.authModal.hidden = false;
      el.authId.focus();
    }
    function closeAuthModal() {
      el.authModal.hidden = true;
      el.authForm.reset();
      pendingSaveAfterAuth = false;
    }

    el.authSwap.addEventListener('click', () => {
      authMode = authMode === 'create' ? 'login' : 'create';
      authApplyMode();
    });
    el.authForgot.addEventListener('click', () => {
      window.TrollrunnerAccounts?.openRecovery?.();
    });
    el.authModalClose.addEventListener('click', closeAuthModal);
    el.authModalBackdrop.addEventListener('click', closeAuthModal);
    el.authForm.addEventListener('submit', async e => {
      e.preventDefault();
      if (authBusy) return;
      const accounts = window.TrollrunnerAccounts;
      if (!accounts) { el.authMsg.textContent = 'Account service is still loading. Try again in a moment.'; return; }
      const id = el.authId.value.trim();
      const pw = el.authPw.value;
      const email = el.authEmail.value.trim();
      authBusy = true;
      el.authSubmit.disabled = true;
      el.authMsg.textContent = authMode === 'create' ? 'Creating your troll…' : 'Signing in…';
      try {
        if (authMode === 'create') await accounts.register({ username: id, email, password: pw });
        else await accounts.login({ identifier: id, password: pw });
        const wantsSave = pendingSaveAfterAuth;
        closeAuthModal();
        updateAuthUI();
        if (wantsSave) saveToProfile();
      } catch (err) {
        el.authMsg.textContent = err?.message ? String(err.message) : 'That did not work. Try again.';
        el.authMsg.className = 'share-modal-note is-err';
      } finally {
        authBusy = false;
        el.authSubmit.disabled = false;
      }
    });
    el.btnSignin.addEventListener('click', () => {
      const session = window.TrollrunnerAccounts?.getCachedProfile?.();
      if (session) window.TrollrunnerAccounts.openProfile();
      else openAuthModal(false);
    });

    // signInWithX() navigates the whole page away to X and back, so
    // pendingSaveAfterAuth (a plain JS var) can't survive the round trip —
    // stash the "resume the save after login" intent in sessionStorage
    // instead, same pattern as troll-map.js's PIN_INTENT_KEY.
    const X_SAVE_INTENT_KEY = 'trollrunner_pfp_save_intent';
    el.authXSignin.addEventListener('click', async () => {
      if (authBusy) return;
      const accounts = window.TrollrunnerAccounts;
      if (!accounts) { el.authMsg.textContent = 'Account service is still loading. Try again in a moment.'; return; }
      el.authXSignin.disabled = true;
      el.authMsg.textContent = '';
      try {
        try { sessionStorage.setItem(X_SAVE_INTENT_KEY, pendingSaveAfterAuth ? '1' : '0'); } catch {}
        await accounts.signInWithX();
        // Success navigates away to X — nothing left to do on this page load.
      } catch (err) {
        el.authXSignin.disabled = false;
        el.authMsg.textContent = err?.message ? String(err.message) : 'Could not start X sign-in.';
        el.authMsg.className = 'share-modal-note is-err';
      }
    });

    // After a signInWithX() round trip lands back here, say what happened
    // and resume the save if that's what triggered the login prompt.
    function handleXSigninReturn() {
      const notice = window.TrollrunnerAccounts?.consumeXSigninNotice?.();
      if (!notice) return;
      let wantsSave = false;
      try { wantsSave = sessionStorage.getItem(X_SAVE_INTENT_KEY) === '1'; sessionStorage.removeItem(X_SAVE_INTENT_KEY); } catch {}
      if (notice.error) {
        openAuthModal(wantsSave);
        el.authMsg.textContent = notice.error;
        el.authMsg.className = 'share-modal-note is-err';
        return;
      }
      if (wantsSave) saveToProfile();
    }
    window.addEventListener('trollrunner:auth-changed', () => { updateAuthUI(); handleXSigninReturn(); });

    async function saveToProfile() {
      const accounts = window.TrollrunnerAccounts;
      if (!accounts?.getCachedProfile?.()) {
        openAuthModal(true);
        return;
      }
      const btn = document.getElementById('btn-save');
      btn.disabled = true;
      note('Uploading…');
      try {
        const blob = await renderToBlob();
        // uploadAvatar() sniffs type/name, resizes and points the profile at it.
        const file = new File([blob], filename(), { type: 'image/png' });
        await accounts.uploadAvatar(file);
        note('Saved. That grin is your profile picture now.', 'ok');
      } catch (err) {
        note(err?.message || 'Could not save that to your profile.', 'err');
      } finally {
        btn.disabled = false;
      }
    }

    /* ---------- boot ---------- */

    async function init() {
      try {
        const res = await fetch(MANIFEST_URL);
        if (!res.ok) throw new Error(`Trait manifest failed (${res.status}).`);
        manifest = await res.json();
      } catch (err) {
        note(err.message || 'Could not load the trait set.', 'err');
        el.summary.textContent = 'Traits unavailable';
        return;
      }

      // Preview stack: one <img> per layer (MULTI_LIMIT for a multi layer),
      // appended in manifest order so the DOM order IS the z-order
      // (background first, accessories last).
      for (const layer of manifest.layers) {
        const slots = MULTI_LAYERS.has(layer.id) ? MULTI_LIMIT : 1;
        const imgs = [];
        for (let i = 0; i < slots; i++) {
          const img = document.createElement('img');
          img.alt = '';
          img.decoding = 'async';
          el.stack.appendChild(img);
          imgs.push(img);
        }
        layerImg.set(layer.id, imgs);
      }

      const total = manifest.layers.reduce((n, l) => n + l.traits.length, 0);
      el.total.textContent = String(total);

      build = sanitize(readUrlBuild() || readStored() || defaultBuild());
      // No drawer is open at boot — the room starts as just a room, with the
      // hint text inviting the click. If a shared link/saved build already
      // has picks, jump straight to the outfit drawer so it isn't a dead end.
      activeLayer = null;
      persist();
      renderStack();
      syncHistory();
      note('');

      for (const btn of el.hotspots) {
        const layer = btn.dataset.layer;
        btn.addEventListener('click', () => openRoomPanel(layer));
        // Every hotspot lights its own piece of furniture; leaving one
        // clears the claim so the room drops back to the idle shot unless
        // something else (focus, an open drawer) still wants a shot up.
        btn.addEventListener('mouseenter', () => { hoveredLayer = layer; updateRoomArt(); });
        btn.addEventListener('mouseleave', () => {
          if (hoveredLayer === layer) hoveredLayer = null;
          updateRoomArt();
        });
        btn.addEventListener('focus', () => { focusedLayer = layer; updateRoomArt(); });
        btn.addEventListener('blur', () => {
          if (focusedLayer === layer) focusedLayer = null;
          updateRoomArt();
        });
      }
      el.roomPanelClose.addEventListener('click', closeRoomPanel);
      // Iframed inside the index.html desktop icon (or, now, the Hub's PFP
      // Studio tab — window.self === window.top is false either way, one
      // level deep or two), "/" would reload the whole site's boot/lock
      // sequence into that small window and look broken — only navigate
      // home when this is a real top-level page.
      document.getElementById('btn-home').addEventListener('click', () => {
        if (window.self === window.top) {
          // Read by index.html to skip world.html's lock-drag and boot
          // typing animation — we're coming back in, not landing fresh.
          try { sessionStorage.setItem('trollrunner_skip_entrance', '1'); } catch {}
          location.href = '/';
        } else {
          closeRoomPanel();
        }
      });
      document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        if (!el.authModal.hidden) closeAuthModal();
        else if (!el.adminBugsModal.hidden) closeAdminBugsModal();
        else if (!el.shareModal.hidden) closeShareModal();
        else if (!el.roomPanel.hidden) closeRoomPanel();
      });
      updateAuthUI();

      el.search.addEventListener('input', renderGrid);
      document.getElementById('btn-back').addEventListener('click', stepBack);
      document.getElementById('btn-surprise').addEventListener('click', () => {
        setBuild(randomBuild(true)); note('');
      });
      document.getElementById('btn-reset').addEventListener('click', () => {
        setBuild(defaultBuild()); note('');
      });
      document.getElementById('btn-download').addEventListener('click', openShareModal);
      document.getElementById('btn-save').addEventListener('click', saveToProfile);
      el.shareModalClose.addEventListener('click', closeShareModal);
      el.shareModalBackdrop.addEventListener('click', closeShareModal);
      el.btnShareX.addEventListener('click', shareOnX);
      el.btnShareDownload.addEventListener('click', downloadFromModal);
      initBugReport();
    }

    init();

    /* ---------- report a bug ----------
       Red button opens a small comment box; TrollPfpBugs (pfp-bug-reports.js)
       owns the actual submit + the 500-char / 10-minute-per-browser cooldown
       — this just wires the DOM and shows whatever it reports back. */
    window.TrollPfpBuild = () => ({ ...build });

    function bugReportNote(msg, kind) {
      el.bugReportNote.textContent = msg || '';
      el.bugReportNote.className = 'bug-report-note' + (kind ? ` is-${kind}` : '');
    }

    function updateBugReportCount() {
      const len = el.bugReportText.value.length;
      const max = window.TrollPfpBugs?.MAX_LEN || 500;
      el.bugReportCount.textContent = `${len} / ${max}`;
      el.bugReportCount.classList.toggle('is-over', len > max);
    }

    function openBugReportBox() {
      el.bugReportBox.hidden = false;
      el.btnReportBug.setAttribute('aria-expanded', 'true');
      const remaining = window.TrollPfpBugs?.msRemaining?.() || 0;
      if (remaining > 0) {
        el.bugReportText.disabled = true;
        el.bugReportSend.disabled = true;
        bugReportNote(`You can send another report in ${window.TrollPfpBugs.formatRemaining(remaining)}.`);
      } else {
        el.bugReportText.disabled = false;
        el.bugReportSend.disabled = false;
        el.bugReportText.focus();
      }
    }

    function closeBugReportBox() {
      el.bugReportBox.hidden = true;
      el.btnReportBug.setAttribute('aria-expanded', 'false');
      bugReportNote('');
    }

    async function sendBugReport() {
      if (!window.TrollPfpBugs) { bugReportNote('Report service unavailable — try again in a bit.', 'err'); return; }
      el.bugReportSend.disabled = true;
      const result = await window.TrollPfpBugs.submit(el.bugReportText.value);
      if (!result.ok) {
        bugReportNote(result.message || 'Could not send that — try again.', 'err');
        el.bugReportSend.disabled = false;
        return;
      }
      bugReportNote('Thanks — sent to the troll runner.', 'ok');
      el.bugReportText.value = '';
      updateBugReportCount();
      el.bugReportText.disabled = true;
      // Send stays disabled too: the 10-minute cooldown just started.
    }

    function initBugReport() {
      el.btnReportBug.addEventListener('click', () => {
        if (el.bugReportBox.hidden) openBugReportBox();
        else closeBugReportBox();
      });
      el.bugReportCancel.addEventListener('click', closeBugReportBox);
      el.bugReportText.addEventListener('input', updateBugReportCount);
      el.bugReportSend.addEventListener('click', sendBugReport);
      updateBugReportCount();

      el.btnAdminBugs.addEventListener('click', openAdminBugsModal);
      el.adminBugsClose.addEventListener('click', closeAdminBugsModal);
      el.adminBugsBackdrop.addEventListener('click', closeAdminBugsModal);
    }

    /* ---------- admin: view/resolve reports (troll_runner only) ----------
       Visibility is gated in updateAuthUI(); the real gate is the RLS
       policy, so list()/resolve() calls from anyone else just come back
       empty rather than needing a client-side check here too. */
    async function refreshAdminBugsBadge() {
      const result = await window.TrollPfpBugs?.list?.();
      const openCount = (result?.reports || []).filter(r => r.status !== 'resolved').length;
      el.adminBugsBadge.hidden = openCount === 0;
      el.adminBugsBadge.textContent = String(openCount);
    }

    function renderAdminBugRow(report) {
      const row = document.createElement('div');
      row.className = 'admin-bug-row' + (report.status === 'resolved' ? ' is-resolved' : '');
      const msg = document.createElement('div');
      msg.className = 'msg';
      msg.textContent = report.message;
      row.appendChild(msg);
      const meta = document.createElement('div');
      meta.className = 'meta';
      const when = document.createElement('span');
      when.textContent = new Date(report.created_at).toLocaleString();
      meta.appendChild(when);
      if (report.status !== 'resolved') {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'resolve-btn';
        btn.textContent = 'Mark resolved';
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          const result = await window.TrollPfpBugs.resolve(report.id);
          if (result.ok) { row.classList.add('is-resolved'); btn.remove(); refreshAdminBugsBadge(); }
          else btn.disabled = false;
        });
        meta.appendChild(btn);
      } else {
        const done = document.createElement('span');
        done.textContent = 'resolved';
        meta.appendChild(done);
      }
      row.appendChild(meta);
      return row;
    }

    async function openAdminBugsModal() {
      el.adminBugsModal.hidden = false;
      el.adminBugsList.innerHTML = '<p class="admin-bugs-empty">Loading…</p>';
      const result = await window.TrollPfpBugs?.list?.();
      const reports = result?.reports || [];
      el.adminBugsList.innerHTML = '';
      if (!reports.length) {
        el.adminBugsList.innerHTML = '<p class="admin-bugs-empty">No bug reports yet.</p>';
        return;
      }
      for (const report of reports) el.adminBugsList.appendChild(renderAdminBugRow(report));
    }

    function closeAdminBugsModal() {
      el.adminBugsModal.hidden = true;
    }

    /* ================= STARFIELD =================
       Same treatment as world.html's home page — canvas rather than
       hundreds of DOM nodes, static single paint under reduced motion. */
    const calm = matchMedia('(prefers-reduced-motion: reduce)');
    const starsCanvas = document.getElementById('stars');
    const starsCtx = starsCanvas.getContext('2d');
    let stars = [], starsRaf = 0;
    function seedStars() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      starsCanvas.width = Math.floor(innerWidth * dpr);
      starsCanvas.height = Math.floor(innerHeight * dpr);
      starsCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.round((innerWidth * innerHeight) / 9000);
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * innerWidth, y: Math.random() * innerHeight,
        r: Math.random() * 1.25 + 0.25, a: Math.random() * 0.5 + 0.25,
        tw: Math.random() * 0.02 + 0.004, p: Math.random() * Math.PI * 2,
      }));
    }
    function drawStars(t) {
      starsCtx.clearRect(0, 0, innerWidth, innerHeight);
      for (const s of stars) {
        const alpha = calm.matches ? s.a : s.a + Math.sin(t * s.tw + s.p) * 0.22;
        starsCtx.globalAlpha = Math.max(0.05, Math.min(1, alpha));
        starsCtx.fillStyle = '#fff';
        starsCtx.beginPath(); starsCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2); starsCtx.fill();
      }
      starsCtx.globalAlpha = 1;
    }
    function loopStars(t) { drawStars(t); starsRaf = requestAnimationFrame(loopStars); }
    function startStars() {
      cancelAnimationFrame(starsRaf); seedStars();
      if (calm.matches) drawStars(0); else starsRaf = requestAnimationFrame(loopStars);
    }
    addEventListener('resize', startStars, { passive: true });
    calm.addEventListener?.('change', startStars);
    startStars();
  })();
  </script>
</body>
</html>
